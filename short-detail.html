<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Drama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Short drama detail (Figma Movies "Short Movies VOD": default_mdType 2612:39184, the Episodes tab 2612:39207 / 39272,
  Unlock Episode 2612:39403, You May Also Like 2612:39185), opened from a card in Home's Shorts row (?s=0..7).
  A 1920x1080 TV screen scaled to the window, in Store's theme; the shared gliding focus ring is focus-ring.js, the
  top bar's photo opens the profile panel (profile-panel.js), the action buttons are Movie Detail's glass buttons.

  - The top: the short's picture as Home's hero (bright, a dark wash on the left, fading into the page), its title,
    platform, genres, year, length, rating, synopsis, then Play Ep.N (where the vertical player left off, player.html
    ?short=), My List, Like, Dislike. An open episode plays in that player. The bar at the bottom
    of the screen holds the two tabs.
  - Down onto the tabs, the page moves up so they sit at the top; a tab is picked as focus lands on it (as Store's).
    Episodes: the ranges (1-40 ... 121-160; as the TV Guide's sub-categories: text only, Enter picks one, underlined),
    then a grid of 10 a row. Episodes 1-10 are free;
    from 11 they are locked until unlocked. You May Also Like: other shorts, 6 a row. The focused grid row sits in
    the first row's place.
  - A locked episode opens Unlock this content: Subscribe to a package (All Packages on its Short Drama tab, which
    comes back here), Buy this series (its detail page's Buy: package-detail.html?short=N&opt=buy), Buy episode N
    (package-detail.html?short=N&opt=ep&ep=N, SHORT.EP_PRICE), or Watch Ads (an ad, a few a day). Close / Back keeps
    the episode locked.
  - The top bar is visible on the top part, and steps away below it until Up / Left brings it back (as Store's).
  Remote / keyboard: arrows move, Enter selects, Esc / Back goes up a level (the popup, the tabs, the top), then home.
-->
<link rel="stylesheet" href="button-theme.css">
<link rel="stylesheet" href="platform-tag.css">
<link rel="stylesheet" href="short-detail/short-detail.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div id="frame"><div id="screen">
  <div id="page">
    <section class="top">
      <div class="pic"></div>
      <div class="hero">
        <h1></h1>
        <div class="metarow"><span class="plat ptag ais" aria-label="AIS PLAY"></span><span class="gen"></span><span class="yr"></span><span class="len"></span><span class="pill rate"></span><span class="pill">HD</span></div>
        <p class="syn"></p>
        <div class="actions">
          <div class="tv-btn tv-btn--primary main item" data-act="play" data-ring-art=""><i class="ic-play"></i><span>Play Ep.1</span></div>
          <div class="tv-btn tv-btn--secondary ic item" data-act="toggle" data-label="My List" data-toggle="Added to My List|Removed from My List" data-tip="Add to My List" data-tip-on="Remove from My List" data-ring-art=""><img src="icons/detail-plus.svg" alt="My List"><span class="tip"></span></div>
          <div class="tv-btn tv-btn--secondary ic item" data-act="toggle" data-label="Like" data-toggle="You liked this|Like removed" data-pair="1" data-tip="I like this" data-tip-on="Remove like" data-ring-art=""><img src="icons/detail-like.svg" alt="Like"><span class="tip"></span></div>
          <div class="tv-btn tv-btn--secondary ic item" data-act="toggle" data-label="Dislike" data-toggle="You disliked this|Dislike removed" data-pair="2" data-tip="Not for me" data-tip-on="Remove dislike" data-ring-art=""><img src="icons/detail-dislike.svg" alt="Dislike"><span class="tip"></span></div>
        </div>
      </div>
    </section>
    <div class="tabsbar">
      <div class="ttab tv-btn tv-btn--secondary item" data-tab="eps" data-ring-art="">Episodes</div>
      <div class="ttab tv-btn tv-btn--secondary item" data-tab="likes" data-ring-art="">You May Also Like</div>
    </div>
    <section class="panel" data-panel="eps"><div class="ranges"></div><div class="gwin ep-win"><div class="eps"></div></div></section>
    <section class="panel" data-panel="likes"><div class="gwin like-win"><div class="likes"></div></div></section>
  </div>

  <div class="scrim" aria-hidden="true"></div>
  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item active" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV" data-href="tv-guide.html?play=MUTV&amp;from=detail">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movie" data-href="movie.html">Movie</div>
      <div class="navtab tv-tab item" data-label="Sport" data-href="sport.html">Sport</div>
      <div class="navtab tv-tab item" data-label="My List">My List</div>
      <div class="navtab tv-tab item" data-label="Store" data-href="store.html">Store</div>
    </div>
  </nav>

  <div class="mscrim"></div>
  <!-- Unlock (Figma PLAY-player "Modal Dialog (TV)" 2223:102007): the short on the left, the ways to unlock on the right
       (radio cards: name, what it gives, price; short-detail-1.js fills them), then Close / Unlock Now -->
  <div class="modal" role="dialog" aria-label="Unlock this content">
    <div class="mleft">
      <div class="head"><img src="icons/short/unlock.svg" alt=""><h2>Unlock this content</h2><p id="mSub">Choose how you would like to unlock</p></div>
      <div class="mposter" id="mPoster"></div>
    </div>
    <div class="mdiv"></div>
    <div class="mright">
      <div class="opts" id="mOpts"></div>
      <div class="mbtns"><div class="tv-btn tv-btn--secondary mbtn item" data-m="close" data-ring-art="">Close</div><div class="tv-btn tv-btn--primary mbtn item" data-m="confirm" data-ring-art="">Unlock Now</div></div>
    </div>
  </div>
  <div class="ad"><span class="tag">Ad</span><span class="count"></span></div>
  <div id="toast"></div>
</div></div>

<script src="profile-panel.js"></script>
<script src="content.js"></script>
<script src="packages.js"></script>
<script src="tv-screen.js"></script>
<script src="icon-toggle.js"></script>
<script src="short-detail/short-detail-1.js"></script>
<script src="focus-ring.js"></script>
<script src="toast.js"></script>
</body>
</html>
