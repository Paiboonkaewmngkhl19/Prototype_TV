<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Roboto:wght@700&display=swap" rel="stylesheet">
<!--
  The VOD player for movies, series and shorts (player.css shared with live-tv-player.html). Movies (Figma "player Movie default" 2700:17417, "Movie You May Also Like" 2700:17232), opened by Play /
  Resume / Start Over on movie-detail.html (?k=<title> from content.js, &start=1 from the beginning). The Live TV
  player's look (live-tv-player.html): back + title on top; the seek bar (play / pause, time played, the bar, the length),
  Start Over, Subtitle/Audio, Settings and "You may also like" at the bottom; scrims; the controls fade out when idle.
  Layout per Figma PLAY-player "Player - VOD Movies" (2028:85952): time played on the left, time left on the right.
  No channel, no live edge: the bar runs over the whole title. The picture is a demo clip, looping, while the time runs
  over the title's own length. "You may also like" opens a row of other titles; Enter plays one.
  A series (Figma Movies "Player - VOD Series" 2700:18286; ?k=&s=&e=): "S1 E5 : Episode" over the series name; Start Over,
  Next Episode, Select Episode (a row of the season's episodes, the one playing marked), Subtitle/Audio, Settings.
  Skip Intro shows through the intro (1:30), with or without the controls. In the credits (the last 30s) the controls give
  way to "Next Episode in" (5s, filling up) and Watch Credit; any key stops the countdown and leaves Next Episode /
  Watch Credit to pick; at the end the next episode plays.
  A short drama (Figma PLAY-player "player for Short Vertical" 2076:32401, "Vertical Content Player select ep" 2076:31710;
  ?short=N&ep=E): the 9:16 picture in the middle of a dark screen, the series' buttons; Select Episode opens the season,
  the 50-episode ranges and a grid of 10 a row (the one playing marked Watching, locked ones with a lock: Enter on one
  goes to the short's page to unlock it). At the end the next episode plays (a locked one: its unlock).
  Remote / keyboard: Up / Down between the back button, the seek bar and the buttons; Left / Right on the seek bar go 10s
  back / on (held: faster), Enter plays / pauses; Esc / Back closes the row, then returns to the detail page.
-->
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="player/player.css">
</head>
<body>
<div id="frame"><div id="screen">
  <video id="video" muted playsinline loop preload="auto"></video>
  <div class="scrim"></div>
  <div class="flash" id="flash"><img id="flashIc" src="icons/player/pause.svg" alt=""></div>
  <div class="ymal-view" id="ymalView">
    <div class="row-wrap">
      <div class="head"><div class="back item" data-act="ymal-back"><img src="icons/player/back.svg" alt="Back"></div>
        <div class="chip" id="rowChip"><img src="icons/player/you-may-also-like.svg" alt="">You may also like</div></div>
      <div class="row" id="ymalRow"></div>
    </div>
  </div>
  <div class="grid-view" id="gridView">
    <div class="gblock" id="gblock">
      <div class="head"><div class="back item" data-act="grid-back"><img src="icons/player/back.svg" alt="Back"></div>
        <div class="chip"><img src="icons/player/select-episode.svg" alt="">Select Episode</div></div>
      <div class="filters"><div class="seasons" id="seasons"></div><div class="ranges" id="ranges"></div></div>
      <div class="gwin"><div class="sgrid-eps" id="sgridEps"></div></div>
    </div>
  </div>
  <div class="top"><div class="back item" data-act="back"><img src="icons/player/back.svg" alt="Back"></div><div class="info"><div class="prog-t" id="title"></div><div class="meta" id="sub"></div></div></div>
  <div class="bottom">
    <div class="seek">
      <div class="play" id="playBtn"><img id="playIc" src="icons/player/pause.svg" alt="Pause"></div>
      <div class="tm" id="tmNow">0:00:00</div>
      <div class="track item" id="track" data-act="track"><div class="base"></div><div class="buf"></div><div class="played"></div><div class="handle"></div>
        <div class="thumb" id="thumb"><div class="pic"><video id="thumbV" muted playsinline preload="auto"></video>
          <div class="seekfx" id="seekfx"><div class="arr"><i></i><i></i><i></i></div><div class="lbl" id="seekLbl"></div></div></div><div class="t" id="thumbT"></div></div></div>
      <div class="tm end" id="tmEnd">- 0:00:00</div>
    </div>
    <div class="btns" id="btns"></div>
  </div>
  <div class="pchip solo skip item" id="skip" data-act="skip" hidden>Skip Intro</div>
  <div class="nextup" id="nextup"></div>
  <div id="toast"></div>
</div></div>

<script src="content.js"></script>
<script src="tv-screen.js"></script>
<script src="player/player-1.js"></script>
<script src="focus-ring.js"></script>
</body>
</html>
