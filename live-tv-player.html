<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live TV</title>
<!-- a channel change opens the player with its controls already away (see html.quiet-start) -->
<script>if(/[?&](quiet|nochan)=/.test(location.search)) document.documentElement.classList.add('quiet-start');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Roboto:wght@700&display=swap" rel="stylesheet">
<!--
  Live TV player, opened with Enter on a channel in the TV Guide (tv-guide.html). From Figma PLAY-player
  "player Live TV" (1856:21643): channel + programme on top, the free-preview chip / Explore Package, the seek bar and
  the action buttons at the bottom, over the playing channel.
  The channel and programme come in the query string (see openPlayer() in tv-guide.html).
  A 1920x1080 TV screen scaled to the window, like tv-guide.html.
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back returns to the TV Guide. The controls fade out after
  a few seconds without a key press; the first key brings them back.
-->
<style>
  :root{
    color-scheme:dark;
    --on-surface-variant:#a8a8a8; --inverse-surface:#e8e8e8; --on-inverse-surface:#101010; --outline:#5a5a5a;
    --surface-container-highest:#4a4a4a; --avatar:#404045;
    /* Home's Default theme (home.html, tv-guide.html): frosted grey glass cards and the white glass pill for the selection */
    --glass-card:linear-gradient(180deg, rgba(161,161,161,.25), rgba(65,65,65,.25));
    --glass-card-on:linear-gradient(180deg, rgba(230,230,240,.42), rgba(150,150,165,.34));
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    --pill-hi:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%);
    --inter:'Inter', system-ui, sans-serif;
    --noto:'Noto Sans', 'Noto Sans Thai', system-ui, sans-serif;
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:#fff; font-family:var(--noto); }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:#000; }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; background:#000; }
  video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* the controls: scrims top and bottom, then the two bars; they fade out together when idle, except on a free preview,
     where the free-preview chip and Explore Package stay and slide down to the bottom edge (seek bar + buttons + gaps:
     32 + 32 + 32 + 80 = 176px) */
  .ui{ position:absolute; inset:0; }
  .scrim, .top, .seek, .btns{ transition:opacity .35s ease; }
  body.idle .scrim, body.idle .top, body.idle .seek, body.idle .btns, body.idle .no-preview .cta-row{ opacity:0; }
  .cta-row{ transition:transform .35s cubic-bezier(.2,0,0,1), opacity .35s ease; }
  body.idle .cta-row{ transform:translateY(176px); }
  /* opened by a channel change: hidden from the very first frame, with no fade (the script below the page makes it idle
     and then drops this) */
  html.quiet-start .scrim, html.quiet-start .top, html.quiet-start .seek, html.quiet-start .btns, html.quiet-start .no-preview .cta-row{ opacity:0; }
  html.quiet-start .cta-row{ transform:translateY(176px); }
  html.quiet-start *{ transition:none !important; }
  .ui{ pointer-events:none; }   /* clicks go through to the picture (play / pause), except on the controls */
  .ui .item, .ui .play{ pointer-events:auto; }
  .scrim{ position:absolute; inset:0; pointer-events:none;
    /* lighter than Figma's (black to 21% / 90% to 7%), so the picture still shows behind the controls */
    background:linear-gradient(0deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.45) 18%, rgba(0,0,0,0) 36%), linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 26%); }

  /* top: back, channel logo, programme / channel / number / time */
  .top{ position:absolute; left:0; top:0; padding:60px 90px; display:flex; align-items:center; gap:24px; }
  .back{ width:80px; height:80px; border-radius:9999px; flex:0 0 auto; }
  .back img{ display:block; width:80px; height:80px; }
  .ava{ position:relative; width:90px; height:90px; border-radius:100px; overflow:hidden; flex:0 0 auto; background:var(--avatar); }
  .ava img{ position:absolute; }
  .ava img.cover{ inset:0; width:100%; height:100%; object-fit:cover; }
  .ava img.contain{ left:12%; top:12%; width:76%; height:76%; object-fit:contain; }
  .ava.txt{ display:flex; align-items:center; justify-content:center; text-align:center; font:700 22px/1.1 var(--noto); }
  .info{ height:112px; display:flex; flex-direction:column; justify-content:center; gap:24px; min-width:0; }
  .prog-t{ max-width:1500px; font:700 40px/32px Roboto, sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta{ display:flex; align-items:center; gap:16px; font:500 24px/1.2 var(--noto); letter-spacing:-.24px; white-space:nowrap; }
  .crown{ position:relative; width:40px; height:40px; flex:0 0 auto; }
  .crown img{ position:absolute; left:6px; top:9.33px; width:28px; height:21.33px; }   /* 32px crown in its 40px box, shape inset 16.67% / 6.25% */
  .crown.owned img{ left:4px; top:4px; width:32px; height:32px; }   /* the whole 20px Crown State icon, at the header's 32px */
  .ch-no{ height:40px; box-sizing:border-box; padding:8px 12px; border-radius:8px; display:flex; align-items:center;
    background:rgba(0,0,0,.35); font:600 24px/normal var(--noto); }   /* the number chip of the TV Guide, Home and the mini EPG */

  /* bottom: free preview + Explore Package, the seek bar, the action buttons */
  .bottom{ position:absolute; left:0; right:0; bottom:0; padding:60px 90px; display:flex; flex-direction:column; gap:32px; }
  .cta-row{ display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .preview{ height:80px; box-sizing:border-box; padding:16px 32px; border-radius:12px; background:rgba(0,0,0,.13);
    display:flex; align-items:center; font:24px/16px var(--inter); white-space:nowrap; }
  .preview b{ font-weight:600; color:var(--on-surface-variant); }
  .preview span{ position:relative; margin-left:36px; font-weight:500; color:var(--inverse-surface); }
  .preview span::before{ content:'•'; position:absolute; left:-21px; }
  .explore{ height:84px; box-sizing:border-box; padding:16px 32px; border-radius:12px; background:var(--inverse-surface);
    box-shadow:0 6px 20px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);   /* lifts it off the picture */
    display:flex; align-items:center; gap:16px; font:500 24px/32px var(--inter); color:var(--on-inverse-surface); white-space:nowrap; }
  .explore img{ width:32px; height:32px; display:block; }
  .no-preview .preview, .no-preview .explore{ visibility:hidden; }
  /* the chip's faint edge in Figma (1895:174884); filled like the site's other glass chips (Home / TV Guide --glass-chip),
     with the picture blurred behind it */
  .preview{ background:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.2)), rgba(255,255,255,.13);   /* the glass chip, 20% darker */
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); }
  /* free preview used up: the picture stops and dims behind the controls, which stay up */
  body.preview-over video{ filter:brightness(.4); transition:filter .4s ease; }

  .seek{ height:32px; display:flex; align-items:center; gap:12px; }
  .play{ width:40px; height:40px; border-radius:8px; flex:0 0 auto; }
  .play img{ display:block; width:40px; height:40px; }
  .seek .tm{ font:400 24px/28px var(--inter); color:var(--on-surface-variant); white-space:nowrap; }
  /* the track, Figma "Local Seek bar component": at rest a thin 8px bar with no handle (1895:175050); focused 12px with the
     handle (1895:174905), the bar stopping 10px short of the end for it. --f (0..1) is how far the playhead is */
  .track{ --f:0; --r:0px; position:relative; flex:1; height:32px; border-radius:6px; }
  .track .base, .track .buf, .track .played{ position:absolute; left:0; top:12px; height:8px; border-radius:4px;
    transition:top .2s ease, height .2s ease, border-radius .2s ease, right .2s ease, width .2s ease; }
  .track .base{ right:var(--r); background:var(--surface-container-highest); }
  .track .buf{ width:calc(var(--b, 0) * (100% - var(--r))); background:var(--on-surface-variant); opacity:.4; }
  .track .played{ width:calc(var(--f) * (100% - var(--r))); }
  .track.on{ --r:10px; }
  .track.on .base, .track.on .buf, .track.on .played{ top:8px; height:16px; border-radius:8px; }   /* 16px (Figma: 12px) */
  .track .played{ background:#ff1f1f; }   /* a strong live red */
  .track .handle{ position:absolute; top:4px; left:calc(var(--f) * (100% - var(--r))); width:24px; height:24px; box-sizing:border-box; margin-left:-12px; border-radius:12px;
    border:4px solid #fff; background:var(--inverse-surface); box-shadow:0 2px 6px rgba(0,0,0,.25);
    opacity:0; transform:scale(.3); transition:opacity .2s ease, transform .2s ease; }
  .track.on .handle{ opacity:1; transform:none; }
  /* no Time Shift on this programme: the bar stays full at live, with no handle, no play / pause and no Start Over */
  .no-ts .track .handle, .no-ts .play, .no-ts .btn[data-act="start-over"]{ display:none; }

  /* Time Shift scrubbing: a thumbnail of that moment over the handle, its time under it, and the speed while held */
  .thumb{ position:absolute; bottom:48px; left:0; width:320px; margin-left:-160px; pointer-events:none; opacity:0; transition:opacity .15s ease; }
  .thumb.on{ opacity:1; }
  .thumb .pic{ position:relative; width:320px; height:180px; box-sizing:border-box; border-radius:12px; overflow:hidden; border:3px solid #fff;
    background:#111; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .t{ margin-top:8px; text-align:center; font:500 24px/28px var(--inter); text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .thumb .spd{ position:absolute; left:10px; top:10px; padding:4px 10px; border-radius:8px; background:rgba(0,0,0,.65); font:600 20px/24px var(--inter); display:none; }
  .thumb .spd.on{ display:block; }

  .btns{ display:flex; align-items:center; gap:16px; }
  /* action buttons: an icon at rest; focused, the label opens beside it as in Figma's "TV / Button" focus state
     (1867:117993), with the page's usual focus look (the shared glass ring, white icon and label) */
  .btn{ padding:24px; border-radius:9999px; display:flex; align-items:center; transition:background .2s ease; }
  .btn img{ width:32px; height:32px; display:block; }
  .btn .lbl{ max-width:0; overflow:hidden; white-space:nowrap; font:500 24px/32px var(--inter); color:#fff;
    transition:max-width .25s cubic-bezier(.2,0,0,1), margin-left .25s cubic-bezier(.2,0,0,1); }
  .btn.focused .lbl{ max-width:320px; margin-left:16px; }
  .btn.focused, .back.focused{ background:rgba(255,255,255,.3);
    backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4); }   /* frosted: lighter fill, the picture blurred behind it */

  /* Add Favorite, as in the TV Guide (tv-guide.html): the button's heart bounces in with a ring and a burst of sparks
     while a big heart pops in the middle of the picture and floats away; removing it just shrinks the heart back */
  .fav-ic-wrap{ position:relative; display:block; width:32px; height:32px; flex:0 0 auto; }
  .fav-ic-wrap img{ position:relative; z-index:1; }
  .fav-ic-wrap img.pop{ animation:favPop .55s cubic-bezier(.2,1.6,.4,1); }
  .fav-ic-wrap img.unpop{ animation:favUnpop .3s ease; }
  @keyframes favPop{ 0%{ transform:scale(0); } 60%{ transform:scale(1.45); } 100%{ transform:scale(1); } }
  @keyframes favUnpop{ 0%{ transform:scale(1); } 45%{ transform:scale(.6); } 100%{ transform:scale(1); } }
  .fav-burst{ position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; }
  .fav-burst .ring{ position:absolute; left:-26px; top:-26px; width:52px; height:52px; border-radius:50%; box-sizing:border-box;
    border:3px solid #fff; animation:favRing .5s ease-out forwards; }
  .fav-burst i{ position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:#fff;
    animation:favSpark .6s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes favRing{ 0%{ transform:scale(.2); opacity:1; } 100%{ transform:scale(1.5); opacity:0; border-width:0; } }
  @keyframes favSpark{ 0%{ transform:rotate(var(--a)) translateY(0) scale(1); opacity:1; } 100%{ transform:rotate(var(--a)) translateY(-42px) scale(.2); opacity:0; } }
  .fav-big{ position:absolute; left:50%; top:50%; width:200px; height:200px; margin:-100px 0 0 -100px; z-index:20; pointer-events:none;
    background:url('icons/tv-guide/heart-fill.svg') center / contain no-repeat; filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
    animation:favBig 1s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes favBig{ 0%{ transform:scale(0) rotate(-15deg); opacity:0; } 25%{ transform:scale(1.25) rotate(8deg); opacity:1; }
    45%{ transform:scale(.95) rotate(0); opacity:1; } 70%{ transform:translateY(-14px) scale(1); opacity:1; }
    100%{ transform:translateY(-110px) scale(.7); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .fav-ic-wrap img.pop, .fav-ic-wrap img.unpop{ animation:none; } .fav-burst, .fav-big{ display:none; } }

  /* play / pause flash in the middle of the picture, as on Netflix: the new state's icon pops in a dark disc and fades
     out, whether or not the controls are up */
  .flash{ position:absolute; left:50%; top:50%; width:160px; height:160px; margin:-80px 0 0 -80px; border-radius:50%; z-index:20; pointer-events:none;
    display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); opacity:0; }
  .flash img{ width:80px; height:80px; display:block; }
  .flash.go{ animation:flash .7s cubic-bezier(.2,0,0,1); }
  @keyframes flash{ 0%{ opacity:0; transform:scale(.6); } 20%{ opacity:1; transform:scale(1); } 60%{ opacity:1; transform:scale(1.05); } 100%{ opacity:0; transform:scale(1.3); } }
  @media (prefers-reduced-motion: reduce){ .flash.go{ animation:flashFade .7s linear; } @keyframes flashFade{ 0%, 60%{ opacity:1; } 100%{ opacity:0; } } }

  /* ---------- mini EPG (Figma PLAY-epg "Wake mini epg", 3168:169155): Browse Channels, or Left with the controls away.
     A black-to-clear panel on the left: the category bar (the TV Guide's tabs as icons), the category's name and its
     channels, the focused one opened up (bigger, white edge, Up Next) ---------- */
  body.mini-on .ui{ opacity:0 !important; pointer-events:none; }
  .mini{ position:absolute; left:0; top:0; width:958px; height:1080px; z-index:15; pointer-events:none;
    background:linear-gradient(270deg, rgba(0,0,0,0), #000); opacity:0; transform:translateX(-60px);
    transition:opacity .3s ease, transform .3s cubic-bezier(.2,0,0,1); }
  body.mini-on .mini{ opacity:1; transform:none; pointer-events:auto; }
  .mini-in{ display:flex; gap:32px; height:100%; box-sizing:border-box; padding:60px 0 0 90px; }   /* no bottom padding: the list runs to the screen's edge */
  .mini-cats{ display:flex; flex-direction:column; gap:16px; flex:0 0 auto; }
  /* category chips in the site's theme, as the TV Guide's tabs: a thin outline and a grey icon at rest, the chosen one
     dim-filled with a white icon, the white glass pill when focus is on it; the shared glass ring follows focus */
  .mcat{ width:64px; height:64px; box-sizing:border-box; border-radius:12px; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); transition:background .22s cubic-bezier(.2,0,0,1); }
  .mcat img{ width:32px; height:32px; display:block; filter:brightness(0) invert(.66); }   /* --on-surface-variant grey */
  .mcat.sel{ background:rgba(255,255,255,.22); box-shadow:none; }
  .mcat.sel.focused{ background:var(--pill-hi), var(--th-pill); }
  .mcat.sel img, .mcat.focused img{ filter:brightness(0) invert(1); }
  .mcat[data-cat="guide"]{ box-shadow:none; }
  /* focus on the TV Guide shortcut (Figma "Mini-EPG From Player"): it takes the theme's white glass pill with a white
     icon, as a focused chosen category does; the title reads View Program Guide and the channels make way */
  .mcat[data-cat="guide"].focused{ background:var(--pill-hi), var(--th-pill); }
  .mini-scroll{ transition:opacity .2s ease-out; }
  .mini.to-guide .mini-scroll{ opacity:0; }
  .mini-div{ width:64px; height:4px; display:block; }
  .mini-main{ display:flex; flex-direction:column; gap:16px; width:600px; min-width:0; height:100%; }
  .mini-title{ position:relative; z-index:1; height:68px; display:flex; align-items:center; font:500 32px/normal var(--inter); flex:0 0 auto; }   /* above the list, as a safety net */
  /* no mask here: a masked parent would stop the cards' backdrop blur from reaching the picture */
  /* the list's own window, starting right under the title (the 16px gap taken back) and clipping its cards, so none is
     ever drawn over the title, mid-animation included. Its top 24px is the fade; the focused card sits below it, at
     MINI_SLOT (32px), its ring (8px) clear of the fade */
  .mini-scroll{ position:relative; flex:1; min-height:0; margin-top:-16px; overflow:hidden; }
  .mini-list{ display:flex; flex-direction:column; gap:12px; transition:transform .2s ease-out; }
  .mini-empty{ font:400 24px/1.3 var(--noto); color:var(--on-surface-variant); padding-top:8px; }
  /* Home's channel card glass, darkened and frosted so the cards read over a bright picture */
  .mcard{ width:530px; box-sizing:border-box; border-radius:12px; flex:0 0 auto;
    background:linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), var(--glass-card);
    backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4);
    transition:width .2s ease-out, background .2s ease-out; }
  .mcard .m1{ display:flex; align-items:flex-start; gap:16px; padding:16px; }
  .mava{ position:relative; width:64px; height:64px; border-radius:100px; overflow:hidden; flex:0 0 auto; background:var(--avatar);
    transition:width .2s ease-out, height .2s ease-out, font-size .2s ease-out; }
  .mava img{ position:absolute; }
  .mava img.cover{ inset:0; width:100%; height:100%; object-fit:cover; }
  .mava img.contain{ left:12%; top:12%; width:76%; height:76%; object-fit:contain; }
  .mava.txt{ display:flex; align-items:center; justify-content:center; text-align:center; font:700 15px/1.1 var(--noto); }
  .minfo{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; justify-content:center; }
  .mname-row{ display:flex; align-items:center; gap:16px; min-height:40px; }   /* the same height with or without chips, so every card is too */
  .mname{ flex:1; min-width:0; font:500 24px/1.2 var(--noto); letter-spacing:-.24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:font-size .2s ease-out; }
  .mchips{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .mico{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .mico img{ width:20px; height:20px; display:block; }
  .mno{ height:40px; min-width:40px; box-sizing:border-box; padding:8px 12px; border-radius:8px; background:rgba(0,0,0,.35);   /* the TV Guide's number chip */
    display:flex; align-items:center; justify-content:center; font:600 20px/normal var(--noto); }
  .mprog{ font:500 20px/1.2 var(--noto); letter-spacing:-.24px; color:#d6d6d6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:font-size .2s ease-out; }
  .mtime{ display:flex; align-items:center; gap:16px; height:28px; margin-top:4px; font:500 20px/1.2 var(--noto); letter-spacing:-.24px; color:#d6d6d6; white-space:nowrap; }
  .mtags{ display:flex; align-items:center; gap:8px; }
  .mtags > img{ width:24px; height:24px; display:block; }
  .mtag{ height:26px; box-sizing:border-box; padding:4px; border-radius:4px; display:flex; align-items:center; gap:4px; border:1px solid var(--inverse-surface);
    font:500 16px/1.2 var(--noto); letter-spacing:-.24px; color:rgba(255,255,255,.8); }
  .mtag.watch{ background:#59d478; }
  .mtag.plain{ border-color:#5d5d5d; background:rgba(255,255,255,.16); font-weight:400; }   /* the TV Guide's On Air / Don't Miss tag */
  .mtag img{ width:16px; height:16px; display:block; }
  /* Up Next: folded away on a default card, it folds open and fades in on the focused one (same 200ms) */
  .mnext{ display:flex; gap:4px; max-height:0; opacity:0; padding:0 16px 0 122px; border-top:1px solid transparent; font:500 24px/1.2 var(--noto); letter-spacing:-.24px;
    color:rgba(255,255,255,.7); white-space:nowrap; overflow:hidden;
    transition:max-height .2s ease-out, opacity .2s ease-out, padding .2s ease-out, border-color .2s ease-out; }
  .mnext b{ font-weight:700; flex:0 0 auto; }
  .mnext span{ overflow:hidden; text-overflow:ellipsis; }
  /* the focused channel (Figma "Mini_Card_B" focus: wider, a bigger logo and type, and Up Next) in the site's theme:
     the lighter focused glass with the shared glass ring around it */
  .mini-list.measure, .mini-list.measure *{ transition:none !important; }
  /* a card leaving at the top fades out over the window's top 24px, as the TV Guide's page does under its header. Per
     card (--cut: from the card's top to the window's top), as a mask on the window would stop the cards' backdrop blur;
     registered so it rides the same 200ms as the list */
  @property --cut{ syntax:'<length>'; inherits:false; initial-value:-9999px; }
  .mcard{ -webkit-mask-image:linear-gradient(180deg, transparent var(--cut), #000 calc(var(--cut) + 24px));
    mask-image:linear-gradient(180deg, transparent var(--cut), #000 calc(var(--cut) + 24px));
    transition:width .2s ease-out, background .2s ease-out, --cut .2s ease-out; }
  .mcard.focused{ width:600px; background:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.2)), var(--glass-card-on); }   /* still lighter than the rest */
  .mcard.focused .mava{ width:90px; height:90px; }
  .mcard.focused .mava.txt{ font-size:20px; }
  .mcard.focused .minfo{ gap:6px; }
  .mcard.focused .mname{ font-size:28px; }
  .mcard.focused .mno{ font-size:24px; }
  .mcard.focused .mico.owned img{ width:24px; height:24px; }
  .mcard.focused .mprog{ font-size:22px; }
  .mcard.focused .mnext{ max-height:62px; opacity:1; padding:16px 16px 16px 122px; border-top-color:rgba(255,255,255,.18); }

  /* channel number typed on the remote, top right (over the controls or the bare picture); it tunes after a pause */
  .ch-in{ position:absolute; top:60px; right:90px; z-index:25; min-width:96px; height:96px; box-sizing:border-box; padding:0 28px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:6px; font:600 56px/1 var(--inter); letter-spacing:2px; font-variant-numeric:tabular-nums;
    background:linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), rgba(255,255,255,.13); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4);
    opacity:0; transform:translateY(-8px); transition:opacity .2s ease, transform .2s ease; pointer-events:none; }
  .ch-in.on{ opacity:1; transform:none; }
  .ch-in i{ font-style:normal; color:rgba(255,255,255,.35); }   /* the digits still to come */

  #toast{ position:absolute; left:50%; top:60px; transform:translateX(-50%); padding:14px 26px; border-radius:999px; z-index:30;
    background:rgba(20,20,24,.9); font-size:24px; opacity:0; transition:opacity .2s ease; pointer-events:none; white-space:nowrap; }
  #toast.on{ opacity:1; }

<body>
<div id="frame"><div id="screen" data-ring-plain>

      </div>
    </div>
    <div class="bottom" id="bottom">

      </div>

          <div class="thumb" id="thumb"><div class="pic"><video id="thumbV" muted playsinline preload="auto"></video><div class="spd" id="spd"></div></div><div class="t" id="thumbT"></div></div></div>
      </div>
      <div class="btns">
        <div class="btn item" data-act="mini-epg"><img src="icons/player/mini-epg.svg" alt=""><span class="lbl">Browse Channels</span></div>
        <div class="btn item" data-act="guide"><img src="icons/player/guide.svg" alt=""><span class="lbl">View Program Guide</span></div>
        <div class="btn item" data-act="start-over"><img src="icons/player/start-over.svg" alt=""><span class="lbl">Start Over</span></div>

        <div class="btn item" data-act="sub-audio"><img src="icons/player/sub-audio.svg" alt=""><span class="lbl">Subtitle/Audio</span></div>
        <div class="btn item" data-act="settings"><img src="icons/player/settings.svg" alt=""><span class="lbl">Settings</span></div>
      </div>
    </div>
  </div>
  <div class="flash" id="flash"><img id="flashIc" src="icons/player/pause.svg" alt=""></div>

    <div class="mini-cats" id="miniCats"></div>
    <div class="mini-main"><div class="mini-title" id="miniTitle"></div><div class="mini-scroll"><div class="mini-list" id="miniList"></div></div></div>
  </div></div>
  <div class="ch-in" id="chIn" aria-live="polite"></div>
  <div id="toast"></div>
</div></div>

<script>
(function(){
  var frame = document.getElementById('frame'), screen = document.getElementById('screen');
  function fit(){
    var K = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.width = 1920 * K + 'px'; frame.style.height = 1080 * K + 'px';
    frame.style.marginLeft = -960 * K + 'px'; frame.style.marginTop = -540 * K + 'px';
    screen.style.transform = 'scale(' + K + ')';
  }
  addEventListener('resize', fit); fit();
  var $ = function(q, el){ return Array.prototype.slice.call((el || document).querySelectorAll(q)); };
  var byId = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ---------- the channel and programme, from the query string ---------- */
  var q = {}; location.search.slice(1).split('&').forEach(function(kv){ if(!kv) return; var i = kv.indexOf('='); q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
  var C = { n:q.n || 'Channel', no:q.no || '', crown:q.crown || '', fav:q.fav === '1', logo:q.logo, fit:q.fit, box:q.box, bg:q.bg, txt:q.txt, fg:q.fg };
  var P = { t:q.t || '', start:new Date(+q.s || Date.now() - 30 * 60000), end:new Date(+q.e || Date.now() + 30 * 60000) };
  byId('video').src = byId('thumbV').src = q.v || 'video/hbo.mp4';   // the thumbnail is a second, paused copy
  // with sound: the browser may refuse to start unmuted without a key press on this page, so it then starts muted and
  // the sound comes on with the first key or click
  (function(v){
    v.play().catch(function(){
      v.muted = true; v.play();
      function unmute(){ v.muted = false; removeEventListener('keydown', unmute, true); removeEventListener('click', unmute, true); }
      addEventListener('keydown', unmute, true); addEventListener('click', unmute, true);
    });
  })(byId('video'));
  // Time Shift: set per programme in the TV Guide (its Time Shift icon). With it the viewer can pause, go back / forward
  // 10s, hold to scrub faster (with a thumbnail) and Start Over; without it the player stays live
  var TS = q.ts === '1';
  if(!TS) byId('bottom').classList.add('no-ts');

  var ava = byId('ava');
  if(!C.logo){ ava.className = 'ava txt'; ava.style.background = C.bg || ''; ava.style.color = C.fg || '#fff'; ava.textContent = C.txt || C.n; }
  else {
    if(C.bg) ava.style.background = C.bg;
    var b = C.box && C.box.split(',');
    ava.innerHTML = b ? '<img src="' + esc(C.logo) + '" alt="" style="left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[2] + '%;height:' + b[3] + '%;object-fit:contain;">'
                      : '<img class="' + (C.fit || 'cover') + '" src="' + esc(C.logo) + '" alt="">';
  }
  byId('progT').textContent = P.t;
  byId('chName').textContent = C.n;
  if(!C.crown) byId('crown').style.display = 'none';
  // a premium channel in the viewer's package: the crown with the green play mark, as on the TV Guide's cards
  else if(C.crown === 'owned'){ byId('crown').classList.add('owned'); byId('crown').querySelector('img').src = 'icons/tv-guide/crown.svg'; }
  if(C.no) byId('chNo').textContent = C.no; else byId('chNo').style.display = 'none';   // Exclusive channels have no number
  byId('progTm').textContent = hm(P.start) + ' - ' + hm(P.end);
  // free preview + Explore Package: a premium channel not in the viewer's package (gold crown, not 'owned')
  // (an owned premium channel, crown 'owned', plays in full). The 3 minutes count only while playing and are kept per
  // channel for this browser session, so leaving and coming back doesn't start them over
  var preview = C.crown === 'gold', PKEY = 'freePreview:' + C.n, previewLeft = 180;
  try { var kept = sessionStorage.getItem(PKEY); if(kept !== null) previewLeft = +kept; } catch(e){}
  if(!preview) byId('bottom').classList.add('no-preview');
  function previewText(){ byId('previewLeft').textContent = previewLeft ? Math.floor(previewLeft / 60) + ':' + pad(previewLeft % 60) + ' minutes left' : 'Ended'; }
  // out of preview: the picture stops for good (nothing can play it again), the controls stay up and focus goes to
  // Explore Package
  function endPreview(){
    var v = byId('video'); v.pause();
    document.body.classList.add('preview-over'); previewText();
    row = 1; col = 0; if(typeof paint === 'function') paint();
    toast('Free preview has ended. Get a package to keep watching');
  }
  byId('video').addEventListener('play', function(){ if(preview && !previewLeft) this.pause(); });
  function setFav(){ byId('favIc').src = C.fav ? 'icons/tv-guide/heart-fill.svg' : 'icons/player/fav.svg'; byId('favLbl').textContent = C.fav ? 'Remove Favorite' : 'Add Favorite'; }
  setFav();

  /* ---------- seek bar: the programme from its start up to now, so it is full at live. `behind` is how far (ms) the
     picture is behind live; `scrub` is where the viewer is moving to before it is applied ---------- */
  var behind = 0, scrub = null, STEP = 10000, holdT = null, holdStart = 0, commitT = null;
  function win(){ return Math.max(0, Math.min(P.end - P.start, Date.now() - P.start)); }   // how much can be gone back over
  function vmod(t){ var d = byId('video').duration || 0; return d ? ((t % d) + d) % d : 0; }   // the demo clip loops for the channel
  function hms(ms){ var s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
  function scrubBy(ms){
    if(scrub === null) scrub = behind;
    scrub = Math.max(0, Math.min(win(), scrub - ms));
    clearTimeout(commitT);
    var tv = byId('thumbV');
    if(tv.readyState) tv.currentTime = vmod(byId('video').currentTime - (scrub - behind) / 1000);
    byId('thumb').classList.add('on');
    paintSeek();
  }
  // the picture jumps to where the viewer stopped
  function commit(){
    clearTimeout(commitT);
    if(scrub === null) return;
    var v = byId('video'); v.currentTime = vmod(v.currentTime - (scrub - behind) / 1000);
    behind = scrub; scrub = null;
    byId('thumb').classList.remove('on'); setSpeed(0); paintSeek();
  }
  // holding Left / Right scrubs on its own, faster the longer it is held: 2x, 4x, 8x, 16x
  function setSpeed(s){ var el = byId('spd'); el.classList.toggle('on', !!s); el.textContent = s < 0 ? '◀◀ ' + -s + 'x' : s + 'x ▶▶'; }
  function startHold(dir){
    holdStart = Date.now();
    holdT = setInterval(function(){
      var t = (Date.now() - holdStart) / 1000, sp = t < 1 ? 2 : t < 2 ? 4 : t < 3 ? 8 : 16;
      setSpeed(sp * dir); scrubBy(dir * sp * 3000);   // 30s of the programme per second at 1x
    }, 100);
  }
  function stopHold(){ if(!holdT) return; clearInterval(holdT); holdT = null; setSpeed(0); commitT = setTimeout(commit, 800); }
  function paintSeek(){
    var W = win(), el = W - (scrub === null ? behind : scrub), f = W ? el / W : 1, tr = byId('track');
    byId('elapsed').textContent = hms(el);
    tr.style.setProperty('--f', f);
    tr.style.setProperty('--b', Math.min(1, f + .02));
    if(scrub !== null){
      var w = tr.offsetWidth - 10;   // the bar, focused
      byId('thumb').style.left = Math.max(160, Math.min(tr.offsetWidth - 160, f * w)) + 'px';
      byId('thumbT').textContent = hms(el);
    }
  }
  function tick(){
    // paused with Time Shift: live moves on, so the picture falls further behind it
    if(TS && byId('video').paused && scrub === null) behind = Math.min(win(), behind + 1000);
    paintSeek();
    if(preview && previewLeft > 0 && !byId('video').paused){
      previewLeft--;
      try { sessionStorage.setItem(PKEY, previewLeft); } catch(e){}
      if(!previewLeft) endPreview();
    }
    if(preview) previewText();
  }
  tick(); setInterval(tick, 1000);

  /* ---------- focus: rows top to bottom, Left / Right along a row ---------- */
  function rows(){
    // the seek row is focused as one: the bar grows (Enter plays / pauses, Left / Right move through the programme);
    // the play / pause icon beside it only shows the state
    // hidden buttons (Start Over without Time Shift) are left out, so focus skips them
    var btns = $('.btn').filter(function(b){ return getComputedStyle(b).display !== 'none'; });
    return [$('.back'), preview ? $('.explore') : [], [byId('track')], btns].filter(function(r){ return r.length; });
  }
  var row = 2 - (preview ? 0 : 1), col = 0;   // the seek bar; see "first focus" below
  function paint(){
    var r = rows(); row = Math.max(0, Math.min(r.length - 1, row)); col = Math.max(0, Math.min(r[row].length - 1, col));
    $('.item').forEach(function(el){ el.classList.remove('focused', 'on'); });
    // the seek bar shows focus itself (taller, with the handle), so it takes .on: focus-ring.js only rings .focused
    var el = r[row][col]; el.classList.add(el.id === 'track' ? 'on' : 'focused');
  }
  // first focus: the seek bar, with Time Shift or without. After that the controls come back on the button last used
  (function(){
    var want = byId('track');
    rows().forEach(function(r, ri){ r.forEach(function(el, ci){ if(el === want){ row = ri; col = ci; } }); });
  })();

  var toastEl = byId('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800); }
  function setPlayIcon(){ var v = byId('video'), ic = byId('playIc'); ic.src = v.paused ? 'icons/detail-play.svg' : 'icons/player/pause.svg'; ic.alt = v.paused ? 'Play' : 'Pause'; }
  function flash(paused){
    var f = byId('flash');
    byId('flashIc').src = paused ? 'icons/player/pause.svg' : 'icons/detail-play.svg';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');   // restart the animation on every press
  }
  function favAnim(on){
    var img = byId('favIc');
    img.classList.remove('pop', 'unpop'); void img.offsetWidth;   // restart the animation
    img.classList.add(on ? 'pop' : 'unpop');
    if(!on) return;
    var b = document.createElement('span'); b.className = 'fav-burst';
    b.innerHTML = '<span class="ring"></span>' + [0,45,90,135,180,225,270,315].map(function(a){ return '<i style="--a:' + a + 'deg"></i>'; }).join('');
    img.parentElement.appendChild(b); setTimeout(function(){ b.remove(); }, 700);
    var big = document.createElement('div'); big.className = 'fav-big';
    screen.appendChild(big); setTimeout(function(){ big.remove(); }, 1000);
  }
  function back(){
    try { if(document.referrer && /(tv-guide|sport)\.html/.test(document.referrer) && history.length > 1){ history.back(); return; } } catch(e){}
    location.href = 'tv-guide.html';
  }
  function activate(el){
    var v = byId('video');
    switch(el.dataset.act){
      case 'back': back(); break;
      case 'play':
        if(!TS){ toast('Time Shift is not available for this programme'); break; }
        if(scrub !== null){ commit(); break; }   // Enter while scrubbing: play from there now
        if(preview && !previewLeft){ toast('Free preview has ended. Get a package to keep watching'); break; }
        if(v.paused) v.play(); else v.pause();
        setPlayIcon(); flash(v.paused); break;
      case 'start-over':
        scrub = null; byId('thumb').classList.remove('on'); behind = win();
        v.currentTime = 0; v.play(); setPlayIcon(); paintSeek(); toast('Start Over: ' + P.t); break;
      case 'fav':
        C.fav = !C.fav; setFav(); favAnim(C.fav);
        // the mini EPG's Favorite category follows
        try { var md = JSON.parse(sessionStorage.getItem('tvMini')); md.chans.forEach(function(x){ if(x.n === C.n) x.fav = C.fav; }); sessionStorage.setItem('tvMini', JSON.stringify(md)); } catch(e){}
        // ... and so do the TV Guide and Home (tvFavs, the session's favourites)
        try { var tf = JSON.parse(sessionStorage.getItem('tvFavs') || '{}'); tf[C.n] = C.fav; sessionStorage.setItem('tvFavs', JSON.stringify(tf)); } catch(e){}
        toast(C.fav ? 'Added to Favorite: ' + C.n : 'Removed from Favorite: ' + C.n); break;
      case 'guide': openGuide(); break;
      case 'explore': toast('Explore Package'); break;
      case 'mini-epg': openMini(true); break;
      case 'sub-audio': toast('Subtitle / Audio'); break;
      case 'settings': toast('Settings'); break;
    }
  }

  /* ---------- idle: the controls fade out after 5s without a key; the first key only brings them back ---------- */
  var idleT;
  /* ---------- change channel by number: up to 3 digits, shown top right; it tunes 2s after the last digit (at once
     after the 3rd). The channel list lives in the TV Guide, so tuning goes through it: tv-guide.html?tune=N opens that
     channel here in this player's place, or comes back with ?nochan=N when there is no such channel ---------- */
  var chBuf = '', chT;
  function chPaint(){ var el = byId('chIn'); el.innerHTML = esc(chBuf) + '<i>' + '–––'.slice(chBuf.length) + '</i>'; el.classList.toggle('on', !!chBuf); }
  function chKey(d){
    clearTimeout(chShowT);
    if(chBuf.length >= 3) chBuf = '';
    chBuf += d; chPaint();
    clearTimeout(chT); chT = setTimeout(tune, chBuf.length === 3 ? 500 : 2000);
  }
  function chCancel(){ clearTimeout(chT); chBuf = ''; chPaint(); }
  function tune(){
    clearTimeout(chT);
    var n = parseInt(chBuf, 10); chBuf = '';
    if(!n){ chPaint(); return; }
    if(String(n) === C.no){ chPaint(); toast('You are watching channel ' + n); return; }
    // no such channel (the TV Guide's list, when it opened this player): say so and keep playing, without reloading
    var nos = null; try { nos = JSON.parse(sessionStorage.getItem('tvChannelNos')); } catch(e){}
    if(nos && nos.indexOf(n) < 0){ chPaint(); toast('Channel ' + n + ' is not available'); return; }
    var here = location.pathname.split('/').pop() + location.search.replace(/[?&]nochan=\d+/, '');
    location.replace('tv-guide.html?tune=' + n + '&from=' + encodeURIComponent(here));
  }
  // View Program Guide (the button, or the mini EPG's shortcut): the TV Guide's Program Guide, All Channels, with focus
  // on this channel's live card, tagged Watching
  function openGuide(){
    try {
      sessionStorage.setItem('tvGuideBack', JSON.stringify({view:'guide', cat:'all', sub:'all', n:C.n}));
      sessionStorage.setItem('tvWatching', C.n);
    } catch(e){}
    location.href = 'tv-guide.html';
  }
  function zap(dir){ location.replace('tv-guide.html?zap=' + dir + '&cur=' + encodeURIComponent(C.n)); }

  /* ---------- mini EPG: the channels come from the TV Guide (tvMini in sessionStorage, written when it opened this
     player). Up / Down move along the channels, Left / Right between them and the category bar (moving along the bar
     picks that category, like the TV Guide's tabs), Enter plays the channel, Back closes ---------- */
  var MINI_ICONS = {all:'all-on', recent:'recent', fav:'fav', exclusive:'exclusive', digital:'digital', sports:'sports', movies:'movies',
                    news:'news', cartoons:'cartoons', variety:'variety', others:'others'};
  var mini = null;
  var MINI_SLOT = 32;   // the focused card's place in the list's window: below the 24px fade, room for its ring   // open: {data, cat, list, i (focused channel), zone 'list' | 'cats', ci (focused chip)}
  function miniChans(cat){
    return mini.data.chans.filter(function(c){
      if(cat === 'all') return true;
      if(cat === 'recent') return c.recent;
      if(cat === 'fav') return c.fav;
      return c.cats.indexOf(cat) >= 0;
    });
  }
  function miniAva(c){
    if(!c.logo) return '<div class="mava txt" style="background:' + esc(c.bg) + ';color:' + esc(c.fg || '#fff') + '">' + esc(c.txt || c.n) + '</div>';
    var b = c.box, img = b ? '<img src="' + esc(c.logo) + '" alt="" style="left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[2] + '%;height:' + b[3] + '%;object-fit:contain;">'
                          : '<img class="' + (c.fit || 'cover') + '" src="' + esc(c.logo) + '" alt="">';
    return '<div class="mava"' + (c.bg ? ' style="background:' + esc(c.bg) + '"' : '') + '>' + img + '</div>';
  }
  function miniCard(c){
    var now = Date.now(), ps = c.progs, k = 0;
    while(k < ps.length - 1 && ps[k][2] <= now) k++;
    var p = ps[k] || ['', now, now, 0], nx = ps[k + 1], watching = c.n === C.n;
    var hm2 = function(t){ return hm(new Date(t)); };
    return '<div class="mcard">' +
      '<div class="m1">' + miniAva(c) + '<div class="minfo">' +
        '<div class="mname-row"><div class="mname">' + esc(c.n) + '</div><div class="mchips">' +
          (c.fav ? '<span class="mico"><img src="icons/tv-guide/heart-fill.svg" alt="Favorite"></span>' : '') +
          (c.crown ? '<span class="mico' + (c.crown === 'owned' ? ' owned' : '') + '"><img src="icons/tv-guide/' + (c.crown === 'owned' ? 'crown.svg' : 'crown-s.svg') + '" alt="Premium"></span>' : '') +
          (c.excl ? '' : '<span class="mno">' + c.no + '</span>') + '</div></div>' +
        '<div class="mprog">' + esc(p[0]) + '</div>' +
        '<div class="mtime">' + hm2(p[1]) + ' - ' + hm2(p[2]) + '<span class="mtags">' +
          (p[3] ? '<img src="icons/tv-guide/timeshift.svg" alt="Time Shift">' : '') +
          // no Live / On Air here (everything listed is on now); Watching for this channel, and the TV Guide's Don't Miss
          (watching ? '<span class="mtag watch">Watching</span>' : '') +
          (p[4] ? '<span class="mtag plain"><img src="icons/tv-guide/fire.svg" alt="">Don\'t Miss</span>' : '') + '</span></div>' +
      '</div></div>' +
      (nx ? '<div class="mnext"><b>Up Next :</b><span>' + esc(nx[0]) + '</span></div>' : '') +
    '</div>';
  }
  function miniRenderCats(){
    var html = '<div class="mcat" data-cat="guide"><img src="icons/mini-epg/guide.svg" alt="TV Guide"></div><img class="mini-div" src="icons/mini-epg/divider.svg" alt="">';
    html += mini.data.cats.map(function(k){ return '<div class="mcat' + (k.id === mini.cat ? ' sel' : '') + '" data-cat="' + k.id + '"><img src="icons/mini-epg/' + (MINI_ICONS[k.id] || 'all-on') + '.svg" alt="' + esc(k.n) + '"></div>'; }).join('');
    byId('miniCats').innerHTML = html;
  }
  function miniSetCat(cat, keepNo){
    mini.cat = cat; mini.list = miniChans(cat);
    var at = mini.list.map(function(c){ return c.n; }).indexOf(keepNo || C.n);
    mini.i = Math.max(0, at);
    byId('miniTitle').textContent = mini.data.cats.filter(function(k){ return k.id === cat; })[0].n;
    byId('miniList').innerHTML = mini.list.length ? mini.list.map(miniCard).join('') : '<div class="mini-empty">No channels in this category yet.</div>';
    byId('miniList').style.transform = '';
    miniMeasure();
    $('.mcat', byId('miniCats')).forEach(function(el){ el.classList.toggle('sel', el.dataset.cat === cat); });
  }
  function miniPaint(){
    // remembered for the session (miniMem): reopening the mini EPG comes back to this category, channel and side
    try { sessionStorage.setItem('miniMem', JSON.stringify({cat:mini.cat, n:mini.list[mini.i] ? mini.list[mini.i].n : '', zone:mini.zone, ci:mini.ci, ciUsed:!!mini.ciUsed})); } catch(e){}
    // one focused card at most: with focus on the category bar every card is at its default size; mini.i stays as it
    // was, so Right comes back to the same channel
    $('.mcard', byId('miniList')).forEach(function(el, i){
      el.classList.toggle('focused', mini.zone === 'list' && i === mini.i);
    });
    $('.mcat', byId('miniCats')).forEach(function(el, i){ el.classList.toggle('focused', mini.zone === 'cats' && i === mini.ci); });
    var toGuide = mini.zone === 'cats' && $('.mcat', byId('miniCats'))[mini.ci].dataset.cat === 'guide';
    byId('mini').classList.toggle('to-guide', toGuide);
    byId('miniTitle').textContent = toGuide ? 'View Program Guide' : mini.data.cats.filter(function(k){ return k.id === mini.cat; })[0].n;
    // "Fixed focus", as Home's rails but up / down: the focused card sits in the first card's slot and the list slides
    // under it, until the list's end reaches the bottom of the screen; past that the focus (and the ring) moves on alone
    // to the last cards. A short list never scrolls. Worked out from the measured heights (mini.h a card, mini.H the
    // focused one), not offsetTop: the cards are still growing / shrinking at this moment
    var n = mini.list.length, step = mini.h + 12;
    if(n){
      var total = n * step - 12 + (mini.H - mini.h), vh = byId('miniList').parentElement.clientHeight;
      var maxScroll = Math.max(0, MINI_SLOT + total + 24 - vh);   // the last card 24px clear of the screen's edge, ring included
      var ty = Math.min(mini.i * step, maxScroll);
      byId('miniList').style.transform = 'translateY(' + (MINI_SLOT - ty) + 'px)';
      // the focus ring goes straight to where the focused card ends up (its slot), instead of riding along while the
      // card grows and the list slides: from the layout's offsets, which leave out the transforms still under way
      var sc = byId('miniList').parentElement, x0 = 0, y0 = 0;
      for(var o = sc; o && o !== screen; o = o.offsetParent){ x0 += o.offsetLeft; y0 += o.offsetTop; }
      $('.mcard', byId('miniList')).forEach(function(el, i){
        if(el.classList.contains('focused')) el.dataset.ringRect = [x0, y0 + MINI_SLOT + i * step - ty, 600, mini.H].join(',');
        else delete el.dataset.ringRect;
        // where this card will sit once settled (the focused one is taller, pushing the rest down): the fade's edge
        var top = MINI_SLOT + i * step + (mini.zone === 'list' && i > mini.i ? mini.H - mini.h : 0) - ty;
        // gone at the window's top, clear 24px below it; the focused card is never faded (it sits below the fade)
        el.style.setProperty('--cut', el.classList.contains('focused') ? '-9999px' : (-top) + 'px');
      });
    }
  }
  // a default card's height and a focused one's, read once without the 200ms transitions (every card is the same
  // height, and so is every focused one)
  function miniMeasure(){
    var list = byId('miniList'), card = list.querySelector('.mcard');
    if(!card){ mini.h = mini.H = 0; return; }
    list.classList.add('measure');
    $('.mcard', list).forEach(function(el){ el.classList.remove('focused'); });
    mini.h = card.offsetHeight;
    card.classList.add('focused'); mini.H = card.offsetHeight; card.classList.remove('focused');
    void list.offsetHeight; list.classList.remove('measure');
  }
  function openMini(fromButton){
    var data = null; try { data = JSON.parse(sessionStorage.getItem('tvMini')); } catch(e){}
    if(!data){ toast('Open the player from the TV Guide to browse channels'); return; }
    mini = {data:data, zone:'list', ci:0, fromButton:fromButton};
    miniRenderCats();
    // back to the previous focus: the category, channel and side (list / category bar) it was left on; the first
    // time, All Channels on the channel playing
    var mem = null; try { mem = JSON.parse(sessionStorage.getItem('miniMem')); } catch(e){}
    if(mem && data.cats.some(function(k){ return k.id === mem.cat; })){
      miniSetCat(mem.cat, mem.n);
      mini.ci = mem.ci || 0; mini.ciUsed = !!mem.ciUsed;
      if(mem.zone === 'cats' || !mini.list.length){ mini.zone = 'cats'; mini.ci = mem.zone === 'cats' ? mem.ci : $('.mcat', byId('miniCats')).map(function(c){ return c.dataset.cat; }).indexOf(mem.cat); }
    } else miniSetCat('all');
    clearTimeout(idleT); document.body.classList.add('mini-on');
    $('.item').forEach(function(el){ el.classList.remove('focused', 'on'); });
    miniPaint();
  }
  function closeMini(){
    var fromButton = mini.fromButton; mini = null;
    document.body.classList.remove('mini-on');
    $('.mcat, .mcard', byId('mini')).forEach(function(el){ el.classList.remove('focused'); });
    byId('mini').classList.remove('to-guide');
    if(fromButton){ document.body.classList.add('idle'); wake(); } else goIdle();   // back where it was opened from
  }
  function miniKey(k){
    var chips = $('.mcat', byId('miniCats'));
    if(k === 'Escape' || k === 'Backspace'){ closeMini(); return; }
    if(mini.zone === 'list'){
      if(k === 'ArrowUp' && mini.i > 0) mini.i--;
      else if(k === 'ArrowDown' && mini.i < mini.list.length - 1) mini.i++;
      else if(k === 'ArrowLeft'){ mini.zone = 'cats'; if(!mini.ciUsed) mini.ci = Math.max(0, chips.map(function(c){ return c.dataset.cat; }).indexOf(mini.cat)); mini.ciUsed = true; }
      else if((k === 'Enter' || k === ' ') && mini.list[mini.i]){
        var c = mini.list[mini.i];
        if(c.n === C.n){ closeMini(); return; }
        location.replace('tv-guide.html?play=' + encodeURIComponent(c.n));   // plays it here, with the controls away
        return;
      }
    } else {
      if(k === 'ArrowUp' && mini.ci > 0) mini.ci--;
      else if(k === 'ArrowDown' && mini.ci < chips.length - 1) mini.ci++;
      else if(k === 'ArrowRight' && mini.list.length){ mini.zone = 'list'; }
      else if((k === 'Enter' || k === ' ') && chips[mini.ci].dataset.cat === 'guide'){ openGuide(); return; }
      else if(k === 'Enter' || k === ' '){ if(mini.list.length) mini.zone = 'list'; }
      // moving onto a category shows its channels straight away (the TV Guide chip only opens the guide)
      var cat = chips[mini.ci].dataset.cat;
      if(cat !== 'guide' && cat !== mini.cat) miniSetCat(cat);
    }
    miniPaint();
  }
  if(q.nochan) toast('Channel ' + q.nochan + ' is not available');
  // a channel change (number or Up / Down) opens the new channel with the controls away: the viewer brings them up
  var quiet = q.quiet === '1' || !!q.nochan;
  // after a channel change (number or Up / Down) the new channel's number shows in the same box for 2s (its name, for
  // an Exclusive channel with no number)
  var chShowT;
  if(q.quiet === '1'){
    var chEl = byId('chIn'); chEl.textContent = C.no || C.n; chEl.classList.add('on');
    chShowT = setTimeout(function(){ if(!chBuf) chEl.classList.remove('on'); }, 2000);
  }
  try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&](nochan|quiet)=\d+/g, '').replace(/^&/, '?')); } catch(e){}

  // idle: focus is put away too (Explore Package stays on screen, but without the ring) and comes back on wake
  function goIdle(){
    clearTimeout(idleT); document.body.classList.add('idle');
    $('.item').forEach(function(el){ el.classList.remove('focused', 'on'); });
  }
  function wake(){
    var was = document.body.classList.contains('idle'); document.body.classList.remove('idle'); clearTimeout(idleT);
    idleT = setTimeout(function(){ if(!document.body.classList.contains('preview-over')) goIdle(); }, 5000);   // after the preview they stay up
    if(was) paint();
    return was;
  }
  if(quiet){
    goIdle();
    // the idle state now holds the controls away; transitions come back once it has been drawn
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.documentElement.classList.remove('quiet-start'); }); });
  } else wake();

  document.addEventListener('keydown', function(e){
    var k = e.key, back_ = k === 'Escape' || k === 'Backspace';
    // number keys: change channel, whether or not the controls are up; Enter tunes at once, Back cancels
    if(/^[0-9]$/.test(k)){ e.preventDefault(); chKey(k); return; }
    if(chBuf && (k === 'Enter' || k === ' ')){ e.preventDefault(); tune(); return; }
    if(chBuf && back_){ e.preventDefault(); chCancel(); return; }
    if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].indexOf(k) < 0 && !back_) return;
    e.preventDefault();
    if(mini){ miniKey(k); return; }
    // with the controls away, Left opens the mini EPG
    if(document.body.classList.contains('idle') && k === 'ArrowLeft'){ openMini(false); return; }
    // Back with the controls up only puts them away; with them away it leaves the player
    if(back_){
      if(document.body.classList.contains('idle')) back();
      else goIdle();
      return;
    }
    // with the controls away, OK plays / pauses straight away (as on Netflix) and brings them back; other keys only bring them back
    // with the controls away, Up / Down change channel (the next / previous number), like a TV remote's CH+ / CH−
    if(document.body.classList.contains('idle') && (k === 'ArrowUp' || k === 'ArrowDown')){ zap(k === 'ArrowUp' ? 1 : -1); return; }
    if(wake()){ if(k === 'Enter' || k === ' ') activate(byId('playBtn')); return; }
    var r = rows();
    if(k === 'ArrowUp' && row > 0){ row--; col = 0; }
    else if(k === 'ArrowDown' && row < r.length - 1){ row++; col = 0; }
    else if(r[row][col].id === 'track' && (k === 'ArrowLeft' || k === 'ArrowRight')){
      // on the seek bar: a press goes 10s back / forward (not past live); held, it scrubs faster
      var dir = k === 'ArrowRight' ? 1 : -1;
      if(!TS) toast('Time Shift is not available for this programme');
      else if(e.repeat){ if(!holdT) startHold(dir); }
      else { scrubBy(dir * STEP); commitT = setTimeout(commit, 800); }
    }
    else if(k === 'ArrowLeft') col--;
    else if(k === 'ArrowRight') col++;
    else if(k === 'Enter' || k === ' ') activate(r[row][col]);
    paint();
  });
  $('.item').concat(byId('playBtn')).forEach(function(el){ el.addEventListener('click', function(){ wake(); activate(el); }); });
  document.addEventListener('keyup', function(e){ if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') stopHold(); });
  // only a real move of the mouse: Chrome also sends a mousemove (with no movement) when a page loads under a resting
  // pointer, which would bring the controls up on a channel change
  addEventListener('mousemove', function(e){ if((e.movementX || e.movementY) && !mini) wake(); });
  byId('video').addEventListener('click', function(){ wake(); activate(byId('playBtn')); });   // a click on the picture plays / pauses
  byId('video').addEventListener('play', setPlayIcon); byId('video').addEventListener('pause', setPlayIcon);
  if(!quiet) paint();   // otherwise focus comes with the controls (wake)
  if(preview && !previewLeft) endPreview();   // came back to a channel whose preview was already used up
})();
</script>
<script src="focus-ring.js"></script>
</body>
