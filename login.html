<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIS PLAY Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Roboto:wght@400&family=Noto+Sans:wght@500&display=swap" rel="stylesheet">
<!--
  AIS PLAY's guest page, the first thing the app shows after its splash (launcher.html). From Figma
  "PLAY:homeGuest_mainPage" (Prototype, node 75:23432): the poster wall behind, darkened on the left; the logo, a line
  of text and the sign-in options.
  Remote / keyboard: Up / Down move along the options, Enter picks one, Esc / Back returns to the TV's home screen.
  Log in with Home Internet signs straight in (Home, or the title picked on the launcher: ?next=); Explore Pay per
  view content opens the Store's pay-per-view events; QR and Mobile sign-in aren't part of this prototype yet.
  Focus is the app's Default theme (as on Home and the TV Guide): the focused option takes the white glass pill and
  the shared gliding glass ring (focus-ring.js, plain: no artwork in it) goes round it.
-->
<style>
  :root{
    --surface:#101010; --on-surface:#e8e8e8; --on-surface-variant:#a8a8a8; --inverse-surface:#e8e8e8;
    --surface-container:#2a2a2a; --outline-variant:#4a4a4a; --text-secondary:#e5e5e5;
    --inter:Inter, sans-serif; --roboto:Roboto, sans-serif;
    --ease:cubic-bezier(.2,0,0,1);
    /* Home's Default theme: the white glass pill for whatever has focus */
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    --pill-hi:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%);
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:var(--on-surface); }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--surface); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:var(--surface); }

  /* the poster wall (BG), then the left side darkened for the text (Figma's layer is the 269.47° gradient turned 180°) */
  .bg{ position:absolute; inset:0; overflow:hidden; }
  .bg img{ position:absolute; left:-4.13%; top:.01%; width:107.58%; height:107.58%; max-width:none; }
  .shade-left{ position:absolute; left:2px; top:0; width:970px; height:1080px;
    background:linear-gradient(89.47deg, rgba(10,13,12,.84) 20.22%, rgba(10,13,12,0) 101.68%); }

  .logo{ position:absolute; left:90px; top:214px; width:396px; height:198px; object-fit:cover; display:block; }
  .intro{ position:absolute; left:110px; top:406px; width:700px; margin:0; font:400 24px/32px var(--roboto); color:var(--on-surface-variant); }

  /* the options: TV / Button, large (80px tall, a pill) */
  .options{ position:absolute; left:110px; top:512px; width:620px; display:flex; flex-direction:column; gap:24px; }
  .btn{ position:relative; box-sizing:border-box; width:100%; height:80px; padding:24px 80px; border-radius:9999px;
    display:flex; align-items:center; justify-content:center; gap:16px; cursor:pointer;
    font:500 24px/32px var(--inter); white-space:nowrap; }
  /* resting: a faint outline, the label slightly dimmed */
  .btn::before{ content:""; position:absolute; inset:0; border-radius:88px; border:3px solid var(--outline-variant); opacity:.4;
    transition:opacity .2s ease; }
  .btn .lbl{ position:relative; color:var(--inverse-surface); opacity:.8; transition:opacity .2s ease; }
  .btn .ic{ position:relative; display:block; flex:0 0 auto; }
  /* focused: the Default theme's white glass pill (as the TV Guide's focused tab), white label; the outline makes way
     for focus-ring.js's ring */
  .btn{ transition:background .22s var(--ease); }
  .btn.focused{ background:var(--pill-hi), var(--th-pill); }
  .btn.focused::before{ opacity:0; }
  .btn.focused .lbl{ color:#fff; opacity:1; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  .or{ display:flex; align-items:center; gap:12px; height:28px; }
  .or .line{ flex:1 0 0; min-width:1px; height:1px; display:block; }
  .or span{ font:500 16px/28px 'Noto Sans', sans-serif; color:var(--text-secondary); }

  #toast{ position:absolute; left:50%; bottom:60px; transform:translateX(-50%); padding:18px 32px; border-radius:12px;
    background:rgba(32,33,36,.95); font:400 24px/1.2 var(--roboto); color:var(--on-surface); opacity:0; transition:opacity .2s ease;
    pointer-events:none; white-space:nowrap; z-index:40; }
  #toast.on{ opacity:1; }
</style>
</head>
<body>
<div id="frame"><div id="screen" data-ring-plain>   <!-- plain focus ring: no artwork reflected in it -->
  <div class="bg"><img src="login-assets/bg.png" alt=""></div>
  <div class="shade-left"></div>

  <img class="logo" src="login-assets/logo.png" alt="AIS PLAY">
  <p class="intro">Lorem Ipsum is simply dummy text of the printing and setting text ever since 1966, when Lorem Ipsum hass.</p>

  <div class="options">
    <div class="btn item" data-act="home"><span class="lbl">Log in with Home Internet</span></div>
    <div class="btn item" data-act="qr"><span class="lbl">Sign in with QR Code</span></div>
    <div class="btn item" data-act="mobile"><img class="ic" src="login-assets/icon-mobile.svg" width="32" height="32" alt=""><span class="lbl">Sign in with Mobile / Internet Number</span></div>
    <div class="or"><img class="line" src="login-assets/line.svg" alt=""><span>OR</span><img class="line" src="login-assets/line.svg" alt=""></div>
    <div class="btn item" data-act="ppv"><span class="lbl">Explore Pay per view content</span></div>
  </div>

  <div id="toast"></div>
</div></div>

<script>
(function(){
  var frame = document.getElementById('frame'), screen = document.getElementById('screen');
  function fit(){
    var K = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.width = 1920 * K + 'px'; frame.style.height = 1080 * K + 'px';
    frame.style.marginLeft = -960 * K + 'px'; frame.style.marginTop = -540 * K + 'px';
    screen.style.transform = 'scale(' + K + ')';
  }
  addEventListener('resize', fit); fit();

  var items = Array.prototype.slice.call(document.querySelectorAll('.btn')), cur = 0;
  // where signing in leads: Home, or the title picked on the launcher (?next=movie-detail.html)
  var next = (/[?&]next=([^&]*)/.exec(location.search) || [])[1];
  next = next ? decodeURIComponent(next) : 'home.html';
  if(!/^[\w-]+\.html$/.test(next)) next = 'home.html';   // only this prototype's own pages

  function paint(){ items.forEach(function(el, i){ el.classList.toggle('focused', i === cur); }); }

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800); }

  function activate(el){
    var act = el.dataset.act;
    if(act === 'home') location.href = next;
    else if(act === 'ppv') location.href = 'store.html';
    else if(act === 'qr') toast('Sign in with QR Code isn\'t part of this prototype yet');
    else if(act === 'mobile') toast('Sign in with Mobile / Internet Number isn\'t part of this prototype yet');
  }

  document.addEventListener('keydown', function(e){
    var k = e.key;
    if(k === 'Escape' || k === 'Backspace'){ e.preventDefault(); location.href = 'launcher.html'; return; }
    if(k === 'ArrowUp'){ cur = Math.max(0, cur - 1); paint(); e.preventDefault(); }
    else if(k === 'ArrowDown'){ cur = Math.min(items.length - 1, cur + 1); paint(); e.preventDefault(); }
    else if(k === 'Enter' || k === ' '){ activate(items[cur]); e.preventDefault(); }
  });
  items.forEach(function(el, i){ el.addEventListener('click', function(){ cur = i; paint(); activate(el); }); });

  paint();
})();
</script>
<script src="focus-ring.js"></script>
</body>
</html>
