<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Guide</title>
<!-- ?tune= / ?zap=: only passing through to the player (a channel change), so nothing is drawn -->
<script>if(/[?&](tune|zap|play)=/.test(location.search)) document.documentElement.style.visibility = 'hidden';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<!--
  TV Guide (EPG) page, opened from the "TV Guide / View All" tile on Home. Two views behind the Switcher, from Figma
  PLAY-player: "View Channels" (epg_viewChannels, 1784:31259) and "View Program Guide" (epg_viewProgramGuide, 1784:27421).
  The Figma frames are wireframes (ChannelName / ProgramName, grey avatars); this page fills them with the channels Home
  already shows and a generated schedule around the real clock.
  A 1920x1080 TV screen scaled to the window, like home.html.
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back closes a dropdown or returns to Home.
  Category tabs (and the Sports sub-tabs) filter as focus moves onto them, like a TV tab bar.
-->
<style>
  :root{
    color-scheme:dark;
    --on-surface:#e8e8e8; --on-surface-variant:#a8a8a8; --live:#ea5454;
    --avatar:#404045;
    /* Home's Default theme (home.html): navy page with a faint glow, frosted grey glass for cards and chips, and the
       white glass pill for whatever is selected */
    --bg-0:#070e16; --th-glow:rgba(214,222,240,.12);
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    --pill-hi:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%);
    --glass-card:linear-gradient(180deg, rgba(161,161,161,.25), rgba(65,65,65,.25));         /* Home's Hot Channels card */
    --glass-card-on:linear-gradient(180deg, rgba(230,230,240,.42), rgba(150,150,165,.34));   /* ... when focused */
    --glass-chip:rgba(255,255,255,.13);                                                      /* Home's category chip */
    --chip-inset:inset 0 3px 3px rgba(0,0,0,.23);
    --noto:'Noto Sans', 'Noto Sans Thai', system-ui, sans-serif;
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:#fff; font-family:var(--noto); }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--bg-0); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left;
    background:radial-gradient(1400px 900px at 85% 110%, var(--th-glow), transparent 70%), var(--bg-0); }   /* Home's page */
  /* the header row stays put; everything below it scrolls vertically as one page (the Figma frames are taller than the
     screen), fading out softly as it passes under the header */
  #page{ position:absolute; left:0; right:0; top:140px; bottom:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 28px); mask-image:linear-gradient(180deg, transparent 0, #000 28px); }
  #content{ position:relative; padding:0 0 80px; }
  /* scrolled down: the category rows collapse into this label, pinned under the header; the page fades out above it */
  .cat-label{ position:absolute; left:110px; top:200px;   /* 60px below the header, like the category tabs */
    z-index:9; pointer-events:none; white-space:nowrap;
    font:500 24px/32px var(--noto); letter-spacing:-.24px; text-shadow:0 1px 4px rgba(0,0,0,.4);
    opacity:0; transform:translateY(6px); transition:opacity .22s cubic-bezier(.2,0,0,1), transform .22s cubic-bezier(.2,0,0,1); }
  body.collapsed .cat-label{ opacity:1; transform:none; }
  /* in the guide's columns, which sit 32px under the label: a shorter fade, 4px → 24px below it, so the columns and their
     focus ring are fully visible */
  body.collapsed.in-guide #page{ -webkit-mask-image:linear-gradient(180deg, transparent 0, transparent 96px, #000 116px); mask-image:linear-gradient(180deg, transparent 0, transparent 96px, #000 116px); }
  /* breadcrumb: "Sports / Golf", the parent category regular and grey, a grey slash, the current sub-tab bold white */
  .cat-label{ display:flex; align-items:baseline; gap:12px; }
  .cat-label .crumb, .cat-label .sep{ font-weight:400; color:rgba(255,255,255,.55); }
  .cat-label .cur{ font-weight:700; color:#fff; }
  /* label bottom = 92px into the page: fade from 24px below it (116px) to fully visible 48px below it (140px) */
  body.collapsed #page{ -webkit-mask-image:linear-gradient(180deg, transparent 0, transparent 116px, #000 140px); mask-image:linear-gradient(180deg, transparent 0, transparent 116px, #000 140px); }
  .clip{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- Head: title + Switcher, date / time on the right ---------- */
  .head{ position:absolute; left:110px; right:110px; top:60px; z-index:10; height:80px; display:flex; align-items:center; justify-content:space-between; }
  .head-left{ display:flex; align-items:center; gap:32px; }
  h1{ margin:0; font:700 64px/normal Helvetica, Arial, sans-serif; text-shadow:0 0 4px rgba(0,0,0,.5); white-space:nowrap; }
  /* header controls: Switcher and dropdowns are both 80px tall, with the Switcher's 22px text */
  .switcher{ height:80px; box-sizing:border-box; padding:8px; display:flex; gap:8px; align-items:center; border-radius:12px; background:var(--glass-chip); box-shadow:var(--chip-inset); backdrop-filter:blur(50px); -webkit-backdrop-filter:blur(50px); }
  .sw{ position:relative; width:250px; height:100%; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    font:400 22px/1.2 var(--noto); letter-spacing:-.24px; color:var(--on-surface); }
  /* the chosen view: dim (Figma "Dim View Channels"; the same fill as Home's active nav tab) until focus is on it */
  .sw.on{ background:rgba(255,255,255,.22); font-weight:500; color:#fff; transition:background .22s cubic-bezier(.2,0,0,1); }
  .sw.on.focused{ background:var(--pill-hi), var(--th-pill); font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .head-right{ display:flex; align-items:center; gap:12px; }
  /* View Channels: the date and clock as plain text chips */
  .time-chip{ height:80px; padding:0 50px; border-radius:50px; display:flex; align-items:center; box-sizing:border-box;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font:400 22px/1.2 var(--noto); letter-spacing:-.24px; text-shadow:0 0 20px #000; white-space:nowrap; }   /* header size: 80px, the Switcher's text */
  /* View Program Guide: date and time dropdowns */
  .dd{ position:relative; }
  .dd-trigger{ height:80px; box-sizing:border-box; padding:0 24px; display:flex; align-items:center; gap:32px; cursor:pointer; white-space:nowrap;
    background:var(--glass-chip); box-shadow:var(--chip-inset); backdrop-filter:blur(50px); -webkit-backdrop-filter:blur(50px);
    border-radius:16px; color:var(--on-surface); }
  .dd-trigger.focused{ background:var(--pill-hi), var(--th-pill); color:#fff; }
  .dd-trigger.focused .v, .dd-trigger.focused .a{ opacity:1; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .dd-trigger .v{ font:400 22px/1.2 var(--noto); letter-spacing:-.24px; opacity:.8; }
  /* chevron: the design system's (package page) right-pointing one, turned down; up while the menu is open */
  .dd-trigger .a{ width:32px; height:32px; display:block; opacity:.8; transform:rotate(90deg); transition:transform .22s cubic-bezier(.2,0,0,1); }
  .dd.open .dd-trigger .a{ transform:rotate(-90deg); }
  .dd-menu{ position:absolute; right:0; top:92px; z-index:20; min-width:100%; box-sizing:border-box; padding:8px; display:none; flex-direction:column; gap:4px;
    max-height:560px; overflow:hidden; background:rgba(30,36,48,.92); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-radius:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15); }
  .dd.open .dd-menu{ display:flex; }
  .dd-opt{ flex:0 0 auto; padding:10px 20px; border-radius:10px; font:400 22px/34px var(--noto); letter-spacing:-.24px; color:var(--on-surface); white-space:nowrap; cursor:pointer; }
  .dd-opt.sel{ font-weight:500; }
  .dd-opt.sel::after{ content:' ✓'; }
  .dd-opt.hl{ background:var(--pill-hi), var(--th-pill); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* ---------- horizontal rails: full screen width, content starts at the 110px margin ---------- */
  .rail{ overflow:hidden; padding:6px 110px; }
  .rail-track{ position:relative; display:flex; width:max-content; }   /* items' offsetLeft is measured from the track */

  /* category tabs (TabBar): Home's glass chips; the selected one takes the white glass pill */
  .tabs{ margin-top:51px; }   /* 57px below the head (as before the head grew 3px), less the rail's 6px padding */
  .tabs .rail-track{ gap:32px; }
  .tab{ position:relative; height:64px; padding:0 32px; display:flex; align-items:center; justify-content:center; box-sizing:border-box; cursor:pointer;
    /* not selected: no fill, a thin outline and grey text (Figma TabBar's resting tab), so it reads clearly apart from
       the selected one's dim fill */
    background:transparent; box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); border-radius:999px;
    font:500 24px/32px Inter, sans-serif; color:var(--on-surface-variant); white-space:nowrap; }
  /* the chosen category: dim like the Switcher's chosen view (Home's active nav tab fill) until focus is on it */
  .tab.on{ background:rgba(255,255,255,.22); box-shadow:none; padding:0 40px; color:#fff; font-weight:500; transition:background .22s cubic-bezier(.2,0,0,1); }
  .tab.on.focused{ background:var(--pill-hi), var(--th-pill); font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  /* sub-tabs (Sports): plain text, the selected one underlined */
  .subs{ margin-top:20px; }   /* 32px from the category tabs: 6px + 20px + 6px (the rails' ring padding) */
  /* chips start on the 110px margin like every row (the safe area: nothing focusable crosses it); a slim 20px padding
     keeps the first label close to that edge, and a 52px gap keeps the labels as far apart as Figma's 40px padding + 12px gap */
  .subs .rail-track{ gap:52px; }
  .sub{ position:relative; height:60px; padding:0 20px; display:flex; align-items:center; cursor:pointer; opacity:.8; border-radius:12px;
    font:500 24px/32px Inter, sans-serif; color:var(--on-surface-variant); white-space:nowrap; }
  .sub.on{ opacity:1; text-decoration:underline; text-decoration-thickness:10%; text-underline-offset:6px; }

  /* a channel logo in its round avatar (Figma "Avatar": #404045 disc) */
  .logo{ position:absolute; inset:0; border-radius:inherit; overflow:hidden; background:var(--avatar); }
  .logo img{ position:absolute; display:block; }
  .logo img.cover{ inset:0; width:100%; height:100%; object-fit:cover; }
  .logo img.contain{ left:15%; top:15%; width:70%; height:70%; object-fit:contain; }
  /* no logo file: the channel's name as text on its colour, sized to the avatar (90px; 64px in a guide column head) */
  .logo.txt{ display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; box-sizing:border-box;
    font:700 17px/1.1 var(--noto); letter-spacing:-.3px; }
  .logo.txt.long{ font-size:14px; }   /* "Workpoint": shrunk to fit on one line rather than broken mid-word */
  .col-head .logo.txt{ font-size:13px; padding:4px; }
  .col-head .logo.txt.long{ font-size:10px; }

  /* focus ring: the shared one from focus-ring.js (Home's gliding glass ring), which follows the .focused item */

  /* ---------- View Channels: a grid of channel cards ---------- */
  /* Home's Hot Channels card (Figma "Card CH", PLAY epg - mini epg 3222:170874): 190 x 262, the logo in a 112px circle,
     the name, then the heart, crown and channel number. 24px between cards both ways (as Home's Hot Channels rail),
     so 8 to a row fit the 1700px between the margins (8 x 190 + 7 x 24 = 1688) */
  .grid{ margin:26px 110px 0; display:grid; grid-template-columns:repeat(8, 190px); gap:24px; }
  .ch-card{ position:relative; width:190px; height:262px; box-sizing:border-box; padding:20px; border-radius:16px; cursor:pointer;
    background:var(--glass-card);   /* Home's channel card glass; no backdrop blur: over the plain page it shows nothing, and inside the
                                       faded scroller Chrome draws it in tiles, leaving seams */
    display:flex; flex-direction:column; align-items:center; transition:background .22s cubic-bezier(.2,0,0,1); }
  .ch-card.focused{ background:var(--glass-card-on); }
  .ch-slot{ width:150px; height:150px; flex:0 0 auto; display:flex; justify-content:center; padding-top:8px; box-sizing:border-box; }
  .ch-slot .ava{ position:relative; width:112px; height:112px; border-radius:999px; flex:0 0 auto; }
  .ch-slot .logo.txt{ font-size:20px; }
  .ch-slot .logo.txt.long{ font-size:16px; }
  .ch-name{ width:100%; font:400 24px/normal Helvetica, Arial, sans-serif; text-align:center; }
  .ch-meta{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:12px; }
  .ic20{ width:20px; height:20px; display:block; }
  .ch-no{ height:32px; min-width:40px; box-sizing:border-box; padding:0 12px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); font:600 20px/20px var(--noto); }

  /* ---------- View Program Guide: one column per channel ---------- */
  .guide{ margin-top:26px; }
  .guide .rail-track{ gap:10px; align-items:flex-start; }
  .col{ width:390px; flex:0 0 auto; border-radius:16px; background:var(--glass-card); transition:background .22s cubic-bezier(.2,0,0,1); }   /* no backdrop blur, as .ch-card */
  .col.hl{ background:linear-gradient(180deg, rgba(190,190,205,.4), rgba(95,95,110,.4)); }   /* one of its programmes is focused: 40%, a gentle step up from the resting column */
  .col-head{ height:96px; box-sizing:border-box; padding:16px; border-radius:16px 16px 0 0; background:rgba(255,255,255,.1); display:flex; align-items:center; gap:8px; }
  .col-head .ava-sm{ position:relative; width:64px; height:64px; border-radius:80px; flex:0 0 auto; }
  .col-name{ flex:1; min-width:0; font:600 20px/1.2 var(--noto); letter-spacing:-.24px; }
  .col-icons{ display:flex; align-items:center; gap:8px; }
  .col-icons .heart{ padding:10px; }
  .col-icons .crown{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .col-no{ height:40px; min-width:40px; box-sizing:border-box; padding:0 12px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); font:500 16px/20px var(--noto); }
  .col-body{ padding:8px; display:flex; flex-direction:column; gap:8px; }
  /* below the pinned live card: the column's own scroller. It runs on past the bottom of the screen (5 grid rows,
     5 x 106 - 8), scrolling in whole rows so the rows line up across columns; focus is kept in the 4 rows on screen.
     Only a column whose last programme has focus ends there: 4 rows tall (4 x 106 - 8), its background hugging that
     card (8px padding) */
  /* no height transition: while it shrinks, the browser caps the scroll at the taller box's end, one row short, which
     left the focused last card hidden under the ring's slot */
  .col-scroll{ height:522px; overflow:hidden; }
  .col-scroll.end{ height:416px; }
  /* focus on a programme of the next day: the live card is put away and the date divider fills its grid slot at the
     top (Figma's next-day column), so the column has exactly 2 more rows' room (204 + 8 = 212px): 6 rows on screen.
     The divider stays put there (sticky) while the day's programmes scroll under it: a copy of it (.day-pin) sits above
     the scroller, which keeps the list's own divider just out of sight, so 5 rows scroll below it */
  .col.next-day .prog-big{ display:none; }
  .col .day-pin{ display:none; }   /* outranks .day-sep's display, further down */
  .col.next-day .day-pin{ display:flex; }
  .col.next-day .col-scroll{ height:628px; }   /* 5 x 106 - 8 = 522 on screen, plus a row running on */
  .col.next-day .col-scroll.end{ height:522px; }
  .col.next-day .day-pin{ margin-top:0; height:98px; }   /* the pinned date: the same 106px slot, the bar now filling it (the dividers still to come stay thin bars until they get there) */
  .col-list{ display:flex; flex-direction:column; gap:8px; }
  .col-empty{ padding:24px 16px; font:400 20px/1.2 var(--noto); color:var(--on-surface-variant); }

  /* programme cards: the first (on at the chosen time) is the tall picture card, the rest are text blocks */
  .prog{ position:relative; border-radius:8px; cursor:pointer; }
  .prog-big{ height:204px;   /* exactly two programme rows (98 + 8 + 98), so a next-day column lines up with its neighbours */
    overflow:hidden; box-sizing:border-box; padding:16px; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; }
  .prog-big .art{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .prog-big .art.logo-art{ background:var(--avatar); }
  .prog-big .art.logo-art .txt-art{ position:absolute; left:50%; top:38%; width:120px; height:120px; transform:translate(-50%,-50%); border-radius:16px;
    display:flex; align-items:center; justify-content:center; text-align:center; font:700 24px/1.1 var(--noto); }
  .prog-big .art.logo-art .txt-art.long{ font-size:19px; }
  .prog-big .art.logo-art img{ position:absolute; left:50%; top:38%; width:120px; height:120px; transform:translate(-50%,-50%); object-fit:contain; border-radius:16px; }
  .prog-big .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(102,102,102,0) 15.257%, #000 87.392%); }
  .prog-big .t{ position:relative; font:400 24px/1.2 var(--noto); letter-spacing:-.24px; }
  .prog-big .row{ position:relative; height:26px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .prog-big .tm{ flex:1; min-width:0; font:500 20px/1 var(--noto); letter-spacing:-.24px; color:rgba(255,255,255,.8); }
  .prog-blk{ width:374px; box-sizing:border-box; padding:16px; display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.06);   /* resting: a faint fill, so the focused block stands out */
    transition:background .22s cubic-bezier(.2,0,0,1); }
  .prog-blk.focused{ background:var(--glass-card-on); }
  .prog-blk .title-row{ display:flex; align-items:center; gap:8px; }
  .prog-blk .t{ flex:1; min-width:0; height:32px; font:400 24px/32px Roboto, sans-serif; color:var(--on-surface); }
  .prog-blk .row{ height:26px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .prog-blk .tm{ font:400 20px/1 Roboto, sans-serif; color:var(--on-surface-variant); white-space:nowrap; }
  .ic24{ width:24px; height:24px; display:block; }
  .ts{ flex:0 0 auto; }   /* timeshift (watch from the start): before the bell on a block, before the tags on the live card */
  /* tags: Don't Miss / Upcoming / On Air / Live / Watching */
  .tags{ display:flex; gap:8px; align-items:center; flex:0 0 auto; }
  .tag{ height:26px; box-sizing:border-box; padding:4px; display:flex; align-items:center; gap:4px; border-radius:4px; border:1px solid #5d5d5d;
    background:rgba(255,255,255,.16); font:400 16px/1.2 var(--noto); letter-spacing:-.24px; color:rgba(255,255,255,.8); white-space:nowrap; }
  .tag img{ width:16px; height:16px; display:block; }
  .tag.live{ background:var(--live); border-color:var(--on-surface); color:#fff; }
  .tag.watch{ background:var(--live); border-color:var(--on-surface); color:#fff; }   /* the channel the player was showing (View Program Guide from it) */
  body.arrive *, body.arrive *::before, body.arrive *::after{ transition:none !important; }   /* back from the player: no easing into place */
  /* sound bars before Watching: the channel's sound is playing */
  .tag .eq{ width:14px; height:14px; display:flex; align-items:flex-end; justify-content:space-between; }
  .tag .eq b{ width:3px; height:100%; border-radius:1px; background:currentColor; transform-origin:bottom; animation:eq .9s ease-in-out infinite; }
  .tag .eq b:nth-child(2){ animation-delay:-.3s; animation-duration:.7s; }
  .tag .eq b:nth-child(3){ animation-delay:-.6s; animation-duration:1.1s; }
  @keyframes eq{ 0%, 100%{ transform:scaleY(.3); } 50%{ transform:scaleY(1); } }
  .tag.live i{ width:6px; height:6px; border-radius:100px; background:#fff; }
  .tag.watching{ background:#59d478; border-color:var(--on-surface); color:#000; font-weight:500; }
  /* date separator between days */
  .day-sep{ height:47px; box-sizing:border-box; border-radius:8px; margin-top:51px;   /* 51 + 47 = 98, a programme card's height: one grid slot */
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); font:500 20px/1.2 var(--noto); letter-spacing:-.24px;
    text-shadow:0 4px 4px rgba(0,0,0,.15), 0 1px 1.5px rgba(0,0,0,.3); }

  .empty{ margin:40px 110px 0; font:400 24px/1.4 var(--noto); color:var(--on-surface-variant); }
  body.v-channels .only-guide, body.v-guide .only-channels{ display:none !important; }

  /* first-visit hint (Figma PLAY epg / mini epg "Alert", 23:10054): a full-width bar along the bottom, shown when the page
     opens, fading away after 2.5s */
  .alert{ position:absolute; left:0; bottom:0; width:1920px; height:120px; z-index:28; box-sizing:border-box; padding:40px 0;
    display:flex; align-items:center; justify-content:center; gap:16px; border-radius:12px; overflow:hidden; pointer-events:none;
    /* Home's default theme: navy-tinted frosted glass (like the dropdown menu) over a strong blur of the guide behind */
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 60%), rgba(18,24,36,.72);
    backdrop-filter:blur(24px) saturate(1.3); -webkit-backdrop-filter:blur(24px) saturate(1.3);
    box-shadow:0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px 0 rgba(0,0,0,.3);
    transition:opacity .4s ease, transform .4s cubic-bezier(.2,0,0,1); }
  .alert.gone{ opacity:0; transform:translateY(24px); }
  .alert .bar{ width:6px; height:34.286px; flex:0 0 auto; border-radius:4px; background:var(--on-surface);
    box-shadow:0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px 0 rgba(0,0,0,.3); }
  .alert p{ margin:0; font:400 32px/40px Roboto, sans-serif; color:var(--on-surface); white-space:nowrap; }
  /* favourite added, like a TikTok / Facebook like: a big heart pops over the card and floats away, and the small heart
     bounces in with a ring and a burst of sparks; removing it just shrinks the small heart back */
  .fav-wrap{ position:relative; display:block; width:20px; height:20px; }
  .fav-wrap .fav-ic{ position:relative; z-index:1; }
  .rem-wrap{ position:relative; display:none; width:24px; height:24px; flex:0 0 auto; }

      nz = zs[zi + 2];
      if(nz === 'grid') mem.grid = 0;
      if(nz === 'guide') mem.guide = {c:0, r:0};
    }
    if(!nz) return;
    // coming onto the sub-tabs: start on the selected (underlined) one
    if(nz === 'subs') mem.subs = Math.max(0, zoneItems('subs').map(function(e){ return e.dataset.sub; }).indexOf(S.sub));
    if(nz === 'tabs') mem.tabs = Math.max(0, CATS.map(function(c){ return c.id; }).indexOf(S.cat));
    if(nz === 'head' && zone !== 'head') mem.head = S.view === 'guide' ? 1 : 0;
    zone = nz;
  }

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800); }
  function back(){
    try { if(document.referrer && /(home|sport)\.html/.test(document.referrer) && history.length > 1){ history.back(); return; } } catch(e){}
    location.href = 'home.html';
  }
  // Back steps out one level at a time: a programme below the live card → that column's live card → the selected sub-tab (when the category has them)
  // → the selected main category → Home
  function stepBack(){
    // in a guide column below its live card: Back first returns to that column's live card (what's on now)
    // (and that column's list goes back to its start: only that column, the others stay as they are)
    if(zone === 'guide' && mem.guide.r > 0){
      var sc = guideCols()[mem.guide.c][1].closest('.col-scroll');
      if(sc) sc.dataset.scrollTopTo = 0;   // paint() sees the change and scrolls it back
      mem.guide = {c:mem.guide.c, r:0}; return;
    }
    if(zone === 'grid' || zone === 'guide'){
      if(zones().indexOf('subs') >= 0){
        zone = 'subs'; mem.subs = Math.max(0, zoneItems('subs').map(function(e){ return e.dataset.sub; }).indexOf(S.sub));
        return;
      }
      zone = 'tabs';
    } else if(zone === 'subs') zone = 'tabs';
    else { back(); return; }
    mem.tabs = Math.max(0, CATS.map(function(c){ return c.id; }).indexOf(S.cat));
  }
  // Enter on a channel (or on what's on now) plays it in the Live TV player (live-tv-player.html). The tab and the
  // channel are kept for coming back, so Back from the player lands on the same card
  function videoFor(c){
    var V = 'video/', has = function(k){ return c.cats.indexOf(k) >= 0 || (c.tags || []).indexOf(k) >= 0; };
    if(/COOL/.test(c.n)) return V + 'coolch.mp4';
    if(has('football')) return V + 'football.mp4';
    if(has('basketball')) return V + 'all-star.mp4';
    if(has('sports')) return V + 'bad.mp4';
    if(has('cartoons')) return V + 'dis.mp4';
    if(has('variety')) return V + 'concert.mp4';
    if(/HBO|Cinemax/.test(c.n)) return V + 'hbo.mp4';
    if(has('movies')) return V + 'spiderman.mp4';
    return V + 'vall.mp4';
  }
  function openPlayer(c, replace, loud){
    var p = c.progs[onAt(c, new Date())];
    try { sessionStorage.setItem('tvGuideBack', JSON.stringify({view:S.view, cat:S.cat, sub:S.sub, no:c.no})); } catch(e){}
    // the channel numbers there are, so the player can say "not available" for a typed number without leaving
    try { sessionStorage.setItem('tvChannelNos', JSON.stringify(CHANNELS.filter(function(x){ return !x.excl; }).map(function(x){ return x.no; }))); } catch(e){}
    // and the channels with their programmes around now, for the player's mini EPG (Browse Channels)
    try {
      var t0 = Date.now() - 36e5, t1 = Date.now() + 12 * 36e5;
      sessionStorage.setItem('tvMini', JSON.stringify({
        cats: CATS.map(function(k){ return {id:k.id, n:k.n}; }),
        chans: CHANNELS.map(function(x){
          return {n:x.n, no:x.no, excl:!!x.excl, logo:x.logo || '', fit:x.fit || '', box:x.box || null, bg:x.bg || '', txt:x.txt || '', fg:x.fg || '',
            crown:x.crown || '', fav:!!x.fav, recent:!!x.recent, cats:x.cats, live:SPORT_CH.some(function(k){ return x.cats.indexOf(k) >= 0; }),
            progs:x.progs.filter(function(pr){ return pr.end > t0 && pr.start < t1; }).map(function(pr){ return [pr.t, pr.start.getTime(), pr.end.getTime(), pr.ts ? 1 : 0, pr.hot ? 1 : 0]; })};
        })
      }));
    } catch(e){}
    var q = {n:c.n, no:c.excl ? '' : c.no, crown:c.crown || '', fav:c.fav ? 1 : '', logo:c.logo || '', fit:c.fit || '', box:c.box ? c.box.join(',') : '',
             bg:c.bg || '', txt:c.txt || '', fg:c.fg || '', t:p.t, s:p.start.getTime(), e:p.end.getTime(), v:videoFor(c),
             ts:p.ts ? 1 : '', quiet:replace && !loud ? 1 : ''};   // Time Shift: what's on now has the Time Shift icon; quiet: a channel change (see the player)
    var url = 'live-tv-player.html?' + Object.keys(q).filter(function(k){ return q[k] !== ''; })
      .map(function(k){ return k + '=' + encodeURIComponent(q[k]); }).join('&');
    if(replace) location.replace(url); else location.href = url;
  }
  function chByNo(no){ return CHANNELS.filter(function(c){ return c.no === +no; })[0]; }
  function activate(el){
    // sub-tabs: moving along them only moves focus; Enter picks one (underlined) and filters
    if(el.classList.contains('sub')){ selectSub(el.dataset.sub); return; }
    if(el.classList.contains('sw')){ setView(el.dataset.view); mem.head = S.view === 'guide' ? 1 : 0; zone = 'head'; return; }
    if(el.classList.contains('dd-trigger')){ openMenu(el.parentElement === dds.date ? 'date' : 'time'); return; }
    if(el.classList.contains('ch-card')){ openPlayer(chByNo(el.dataset.no)); return; }
    if(el.classList.contains('prog')){
      var p = PROG_BY_KEY[el.dataset.key], now = new Date();
      if(p.start <= now && p.end > now){ openPlayer(p.ch); return; }
      if(p.end <= now){ toast(p.t + ' has ended'); return; }
      // a programme still to come: Enter sets (or clears) a reminder, shown as a bell on its card
      if(reminders[p.key]){ delete reminders[p.key]; toast('Reminder removed: ' + p.t); }
      else { reminders[p.key] = true; toast('Reminder set: ' + p.t + ' at ' + fmtTime(p.start)); }
      hideHint();
      var wrap = el.querySelector('.rem-wrap');   // updated in place (no re-render), so the focus ring stays put
      if(wrap){
        var on = !!reminders[p.key], img = wrap.querySelector('img');
        wrap.classList.toggle('on', on);
        img.src = 'icons/tv-guide/' + (on ? 'notify.svg' : 'bell.svg'); img.alt = on ? 'Reminder set' : 'Set reminder';
        iconAnim(img, on);
      }
      return;
    }
  }
  function onClick(e){
    e.stopPropagation(); closeMenu();
    var el = e.currentTarget, found = false;
    zones().forEach(function(z){
      if(found) return;
      if(z === 'guide'){ guideCols().forEach(function(col, c){ var r = col.indexOf(el); if(r >= 0){ mem.guide = {c:c, r:r}; zone = 'guide'; found = true; } }); return; }
      var i = zoneItems(z).indexOf(el); if(i >= 0){ mem[z] = i; zone = z; found = true; }
    });
    if(el.classList.contains('tab')) selectCat(el.dataset.cat);
    else if(el.classList.contains('sub')) selectSub(el.dataset.sub);
    else activate(el);
    paint();
  }
  $('.sw, .tab, .dd-trigger').forEach(function(el){ el.addEventListener('click', onClick); });

  var guideHinted = false, remHinted = false;
  var HOLD_MS = 600, hold = { el:null, done:true, t:0 };
  addEventListener('keyup', function(e){
    if((e.key !== 'Enter' && e.key !== ' ') || !hold.el) return;
    clearTimeout(hold.t);
    var el = hold.el, done = hold.done; hold = { el:null, done:true, t:0 };
    if(!done && el.isConnected && el.classList.contains('focused')) activate(el);   // a short press
  });
  function toggleFav(c, from){
    hideHint();
    c.fav = !c.fav; saveFav(c);
    toast(c.fav ? 'Added to Favorite: ' + c.n : 'Removed from Favorite: ' + c.n);
    if(S.cat === 'fav'){ render(); resetZones(); paint(); return; }   // the Favorite list itself changed
    $('[data-no="' + c.no + '"] .fav-ic').forEach(function(img){ img.src = 'icons/tv-guide/' + (c.fav ? 'heart-fill.svg' : 'heart.svg'); img.alt = c.fav ? 'Favorite' : ''; });
    favAnim(c, from);
  }
  // a small icon turning on (heart, bell): bounces in with a ring and a burst of sparks; turning off: a quick squeeze
  function iconAnim(img, on){
    img.classList.remove('pop', 'unpop'); void img.offsetWidth;   // restart the animation
    img.classList.add(on ? 'pop' : 'unpop');
    if(!on) return;
    var b = document.createElement('span'); b.className = 'fav-burst';
    b.innerHTML = '<span class="ring"></span>' + [0,45,90,135,180,225,270,315].map(function(a){ return '<i style="--a:' + a + 'deg"></i>'; }).join('');
    img.parentElement.appendChild(b); setTimeout(function(){ b.remove(); }, 700);
  }
  // the like animation on the focused card (and its small heart wherever it shows)
  function favAnim(c, from){
    var card = from && from.isConnected ? from : $('.ch-card[data-no="' + c.no + '"]')[0];   // the big heart pops over the card held
    $('[data-no="' + c.no + '"] .fav-ic').forEach(function(img){ iconAnim(img, c.fav); });
    if(c.fav && card){
      var big = document.createElement('div'); big.className = 'fav-big';
      card.appendChild(big); setTimeout(function(){ big.remove(); }, 1000);
    }
  }
  addEventListener('keydown', function(e){
    var handled = true;
    if(menu){
      if(e.key === 'ArrowDown') menu.hl = Math.min(menu.opts.length - 1, menu.hl + 1);
      else if(e.key === 'ArrowUp') menu.hl = Math.max(0, menu.hl - 1);
      else if(e.key === 'Enter' || e.key === ' ') { pickMenu(); e.preventDefault(); return; }
      else if(e.key === 'Escape' || e.key === 'Backspace') closeMenu();
      else handled = false;
      if(handled){ e.preventDefault(); if(menu) paintMenu(); }
      return;
    }
    if(e.key === 'ArrowRight') move(1, 0);
    else if(e.key === 'ArrowLeft') move(-1, 0);
    else if(e.key === 'ArrowDown') move(0, 1);
    else if(e.key === 'ArrowUp') move(0, -1);
    else if(e.key === 'Enter' || e.key === ' '){
      var el = focusedEl();
      if(e.repeat){ e.preventDefault(); return; }   // held down: the timer below decides
      // a channel card or a programme: a short press opens / watches it (on release); held for HOLD_MS it toggles the
      // channel's Favorite instead
      if(el && (el.classList.contains('ch-card') || el.classList.contains('prog'))){
        clearTimeout(hold.t);
        var ch = el.classList.contains('prog') ? PROG_BY_KEY[el.dataset.key].ch : chByNo(el.dataset.no);
        hold = { el:el, done:false, t:setTimeout(function(){ hold.done = true; toggleFav(ch, el); }, HOLD_MS) };
        e.preventDefault(); return;
      }
      if(el) activate(el);
    }
    else if(e.key === 'Escape' || e.key === 'Backspace') stepBack();
    else handled = false;
    if(handled){ e.preventDefault(); paint(); }
  });
  // mouse wheel / trackpad scrolls the page
  document.getElementById('page').addEventListener('wheel', function(e){ this.scrollTop += e.deltaY; e.preventDefault(); }, {passive:false});

  // the hint is set up before the first paint: coming back from the player into the Program Guide paints focus on a
  // programme straight away, which shows it
  var hintEl = document.getElementById('hint'), hintT;
  function hideHint(){ clearTimeout(hintT); hintEl.classList.add('gone'); }
  var HINT_FAV = 'Press and hold OK to add/remove favorites', HINT_REM = 'Press OK to set/unset reminder';
  function showHint(msg){ clearTimeout(hintT); document.getElementById('hintText').textContent = msg || HINT_FAV; hintEl.classList.remove('gone'); hintT = setTimeout(hideHint, 2500); }   // on screen for 2.5s
  // ?view=guide opens the Program Guide straight away
  if(/view=guide/.test(location.search)) S.view = 'guide';
  // back from the player: the same view, tab and channel as when it was opened
  var ret = null; try { ret = JSON.parse(sessionStorage.getItem('tvGuideBack')); sessionStorage.removeItem('tvGuideBack'); } catch(e){}
  if(ret && !/view=/.test(location.search)){ S.view = ret.view; S.cat = ret.cat; S.sub = ret.sub; }
  // ?tune=N: the player asked for channel N (typed on the remote). This page only passes through: it opens that channel
  // in the player in its place (so Back from there still comes here), or sends the viewer back to the player they came
  // from (?from=) when there is no such channel
  // ?zap=1 / -1 & cur=<name>: Down / Up in the player, the next / previous channel by number (wrapping round; the
  // Exclusive channels have no number, so they are left out)
  // ?play=<name>: a channel picked in the player's mini EPG (by name: Exclusive channels have no number), or a channel
  // card on Home (&from=home: opened with the controls showing, and Back returns to Home)
  var pick = /[?&]play=([^&]*)/.exec(location.search);
  if(pick){
    var pc = CHANNELS.filter(function(c){ return c.n === decodeURIComponent(pick[1]); })[0];
    if(pc){ document.body.style.visibility = 'hidden'; openPlayer(pc, true, /[?&]from=home/.test(location.search)); return; }
  }
  var zap = /[?&]zap=(-?1)/.exec(location.search);
  if(zap){
    var nums = CHANNELS.filter(function(c){ return !c.excl; }).sort(function(a, b){ return a.no - b.no; }),   // in number order
        cur = decodeURIComponent((/[?&]cur=([^&]*)/.exec(location.search) || [])[1] || '');
    var at = nums.map(function(c){ return c.n; }).indexOf(cur), dir = +zap[1];
    if(at < 0) at = dir > 0 ? -1 : 0;
    document.body.style.visibility = 'hidden';
    openPlayer(nums[(at + dir + nums.length) % nums.length], true); return;
  }
  var tune = /[?&]tune=(\d+)/.exec(location.search);
  if(tune){
    var tc = chByNo(tune[1]), from = (/[?&]from=([^&]*)/.exec(location.search) || [])[1];
    document.body.style.visibility = 'hidden';
    if(tc && !tc.excl){ openPlayer(tc, true); return; }
    if(from){
      try { if(ret) sessionStorage.setItem('tvGuideBack', JSON.stringify(ret)); } catch(e){}   // still there for Back from that player
      from = decodeURIComponent(from); location.replace(from + (from.indexOf('?') < 0 ? '?' : '&') + 'nochan=' + tune[1]); return; }
    document.body.style.visibility = ''; document.documentElement.style.visibility = '';   // no such channel and nowhere to go back to: show the guide
  }
  paintHead(); render();
  if(ret && !/view=/.test(location.search)){
    var at = channelsFor().map(function(c){ return ret.n ? c.n : c.no; }).indexOf(ret.n || ret.no);   // by name from the player (Exclusive channels have no number)
    if(at >= 0){ if(S.view === 'channels'){ zone = 'grid'; mem.grid = at; } else { zone = 'guide'; mem.guide = {c:at, r:0}; } }
  }
  // back from the player (Back or View Program Guide): the card is focused at once, no scrolling or growing into place
  if(ret){ ARRIVE = true; document.body.classList.add('arrive'); }
  paint();
  if(ARRIVE) requestAnimationFrame(function(){ requestAnimationFrame(function(){ ARRIVE = false; document.body.classList.remove('arrive'); }); });
  // first impression: the hint slides in as the page opens and leaves after a few seconds (or once a favourite is set)
  setTimeout(function(){ showHint(HINT_FAV); }, 400);
})();
</script>
<script src="focus-ring.js"></script>
</body>
</html>
