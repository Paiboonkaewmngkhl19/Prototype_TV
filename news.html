<!--
  News page (Figma News "MainContent", 6601:54803), opened with Enter on Home's News chip.
  A 1920x1080 TV screen scaled to the window, built like sport.html: the same hero, rails, focus model and top bar,
  the shared gliding focus ring (focus-ring.js) and profile panel (profile-panel.js), the chip theme (chip-theme.css)
  for the category chips and the button theme (button-theme.css) for View All, Back to Top and the top-bar tabs.

  Flow (Figma "Dynamic Background", 6222:3306): every rail from Don't Miss to the last episode rail keeps the hero,
  which speaks for the focused item over its picture; the focused rail sits at y=649. Back to Top is the one static
  screen: the hero and the top bar step away. Remote / keyboard: arrows move focus, Enter selects, Esc / Back returns
  to the top (then to Home).
-->
<link rel="stylesheet" href="page-head.css">
<link rel="stylesheet" href="news/news.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div id="frame"><div id="screen">
  <div class="hero-bg"><div class="pic"></div><div class="pic"></div></div>

  <div id="page"></div>

  <section class="hero" aria-live="polite"><h1></h1><div class="meta"></div><p class="desc"></p></section>
  <header class="page-head"><i></i><h1>News</h1></header>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item active" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV" data-href="tv-guide.html?play=MUTV&amp;from=news">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movie" data-href="movie.html">Movie</div>
      <div class="navtab tv-tab item" data-label="Sport" data-href="sport.html">Sport</div>
      <div class="navtab tv-tab item" data-label="My List">My List</div>
      <div class="navtab tv-tab item" data-label="Store" data-href="store.html">Store</div>
    </div>
  </nav>
  <div id="toast"></div>
</div></div>
