<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<!--
  Store page (Figma "PLAY:store_mainPage", node 5205:222060), opened from the Store tab in the top bar.
  A 1920x1080 TV screen scaled to the window, like sport.html; the shared gliding focus ring is focus-ring.js.

  Flow (Figma "Direction and Role", 5205:240827):
  - Dynamic background, For You to Great Value: the hero speaks for the focused package (tags, title, price, VAT,
    description) over its artwork, laid out as Home's hero (text pinned at the top, a dark wash on the left, a fade
    into the page at the bottom); the focused rail sits at y=600 and the rails above it fade away. Sports, Movies,
    Short Series and Great Value have a tab bar: Up from the cards reaches it, Left / Right picks a tab.
  - Static background, from PPV Event down: the hero and the top bar go, the page scrolls with the focused rail near
    the top. PPV Event's focused card opens up to 16:9 with its details (VOD, upcoming live or live), as Home's AIS Play Exclusive; the
    Rent or Buy's posters grow 8% on focus, as Home's. Then the banner, the My Subscription / FAQs / Customer Support cards and
    Back to Top.
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back returns to the top (then to Home).
-->
<link rel="stylesheet" href="button-theme.css">
<link rel="stylesheet" href="chip-theme.css">
<link rel="stylesheet" href="quick-card.css">
<link rel="stylesheet" href="live-ribbon.css">
<link rel="stylesheet" href="expand-card.css">
<link rel="stylesheet" href="event-card.css">
<link rel="stylesheet" href="corner-tag.css">
<link rel="stylesheet" href="platform-tag.css">
<style>
  :root{
    color-scheme:dark;
    /* Figma variables (default mode) */
    /* Home's page: dark navy, Open Sans */
    --bg-0:#070e16; --wash:10,8,24;
    --surface:#070e16; --on-surface:#e8e8e8; --on-surface-variant:#a8a8a8; --surface-container-low:#070e16; --surface-container:#2a2a2a;
    --surface-container-high:#3a3a3a; --surface-container-highest:#4a4a4a; --outline:#5a5a5a; --outline-variant:#4a4a4a;
    --inverse-surface:#e8e8e8; --on-inverse-surface:#101010; --live:#ff1f1f;
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    /* Home's focus fill: the frosted grey-blue glass of a focused top-bar tab, white text */
    --focus-fill:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), var(--th-pill);
    /* resting buttons: Home's chip rail, white frosted glass over a strong blur; a picked tab a little brighter */
    --idle-fill:rgba(255,255,255,.16); --idle-fill-on:rgba(255,255,255,.26);
    --ease:cubic-bezier(.2,0,0,1);
    --inter:'Open Sans', system-ui, sans-serif; --roboto:'Open Sans', system-ui, sans-serif;
    --ph:url('store-assets/placeholder.png');
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:var(--on-surface); font-family:var(--inter); -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--bg-0); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; overflow:hidden;
    background:radial-gradient(1400px 900px at 85% 110%, rgba(214,222,240,.12), transparent 70%), var(--bg-0); }   /* Home's page colour and glow */

  /* ---------- hero background: Figma's placeholder at 20%, the package's artwork on the right (key art is square, so it
     keeps Figma's spot instead of filling the screen), under Home's overlay: a dark wash behind the text on the left and
     a fade into the page at the bottom ---------- */
  .hero-bg{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:0; overflow:hidden; transition:opacity .4s ease; }
  .hero-bg .ph{ position:absolute; inset:0; background:url('store-assets/hero-placeholder.png') center / cover no-repeat; opacity:.2; }
  .hero-bg .art{ position:absolute; left:43.91%; top:-2.54%; width:56.09%; height:99.72%; background:center / cover no-repeat; opacity:0; transition:opacity .45s ease; }
  .hero-bg .art.on{ opacity:1; }
  .hero-bg .art{ -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 30%); mask-image:linear-gradient(90deg, transparent 0%, #000 30%); }   /* no hard edge where the art starts */
  .hero-bg .down{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 52%, rgba(var(--wash),.55) 74%, var(--bg-0) 96%); }
  .hero-bg .side{ position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(var(--wash),.88) 0%, rgba(var(--wash),.62) 30%, rgba(var(--wash),.12) 58%, transparent 75%); }
  body.static .hero-bg{ opacity:0; }

  /* ---------- hero text, as Home's: tags, title, price, description, ending 80px above the focused rail (placeHero) ---------- */
  .hero{ position:absolute; left:110px; bottom:560px; width:1100px; z-index:3; display:flex; flex-direction:column; gap:14px;
    transition:opacity .3s ease, transform .3s var(--ease); }
  body.static .hero{ opacity:0; transform:translateY(-40px); pointer-events:none; }
  .hero.swap{ animation:heroIn .3s var(--ease); }
  @keyframes heroIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .hero .tags{ display:flex; gap:8px; height:36px; overflow:hidden; }
  .tag{ height:36px; padding:0 12px; border-radius:9999px; display:inline-flex; align-items:center; background:var(--surface-container);
    font-weight:500; font-size:20px; color:var(--on-surface); white-space:nowrap; }
  .hero h1{ margin:0; font-size:72px; font-weight:700; line-height:1.08; letter-spacing:-.01em; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero .price{ display:flex; gap:16px; align-items:baseline; white-space:nowrap; text-shadow:0 0 6px rgba(0,0,0,.6); }
  .hero .price b{ font-weight:400; font-size:45px; line-height:52px; }
  .hero .price span{ font-weight:500; font-size:28px; }
  .hero .desc{ margin:0; max-width:760px; font-size:26px; line-height:1.4; color:#fff; opacity:.82; text-shadow:0 0 6px rgba(0,0,0,.6);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- the page: Figma's rails, 60px apart; it moves as a whole (translateY) ---------- */
  #page{ position:absolute; left:0; top:0; width:1920px; z-index:1; padding:600px 0 0; display:flex; flex-direction:column; gap:60px;
    transition:transform .45s var(--ease); }
  .sec{ position:relative; transition:opacity .3s ease; }
  body:not(.static) .sec.above{ opacity:0; }
  .sec-title{ margin:0 110px; font-weight:500; font-size:29px; line-height:40px; color:#fff; white-space:nowrap; }   /* Home's row title */
  .item{ cursor:pointer; }
  .rail{ position:relative; margin-top:40px; }   /* 40px from the rail title to its cards, on every rail (room for a focused card and its ring too) */
  .track{ display:flex; gap:32px; padding:0 110px; width:max-content; transition:transform .35s var(--ease); }

  /* placeholder artwork (Figma's checkerboard at 50% over the card colour) and its ratio label */
  .ph-bg{ background:var(--surface-container-high); }
  .ph-bg::before{ content:''; position:absolute; inset:0; background:var(--ph) center / cover no-repeat; opacity:.5; }
  .ratio{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;
    font-weight:500; font-size:11px; line-height:32px; color:var(--on-surface); }
  .ratio span{ opacity:.5; }
  .ratio img{ display:block; }
  .ratio.row{ flex-direction:row; gap:4px; }
  .ratio.big{ font-family:var(--roboto); font-size:24px; }
  .ratio.huge{ font-size:36px; line-height:44px; }

  /* card badges (Badge top) */
  /* card badges (Recommend, Best Seller, a sale's countdown) and the PPV event's start time: the top tag (corner-tag.css) */

  /* 1:1 package card (TV / Card), 250x250 */
  .sq{ position:relative; width:250px; height:250px; flex:0 0 auto; border-radius:12px; overflow:hidden; }
  .sq .pic{ position:absolute; inset:0; background:center / cover no-repeat; }
  .sq .pic img{ position:absolute; max-width:none; display:block; }
  .sq .pic.black{ background-color:#000; }
  .sq .pic.contain{ background-size:contain; }

  /* View All: Home's View All tile (its .clip-viewall), the rail's height, with the chip theme's states (chip-theme.css .tv-chip) */
  .viewall{ width:220px; flex:0 0 auto; align-self:stretch; border-radius:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#fff; }
  .viewall b{ font-size:28px; font-weight:700; }

  /* tab bar (TV / Chip): the picked tab is filled; the focused one turns light */
  .tabs{ display:flex; gap:32px;   /* chips 32px apart, on every page */
    padding:0 110px; margin-top:40px; width:max-content; transition:transform .35s var(--ease); }
  .chip{ position:relative; display:flex; align-items:center; gap:16px; padding:12px 32px 12px 24px; border-radius:12px; flex:0 0 auto;
    font-weight:500; font-size:24px; line-height:32px; color:var(--on-surface-variant); white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .chip::before{ content:''; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--outline-variant); opacity:.5; transition:opacity .15s ease; }
  .chip img{ width:48px; height:48px; border-radius:48px; display:block; }
  .chip img.ott{ width:var(--ptag-w); height:var(--ptag-h); border-radius:6px; object-fit:contain; background:#000; }   /* the platform tag (platform-tag.css, 56 x 36; its brand fill) */
  .chip.on{ background:var(--outline); color:var(--on-surface); }
  .chip.on::before, .chip.focused::before{ opacity:0; }
  .chip.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .cat .rail{ margin-top:40px; }

  /* Highlight you shouldn't miss (Gene rail): its own 500px band with Figma's picture at 40% */
  .gene{ height:500px; padding:0 0 20px; display:flex; flex-direction:column; justify-content:center; gap:40px; }
  .gene::before{ content:''; position:absolute; inset:0; background:var(--ph) center / cover no-repeat; opacity:.4; }
  .gene .sec-title, .gene .rail{ position:relative; margin-top:0; }

  /* PPV Event: Home's AIS Play Exclusive cards (expand-card.css) with the event's own details (event-card.css); placeholder pictures until the events have art */

  /* Rent or Buy: 2:3 posters, as Home's poster rails (no price, as in Figma) */
  .pst{ position:relative; width:220px; height:330px; flex:0 0 auto; border-radius:12px; }   /* Home's / Movie's poster: 220 x 330, focus grows it 8% */
  .pst .pic{ position:absolute; inset:0; border-radius:12px; overflow:hidden; }
  .rent .viewall{ height:330px; align-self:auto; }

  /* banner carousel */
  .banner{ position:relative; width:1700px; height:500px; margin:0 110px; border-radius:12px; overflow:hidden; background:var(--surface-container-high); }
  /* the slides sit side by side and slide under the frame; Left / Right (or the arrows) move one, wrapping round */
  .banner .slides{ position:absolute; left:0; top:0; height:100%; display:flex; transition:transform .5s var(--ease); }
  .banner .slide{ width:1700px; height:100%; flex:0 0 auto; background:center / cover no-repeat; }
  /* Figma "TV / Carousel arrow": an 80px round button, 24px in from the card's sides, a 32px chevron; the chip theme's
     states (chip-theme.css .tv-chip): frosted glass at rest, the chip's focused glass pill while pressed */
  .carr{ position:absolute; top:50%; z-index:1; width:80px; height:80px; border-radius:40px; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center; }
  .carr img{ width:32px; height:32px; display:block; }
  .carr.l{ left:24px; } .carr.r{ right:24px; }
  .carr.tv-chip.press{ background:var(--chip-focus-fill); -webkit-backdrop-filter:blur(50px) saturate(1.4); backdrop-filter:blur(50px) saturate(1.4);
    transform:translateY(-50%) scale(.92); }   /* the pressed side lights up for a moment (not .focused: the focus ring stays on the banner) */
  .dots{ position:absolute; z-index:1; left:50%; top:464px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; }
  .dots i{ width:12px; height:12px; border-radius:6px; background:rgba(255,255,255,.5); transition:width .3s var(--ease), background .3s ease; }
  .dots i.on{ width:34px; background:#fff; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:16px; border-radius:9999px; background:var(--surface-container); color:var(--on-surface);
    font-weight:500; white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .btn.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* shortcuts */
  .shorts{ display:flex; gap:32px; padding:0 110px; }
  .quick-card{ --qc-w:545px; }   /* Home's Quick Access cards (quick-card.css, chip-theme.css), three across as Movie's */

  /* Back to Top */
  .totop{ padding-bottom:60px; display:flex; align-items:center; justify-content:center; }   /* the button ends 60px above the screen's bottom */
  .totop .btn{ width:384px; height:80px; font-size:24px; line-height:32px; background:var(--surface-container-high); }
  .totop .btn img{ width:32px; height:32px; filter:invert(1); }
  .totop .btn.focused{ background:var(--focus-fill); }

  /* ---------- top bar (Home's), Store is the current page; past the hero the rails get the full screen: the top bar steps
     away until it gets focus, with the page colour fading in behind it ---------- */
  .scrim{ position:absolute; left:0; top:0; width:1920px; height:170px; z-index:4; pointer-events:none; opacity:0; transition:opacity .3s ease;
    background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-0) 45%, rgba(7,14,22,0) 100%); }
  body.static.on-nav .scrim, body.past-first.on-nav .scrim{ opacity:1; }   /* full screen past the hero: no fade over the rails, only behind the top bar when it comes back */
  .topnav{ position:absolute; left:0; top:0; z-index:5; width:1920px; padding:24px 110px 0; display:flex; align-items:center; transition:opacity .3s ease, translate .3s var(--ease); }
  body.static:not(.on-nav) .topnav, body.past-first:not(.on-nav) .topnav{ opacity:0; translate:0 -40px; pointer-events:none; }
  .profile{ width:60px; height:60px; border-radius:999px; overflow:hidden; flex:0 0 auto; }
  .profile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .center{ display:flex; align-items:center; gap:12px; margin-left:20px; }
  .navsearch{ width:60px; height:60px; margin:0 8px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .navsearch img{ width:32px; height:32px; display:block; }
  .navtab{ height:60px; padding:0 20px; border-radius:999px; display:flex; align-items:center; font-family:'Plus Jakarta Sans', var(--inter); font-size:24px; line-height:1.2;
    color:#fff; text-shadow:0 0 6px rgba(0,0,0,.4); white-space:nowrap; }
  .topnav .item:not(.tv-tab){ transition:background .15s ease; }
  .topnav .item.focused:not(.tv-tab){ background:var(--th-pill); backdrop-filter:blur(12px) saturate(1.4); }   /* the tabs: button-theme.css */

  #toast{ position:absolute; left:50%; bottom:80px; z-index:60; transform:translateX(-50%); padding:14px 26px; border-radius:999px;
    background:rgba(20,20,24,.85); font-size:24px; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  #toast.on{ opacity:1; }
  /* resting buttons and chips: Home's chip glass (the picked tab a little brighter); focus turns them to the glass pill */
  .chip::before{ display:none; }
  .chip:not(.focused), .btn:not(.focused){
    background:var(--idle-fill); -webkit-backdrop-filter:blur(80px) saturate(1.5); backdrop-filter:blur(80px) saturate(1.5); color:var(--on-surface); }
  .chip.on:not(.focused){ background:var(--idle-fill-on); color:#fff; }
  /* the picked tab while focus is off its tab bar (on its cards or another rail): Active dim, the focused chip's glass pill
     (its fill and white text), without the focus ring, which stays on the focused item */
  .chip.on.active-dim:not(.focused){ background:var(--focus-fill); -webkit-backdrop-filter:blur(50px) saturate(1.4); backdrop-filter:blur(50px) saturate(1.4);
    color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  /* focused items grow: 8% on every rail, 6% in the top bar; the opened PPV Event 5%, as Home's AIS Play
     Exclusive; the banner stays put, as Home's banners */
  #screen .item{ transition:transform .22s var(--ease), background .15s ease, color .15s ease; }
  #screen .item.focused{ transform:scale(1.08); z-index:2; }
  #screen .topnav .item.focused{ transform:scale(1.06); }
  #screen .xcard.focused{ transform:scale(1.05); }   /* as Home's AIS Play Exclusive */
  #screen .banner.focused{ transform:none; }
</style>
</head>
<body>
<div id="frame"><div id="screen">
  <div class="hero-bg"><div class="ph"></div><div class="art"></div><div class="art"></div><div class="down"></div><div class="side"></div></div>

  <div id="page"></div>

  <section class="hero" aria-live="polite"><div class="tags"></div><h1></h1><div class="price"><b></b><span></span></div><p class="desc"></p></section>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movie" data-href="movie.html">Movie</div>
      <div class="navtab tv-tab item" data-label="Sport" data-href="sport.html">Sport</div>
      <div class="navtab tv-tab item" data-label="My List">My List</div>
      <div class="navtab tv-tab item active" data-label="Store">Store</div>
    </div>
  </nav>
  <div id="toast"></div>
</div></div>

<script src="profile-panel.js"></script>
<script>
(function(){
  // ---- fit the 1920x1080 screen into the window ----
  var frame = document.getElementById('frame'), screen = document.getElementById('screen');
  function fit(){
    var k = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.width = 1920 * k + 'px'; frame.style.height = 1080 * k + 'px';
    frame.style.marginLeft = -960 * k + 'px'; frame.style.marginTop = -540 * k + 'px';
    screen.style.transform = 'scale(' + k + ')';
  }
  addEventListener('resize', fit); fit();

  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function attrs(o){ return Object.keys(o).filter(function(k){ return o[k] != null; }).map(function(k){ return ' data-' + k + '="' + esc(o[k]) + '"'; }).join(''); }

  /* ---------- content ----------

  // a placeholder package, as Figma's hero shows it
  function ph(badge){ return { badge:badge, t:'Package Title', price:199, per:'Month', tags:['Monthly', 'Recurring'], d:LOREM }; }
  // art: how the card shows its picture; hero: the picture behind the hero (a logo on black keeps Figma's placeholder hero)

    art:{ logo:SA + 'netflix-playbox.png', price:{ img:SA + 'netflix-price-99-7days.png', at:'height:17.12%;left:12.97%;top:76.18%;width:74.08%' } }, pkg:1 };
  var ROWS = {
    foryou:[ ULTIMATE,
      { badge:'Best Seller', dark:1, t:'PLAY ALL Asian Games', price:199, per:'Month', tags:['Monthly', 'Recurring', 'Best Seller'],

      { badge:'New Release', dark:1, t:'PLAY PREMIUM PLUS', price:99, per:'Month', tags:['Monthly', 'Recurring', 'New Release'],
        d:'Supergirl and the newest HBO Max originals, with five more apps in one package: HBO Max, Disney+ Hotstar, iQIYI, oneD and AIS PLAY.',
        art:{ img:SA + 'foryou-supergirl.png' }, pkg:1 },
      { badge:'Flash Sale', timer:12 * 3600 + 23 * 60 + 2, dark:1, t:'Prime Video 3 Months', price:149, per:'3 Months', tags:['3 Months', 'Flash Sale'],
        d:'Three months of Prime Video for 149 baht, then 149 baht a month. Amazon Originals, blockbuster films and live sport.',
        art:{ img:SA + 'foryou-prime.png', crop:'height:100%;left:-71.97%;top:0;width:177.78%' }, hero:SA + 'foryou-prime.png', pkg:1 },
      Object.assign(ph('Flash Sale'), { timer:43 * 3600 + 14 * 60 + 38 }), ph(), ph()],
    highlight:[
      { t:'AIS PLAY Asian Games Pass', price:199, per:'Month', tags:['Monthly', 'Recurring'],
        d:'The Asian Games in full on AIS PLAY: every venue live, the medal moments, and replays on demand, on every screen.',
        art:{ img:SA + 'highlight-asian-games.png' }, pkg:1 },
      ph(), ph(), ph(), ph()],
    sports:[
      { badge:'Recommend', t:'PLAY ALL', price:299, per:'Month', tags:['Monthly', 'Recurring', 'Recommend'],
        d:'All the sport on AIS PLAY in one package: Premier League, Bundesliga, Formula 1, NBA and the AIS PLAY Sports channels.',
        art:{ logo:SA + 'sports-playall.png' }, pkg:1 },
      { t:'MONOMAX Sports', price:199, per:'Month', tags:['Monthly', 'Recurring'],
        d:'Premier League and more sport on the MONOMAX app, for AIS customers. Every match live, with replays and highlights.',
        art:{ img:SA + 'sports-monomax.png' }, pkg:1 },
      ph(), ph(), ph(), ph(), ph()],
    movies:[ NETFLIX_7D,

    bannerDots.forEach(function(d, di){ d.classList.toggle('on', di === bannerAt); });
    bannerEl.dataset.label = BANNERS[bannerAt].t;
    if(side){ var a = bannerEl.querySelector('.carr.' + side); a.classList.add('press'); setTimeout(function(){ a.classList.remove('press'); }, 180); }
    clearInterval(slideT); slideT = setInterval(function(){ goSlide(bannerAt + 1); }, 6000);
  }
  goSlide(0);
  bannerEl.querySelector('.carr.l').addEventListener('click', function(e){ e.stopPropagation(); goSlide(bannerAt - 1, 'l'); });
  bannerEl.querySelector('.carr.r').addEventListener('click', function(e){ e.stopPropagation(); goSlide(bannerAt + 1, 'r'); });

  // Flash Sale countdowns
  setInterval(function(){
    $('[data-timer]', page).forEach(function(b){
      var s = Math.max(0, +b.dataset.timer - 1);
      b.dataset.timer = s;
      b.textContent = 'Flash Sale ' + hms(s);
    });
    ROWS.foryou.forEach(function(it){ if(it.timer) it.timer = Math.max(0, it.timer - 1); });
  }, 1000);

  // coming back (Back from the package page): the same card again
  try {
    var saved = sessionStorage.getItem('storeReturn') && JSON.parse(sessionStorage.getItem('storeFocus') || 'null');
    sessionStorage.removeItem('storeReturn');
    if(saved && saved.col && saved.col.length === rows.length && saved.tab){
      Object.keys(saved.tab).forEach(function(set){ pickTab(set, saved.tab[set]); });
      cur.col = saved.col; cur.row = saved.row; cur.from = saved.from;
      if(cur.row === 0) cur.row = cur.from || R.foryou;
    }
  } catch(e){}
  if(!cur.from) cur.from = R.foryou;
  page.style.transition = 'none';
  paint();
  // fonts change the rows' heights: lay out again once they are in, then let the page glide
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ paint(); requestAnimationFrame(function(){ page.style.transition = ''; }); });
})();
</script>
<script src="focus-ring.js"></script>
</body>
</html>
