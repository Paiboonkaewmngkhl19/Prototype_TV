<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<!--
  Store page (Figma "PLAY:store_mainPage", node 5205:222060), opened from the Store tab in the top bar.
  A 1920x1080 TV screen scaled to the window, like sport.html; the shared gliding focus ring is focus-ring.js.

  Flow (Figma "Direction and Role", 5205:240827):
  - Dynamic background, For You to Great Value: the hero speaks for the focused package (tags, title, price, VAT,
    description) over its artwork, laid out as Home's hero (text pinned at the top, a dark wash on the left, a fade
    into the page at the bottom); the focused rail sits at y=600 and the rails above it fade away. Sports, Movies,
    Short Series and Great Value have a tab bar: Up from the cards reaches it, Left / Right picks a tab.
  - Static background, from PPV Event down: the hero and the top bar go, the page scrolls with the focused rail near
    the top. The chosen card of PPV Event opens up to 16:9 with its details (VOD, upcoming live or live); the
    chosen card of Rentals and Buy grows and shows its price. Then the banner, My Subscription, the shortcuts, the
    FAQs (Enter opens / closes an answer), Customer Support, and Back to Top.
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back returns to the top (then to Home).
-->
<style>
  :root{
    color-scheme:dark;
    /* Figma variables (default mode) */
    /* Home's page: dark navy, Open Sans */
    --bg-0:#070e16; --wash:10,8,24;
    --surface:#070e16; --on-surface:#e8e8e8; --on-surface-variant:#a8a8a8; --surface-container-low:#070e16; --surface-container:#2a2a2a;
    --surface-container-high:#3a3a3a; --surface-container-highest:#4a4a4a; --outline:#5a5a5a; --outline-variant:#4a4a4a;
    --inverse-surface:#e8e8e8; --on-inverse-surface:#101010; --live:#ea5454;
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    /* Home's focus fill: the frosted grey-blue glass of a focused top-bar tab, white text */
    --focus-fill:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), var(--th-pill);
    /* resting buttons: Home's chip rail, white frosted glass over a strong blur; a picked tab a little brighter */
    --idle-fill:rgba(255,255,255,.16); --idle-fill-on:rgba(255,255,255,.26);
    --ease:cubic-bezier(.2,0,0,1);
    --inter:'Open Sans', system-ui, sans-serif; --roboto:'Open Sans', system-ui, sans-serif;
    --ph:url('store-assets/placeholder.png');
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:var(--on-surface); font-family:var(--inter); -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--bg-0); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; overflow:hidden;
    background:radial-gradient(1400px 900px at 85% 110%, rgba(214,222,240,.12), transparent 70%), var(--bg-0); }   /* Home's page colour and glow */

  /* ---------- hero background: Figma's placeholder at 20%, the package's artwork on the right (key art is square, so it
     keeps Figma's spot instead of filling the screen), under Home's overlay: a dark wash behind the text on the left and
     a fade into the page at the bottom ---------- */
  .hero-bg{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:0; overflow:hidden; transition:opacity .4s ease; }
  .hero-bg .ph{ position:absolute; inset:0; background:url('store-assets/hero-placeholder.png') center / cover no-repeat; opacity:.2; }
  .hero-bg .art{ position:absolute; left:43.91%; top:-2.54%; width:56.09%; height:99.72%; background:center / cover no-repeat; opacity:0; transition:opacity .45s ease; }
  .hero-bg .art.on{ opacity:1; }
  .hero-bg .art{ -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 30%); mask-image:linear-gradient(90deg, transparent 0%, #000 30%); }   /* no hard edge where the art starts */
  .hero-bg .down{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 52%, rgba(var(--wash),.55) 74%, var(--bg-0) 96%); }
  .hero-bg .side{ position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(var(--wash),.88) 0%, rgba(var(--wash),.62) 30%, rgba(var(--wash),.12) 58%, transparent 75%); }
  body.static .hero-bg{ opacity:0; }

  /* ---------- hero text, as Home's: pinned at the top (tags, title, price, description), above the focused rail at y=600 ---------- */
  .hero{ position:absolute; left:110px; top:160px; width:1100px; z-index:3; display:flex; flex-direction:column; gap:14px;
    transition:opacity .3s ease, transform .3s var(--ease); }
  body.static .hero{ opacity:0; transform:translateY(-40px); pointer-events:none; }
  .hero.swap{ animation:heroIn .3s var(--ease); }
  @keyframes heroIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .hero .tags{ display:flex; gap:8px; height:36px; overflow:hidden; }
  .tag{ height:36px; padding:0 12px; border-radius:9999px; display:inline-flex; align-items:center; background:var(--surface-container);
    font-weight:500; font-size:20px; color:var(--on-surface); white-space:nowrap; }
  .hero h1{ margin:0; font-size:72px; font-weight:700; line-height:1.08; letter-spacing:-.01em; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero .price{ display:flex; gap:16px; align-items:baseline; white-space:nowrap; text-shadow:0 0 6px rgba(0,0,0,.6); }
  .hero .price b{ font-weight:400; font-size:45px; line-height:52px; }
  .hero .price span{ font-weight:500; font-size:28px; }
  .hero .desc{ margin:0; max-width:760px; font-size:26px; line-height:1.4; color:#fff; opacity:.82; text-shadow:0 0 6px rgba(0,0,0,.6);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- the page: Figma's rails, 60px apart; it moves as a whole (translateY) ---------- */
  #page{ position:absolute; left:0; top:0; width:1920px; z-index:1; padding:600px 0 0; display:flex; flex-direction:column; gap:60px;
    transition:transform .45s var(--ease); }
  .sec{ position:relative; transition:opacity .3s ease; }
  body:not(.static) .sec.above{ opacity:0; }
  .sec-title{ margin:0 110px; font-weight:500; font-size:29px; line-height:40px; color:#fff; white-space:nowrap; }   /* Home's row title */
  .item{ cursor:pointer; }
  .rail{ position:relative; margin-top:32px; }   /* room for a focused card, its 4px ring gap and the ring under the title */
  .track{ display:flex; gap:32px; padding:0 110px; width:max-content; transition:transform .35s var(--ease); }

  /* placeholder artwork (Figma's checkerboard at 50% over the card colour) and its ratio label */
  .ph-bg{ background:var(--surface-container-high); }
  .ph-bg::before{ content:''; position:absolute; inset:0; background:var(--ph) center / cover no-repeat; opacity:.5; }
  .ratio{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;
    font-weight:500; font-size:11px; line-height:32px; color:var(--on-surface); }
  .ratio span{ opacity:.5; }
  .ratio img{ display:block; }
  .ratio.row{ flex-direction:row; gap:4px; }
  .ratio.big{ font-family:var(--roboto); font-size:24px; }
  .ratio.huge{ font-size:36px; line-height:44px; }

  /* card badges (Badge top) */
  .badges{ position:absolute; left:12px; top:12px; display:flex; z-index:1; }
  .bdg{ height:auto; padding:0 12px; border-radius:9999px; background:var(--surface-container-high); font-weight:500; font-size:20px; line-height:normal; color:var(--on-surface); white-space:nowrap; }
  .bdg.dark{ background:var(--surface); }

  /* 1:1 package card (TV / Card), 250x250 */
  .sq{ position:relative; width:250px; height:250px; flex:0 0 auto; border-radius:12px; overflow:hidden; }
  .sq .pic{ position:absolute; inset:0; background:center / cover no-repeat; }
  .sq .pic img{ position:absolute; max-width:none; display:block; }
  .sq .pic.black{ background-color:#000; }
  .sq .pic.contain{ background-size:contain; }

  /* View All (TV / Button), the rail's height */
  .viewall{ width:220px; flex:0 0 auto; align-self:stretch; border-radius:38px; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--surface-container-high); color:var(--on-surface); font-weight:500; font-size:24px; line-height:32px; transition:background .15s ease, color .15s ease; }
  .viewall.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* tab bar (TV / Chip): the picked tab is filled; the focused one turns light */
  .tabs{ display:flex; gap:24px; padding:0 110px; margin-top:24px; width:max-content; transition:transform .35s var(--ease); }
  .chip{ position:relative; display:flex; align-items:center; gap:16px; padding:12px 32px 12px 24px; border-radius:12px; flex:0 0 auto;
    font-weight:500; font-size:24px; line-height:32px; color:var(--on-surface-variant); white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .chip::before{ content:''; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--outline-variant); opacity:.5; transition:opacity .15s ease; }
  .chip img{ width:48px; height:48px; border-radius:48px; display:block; }
  .chip img.ott{ width:60px; height:40px; border-radius:10px; object-fit:cover; background:#000; }   /* Home's platform tag logo */
  .chip img.ott[src*="tag-disney"]{ background:#042437; }
  .chip.on{ background:var(--outline); color:var(--on-surface); }
  .chip.on::before, .chip.focused::before{ opacity:0; }
  .chip.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .cat .rail{ margin-top:40px; }

  /* Highlight you shouldn't miss (Gene rail): its own 500px band with Figma's picture at 40% */
  .gene{ height:500px; padding:0 0 20px; display:flex; flex-direction:column; justify-content:center; gap:40px; }
  .gene::before{ content:''; position:absolute; inset:0; background:var(--ph) center / cover no-repeat; opacity:.4; }
  .gene .sec-title, .gene .rail{ position:relative; margin-top:0; }

  /* PPV Event: 2:3 posters; the chosen one opens up to 16:9 with the event's details */
  .ev{ position:relative; width:368.67px; height:553px; flex:0 0 auto; border-radius:12px; overflow:hidden; }
  .ev .wide{ display:none; }
  .ev.sel{ width:960px; }
  .ev.sel .tall{ display:none; }
  .ev.sel .wide{ display:block; }
  .ev .scrim{ position:absolute; left:0; right:0; bottom:0; height:340px; background:linear-gradient(180deg, rgba(16,16,16,0), rgba(16,16,16,.88)); }
  .ev .top{ position:absolute; left:24px; top:24px; }
  .bdg.live{ background:var(--live); display:inline-flex; align-items:center; gap:4px; }
  .bdg.live::before{ content:''; width:12px; height:12px; background:url('sport-assets/dot.svg') center / contain no-repeat; }
  .ev .info{ position:absolute; left:40px; right:40px; bottom:24px; display:flex; flex-direction:column; gap:12px; }
  .ev h3{ margin:0; font-size:48px; font-weight:700; line-height:57px; color:var(--on-surface); }
  .ev .cost{ display:flex; align-items:baseline; gap:8px; white-space:nowrap; }
  .ev .cost b{ font-size:36px; font-weight:500; }
  .ev .cost span{ font-size:24px; color:var(--on-surface); }
  .ev .meta{ display:flex; align-items:center; gap:16px; height:36px; font-size:20px; color:var(--on-surface-variant); white-space:nowrap; }
  .ev .meta .b{ height:36px; padding:0 12px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px; background:var(--surface-container); color:var(--on-surface); font-weight:500; }
  .ev .meta .b img{ width:20px; height:20px; }
  .ev .meta .plat{ width:133px; justify-content:center; background:#fff; color:var(--on-inverse-surface); }
  .ev .meta .logo{ width:60px; height:36px; border-radius:9999px; background:#fff var(--ph) center / cover no-repeat; opacity:.9; }
  .ev .meta .pill{ height:36px; padding:0 12px; border:1px solid var(--outline); border-radius:18px; display:inline-flex; align-items:center; color:var(--on-surface); }
  .ev .meta .pill.sm{ height:28px; min-width:80px; justify-content:center; }
  .ev .meta strong{ color:var(--on-surface); font-weight:700; }
  .ev .syn{ margin:0; font-size:20px; line-height:24px; color:var(--on-surface-variant); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* Rentals / Buy: 2:3 posters; the chosen one grows to 264x396 and shows its price */
  .rent .track{ align-items:flex-start; height:396px; }
  .pst{ position:relative; width:220px; height:330px; margin-top:33px; flex:0 0 auto; border-radius:12px; }
  .pst .pic{ position:absolute; inset:0; border-radius:12px; overflow:hidden; }
  .pst .cost{ display:none; }
  .pst.sel{ width:264px; height:396px; margin-top:0; padding:8px; border-radius:24px; }
  .pst.sel .pic{ position:relative; inset:auto; height:340px; }
  .pst.sel .cost{ display:block; margin-top:8px; font-family:var(--roboto); font-weight:500; font-size:20px; line-height:24px; color:var(--on-surface); }
  .pst .badges{ left:12px; top:12px; }
  .pst.sel .badges{ left:20px; top:20px; }
  .rent .viewall{ height:330px; margin-top:33px; align-self:auto; }

  /* banner carousel */
  .banner{ position:relative; width:1700px; height:500px; margin:0 110px; border-radius:12px; overflow:hidden; background:url('store-assets/banner-soundbar.png') center / cover no-repeat; }
  .dots{ position:absolute; left:50%; top:464px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; }
  .dots i{ width:12px; height:12px; border-radius:6px; background:rgba(255,255,255,.5); transition:width .3s var(--ease), background .3s ease; }
  .dots i.on{ width:34px; background:#fff; }

  /* My Subscription */
  .mysub{ margin:0 110px; padding:24px 32px; border-radius:16px; background:var(--surface-container-high); display:flex; flex-direction:column; align-items:center; gap:24px; }
  .mysub .head{ align-self:stretch; display:flex; flex-direction:column; gap:16px; }
  .mysub .sec-title{ margin:0; }
  .subs{ display:flex; gap:16px; }
  .sub{ width:534.67px; height:147px; padding:11.5px 12px; border-radius:12px; background:var(--surface-container-highest); display:flex; gap:12px; }
  .sub .pic{ position:relative; width:124px; height:124px; border-radius:8px; overflow:hidden; flex:0 0 auto; }
  .sub .txt{ position:relative; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; font-family:var(--roboto); }
  .sub .txt b{ display:block; padding-right:120px; font-weight:500; font-size:32px; line-height:40px; color:var(--on-surface); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sub .txt span{ font-size:24px; line-height:28px; color:var(--on-surface-variant); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub .kind{ font-style:normal; position:absolute; right:0; top:0; height:40px; padding:0 12px; border-radius:9999px; background:var(--inverse-surface); color:var(--on-inverse-surface);
    font-size:24px; line-height:40px; font-weight:500; }
  .sub:not(.main) .kind{ top:16px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:16px; border-radius:9999px; background:var(--surface-container); color:var(--on-surface);
    font-weight:500; white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .btn.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .mysub .btn{ width:503px; height:91px; font-size:32px; font-family:var(--roboto); }

  /* shortcuts */
  .shorts{ display:flex; gap:24px; padding:0 110px; }
  .short{ width:550.67px; height:180px; border-radius:12px; background:var(--surface-container-highest); padding:24px 10px 30px; display:flex; flex-direction:column; justify-content:space-between;
    align-items:center; font-family:var(--roboto); color:var(--on-surface); transition:background .15s ease, color .15s ease; }
  .short span{ font-size:20px; line-height:23px; }
  .short b{ font-weight:500; font-size:32px; line-height:42px; }
  .short.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* FAQs: the phone QR panel and the questions */
  .faq{ display:flex; gap:24px; padding:0 110px; align-items:flex-start; }
  .qrpanel{ width:521px; height:530px; padding:40px; border-radius:16px; background:var(--surface-container); display:flex; flex-direction:column; align-items:center; gap:32px; flex:0 0 auto;
    font-family:var(--roboto); text-align:center; }
  .hd{ display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--roboto); font-weight:500; font-size:36px; line-height:44px; color:var(--on-surface); }
  .hd img{ display:block; }
  .qr{ position:relative; width:250px; height:250px; border-radius:16px; background:#fff; flex:0 0 auto; }
  .qr .code{ position:absolute; left:16px; top:16px; width:218px; height:218px; }
  .qr .lg{ position:absolute; left:93px; top:93px; width:67px; height:67px; border-radius:12px; }
  .qrpanel .t{ font-size:32px; line-height:48px; color:var(--on-surface); }
  .qrpanel .s{ margin-top:16px; font-size:24px; line-height:36px; color:var(--on-surface-variant); }
  .acc{ flex:1; display:flex; flex-direction:column; gap:24px; padding-right:24px; }
  .q{ border-radius:8px; }
  .q .qh{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:8px 8px 12px; border-bottom:1px solid var(--outline-variant);
    font-weight:700; font-size:20px; line-height:28px; color:var(--on-surface); }
  .q .qh i{ font-style:normal; font-weight:400; font-size:24px; width:24px; text-align:center; }
  .q .qa{ display:none; gap:24px; padding:16px 8px 0; }
  .q.open .qa{ display:flex; }
  .q .thumb{ position:relative; width:160px; height:90px; border-radius:4px; overflow:hidden; flex:0 0 auto; }
  .q p{ margin:0; font-size:16px; line-height:24px; color:var(--on-surface-variant); }

  /* Customer Support */
  .support{ padding:0 110px; display:flex; flex-direction:column; gap:32px; }
  .cols{ display:flex; gap:40px; font-family:var(--roboto); font-size:32px; line-height:40px; color:var(--on-surface); }
  .cols > div{ width:830px; display:flex; flex-direction:column; gap:16px; }
  .cols .h{ display:flex; align-items:center; gap:16px; }
  .cols ul{ margin:0; padding-left:44px; display:flex; flex-direction:column; gap:16px; }
  .cols li b{ font-weight:500; }

  /* Back to Top */
  .totop{ padding-bottom:60px; display:flex; align-items:center; justify-content:center; }   /* the button ends 60px above the screen's bottom */
  .totop .btn{ width:384px; height:80px; font-size:24px; line-height:32px; background:var(--surface-container-high); }
  .totop .btn img{ width:32px; height:32px; filter:invert(1); }
  .totop .btn.focused{ background:var(--focus-fill); }

  /* ---------- top bar (Home's), Store is the current page; past the hero the rails get the full screen: the top bar steps
     away until it gets focus, with the page colour fading in behind it ---------- */
  .scrim{ position:absolute; left:0; top:0; width:1920px; height:170px; z-index:4; pointer-events:none; opacity:0; transition:opacity .3s ease;
    background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-0) 45%, rgba(7,14,22,0) 100%); }
  body.static.on-nav .scrim{ opacity:1; }   /* full screen past the hero: no fade over the rails, only behind the top bar when it comes back */
  .topnav{ position:absolute; left:0; top:0; z-index:5; width:1920px; padding:24px 110px 0; display:flex; align-items:center; transition:opacity .3s ease, translate .3s var(--ease); }
  body.static:not(.on-nav) .topnav{ opacity:0; translate:0 -40px; pointer-events:none; }
  .profile{ width:60px; height:60px; border-radius:999px; overflow:hidden; flex:0 0 auto; }
  .profile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .center{ display:flex; align-items:center; gap:12px; margin-left:20px; }
  .navsearch{ width:60px; height:60px; margin:0 8px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .navsearch img{ width:32px; height:32px; display:block; }
  .navtab{ height:60px; padding:0 20px; border-radius:999px; display:flex; align-items:center; font-family:'Plus Jakarta Sans', var(--inter); font-size:24px; line-height:1.2;
    color:#fff; text-shadow:0 0 6px rgba(0,0,0,.4); white-space:nowrap; }
  .navtab.active{ background:rgba(255,255,255,.22); backdrop-filter:blur(10px); }
  .topnav .item{ transition:background .15s ease; }
  .topnav .item.focused{ background:var(--th-pill); backdrop-filter:blur(12px) saturate(1.4); }

  #toast{ position:absolute; left:50%; bottom:80px; z-index:60; transform:translateX(-50%); padding:14px 26px; border-radius:999px;
    background:rgba(20,20,24,.85); font-size:24px; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  #toast.on{ opacity:1; }
  /* resting buttons, chips and shortcuts: Home's chip glass (the picked tab a little brighter); focus turns them to the glass pill */
  .chip::before{ display:none; }
  .chip:not(.focused), .viewall:not(.focused), .btn:not(.focused), .short:not(.focused){
    background:var(--idle-fill); -webkit-backdrop-filter:blur(80px) saturate(1.5); backdrop-filter:blur(80px) saturate(1.5); color:var(--on-surface); }
  .chip.on:not(.focused){ background:var(--idle-fill-on); color:#fff; }
  /* focused items grow: 8% on every rail, 6% in the top bar; the opened PPV Event 4% (more would reach
     past the 32px gap); the banner and the FAQ questions stay put, as Home's banners */
  #screen .item{ transition:transform .22s var(--ease), background .15s ease, color .15s ease; }
  #screen .item.focused{ transform:scale(1.08); z-index:2; }
  #screen .topnav .item.focused{ transform:scale(1.06); }
  #screen .ev.focused{ transform:scale(1.04); }

    }
    page.style.transform = 'translateY(' + -Math.max(0, y) + 'px)';
    secs.forEach(function(s){ s.classList.toggle('above', s.offsetTop < r.sec.offsetTop); });
    document.body.classList.toggle('static', ri > DYNAMIC_END);
  }
  // the chosen card of PPV Event, Rentals and Buy stays open when focus leaves the rail
  function markChosen(){
    ['event', 'rent', 'buy'].forEach(function(k){ var r = rows[R[k]]; r.items.forEach(function(el, ci){ el.classList.toggle('sel', ci === cur.col[R[k]] && el.dataset.kind !== 'viewall'); }); });
  }

  // the profile panel under the top bar's photo, as on Home (profile-panel.js)
  var profileEl = document.querySelector('.topnav .profile'), prof = ProfilePanel(profileEl, { paint:paint, toast:toast });

  function paint(){
    var inProf = prof.paint(cur.row === 0 && rows[0].items[cur.col[0]] === profileEl);   // focus is in the profile panel
    rows.forEach(function(r, ri){ r.items.forEach(function(el, ci){ el.classList.toggle('focused', !inProf && ri === cur.row && ci === cur.col[ri]); }); });
    markChosen();
    var ri = cur.row === 0 ? cur.from : cur.row;   // on the top bar the page stays as it was
    document.body.classList.toggle('on-nav', cur.row === 0);
    layout(ri);
    var r = rows[ri];
    if(cur.row) slide(r, r.items[cur.col[ri]]);
    if(ri <= DYNAMIC_END) paintHero(r);
    try { sessionStorage.setItem('storeFocus', JSON.stringify(cur)); } catch(e){}
  }

  // a tab picked: its packages in the rail, focus back on the rail's first slot
  function pickTab(set, i){
    if(cur.tab[set] === i) return;
    cur.tab[set] = i;
    var tr = rows[R[set + '-tabs']];
    tr.items.forEach(function(c, ci){ c.classList.toggle('on', ci === i); });
    var track = rows[R[set]].sec.querySelector('.track');
    track.innerHTML = cardsHtml(set, listOf(set), set !== 'short' && set !== 'value');
    track.style.transform = '';
    rows[R[set]].items = $('.item', track);
    rows[R[set]].items.forEach(bindClick(R[set]));
    cur.col[R[set]] = 0;
  }

  /* ---------- actions ---------- */
  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600); }
  // leaving for the package page: its Back lands on the same card here
  function leave(url){ try { sessionStorage.setItem('storeReturn', '1'); } catch(e){} location.href = url; }
  function select(el){
    var k = el.dataset.kind, i = +el.dataset.i;
    el.animate([{ transform:getComputedStyle(el).transform }, { transform:(getComputedStyle(el).transform === 'none' ? '' : getComputedStyle(el).transform + ' ') + 'scale(0.97)' }], { duration:140, easing:'ease-out' });
    if(el.dataset.href){ location.href = el.dataset.href; return; }
    if(el === profileEl) return;   // its panel is already open under it
    if(k === 'pkg'){
      var set = el.dataset.set, it = (set === 'onetime' ? ONETIME : set === 'others' ? OTHERS : listOf(set))[i];
      if(it.pkg) leave('package-detail.html'); else toast(it.t + ' (demo)');
      return;
    }
    if(k === 'tab') return;
    // View All: the All Packages page, on the matching tab (For You, Sports, Movies, Short Drama)
    if(k === 'viewall'){ var tab = { sports:'sports', movies:'movies', short:'shorts' }[el.dataset.set]; leave('all-packages.html' + (tab ? '?tab=' + tab : '')); return; }
    if(k === 'event'){ var e = EVENTS[i]; toast(e.kind === 'live' ? 'Buy this event to watch it live (demo)' : e.kind === 'upcoming' ? 'Buy now and watch at ' + e.when.replace('Today ', '') + ' (demo)' : e.kind ? 'Buy this event (demo)' : 'Event (demo)'); return; }
    if(k === 'rent' || k === 'buy'){ toast((k === 'rent' ? 'Rent for ' : 'Buy for ') + (k === 'rent' ? RENTALS : BUYS)[i].price + ' ฿ (demo)'); return; }
    if(k === 'banner'){ leave('package-detail.html'); return; }
    if(k === 'faq'){ el.classList.toggle('open'); paintFaqSigns(); return; }
    if(k === 'shortcut' && i === 1){ cur.row = R.faq0; return; }
    if(k === 'shortcut' && i === 2){ cur.row = R.totop; return; }
    if(k === 'totop'){ cur.row = R.foryou; cur.col[R.foryou] = 0; return; }
    toast((el.dataset.label || 'Selected') + ' (demo)');
  }
  function back(){
    if(cur.row > R.foryou){ cur.row = R.foryou; paint(); return; }
    try { if(document.referrer && /(home|sport)\.html/.test(document.referrer) && history.length > 1){ history.back(); return; } } catch(e){}
    location.href = 'home.html';
  }

  addEventListener('keydown', function(e){
    if(prof.key(e.key)){ e.preventDefault(); return; }   // the profile photo / its panel
    var r = rows[cur.row], n = r.items.length, c = cur.col[cur.row], handled = true;
    if(e.key === 'ArrowRight') cur.col[cur.row] = Math.min(n - 1, c + 1);
    else if(e.key === 'ArrowLeft'){
      // Left on a rail's first item goes up to the top bar (its Store tab), as on Home
      if(cur.row > 0 && c === 0){ cur.from = cur.row; cur.row = 0; cur.col[0] = NAV_STORE; }
      else cur.col[cur.row] = Math.max(0, c - 1);
    }
    else if(e.key === 'ArrowUp'){
      if(cur.row === R.foryou){ cur.from = cur.row; cur.row = 0; cur.col[0] = NAV_STORE; }
      else if(cur.row > 0) cur.row--;
    }
    else if(e.key === 'ArrowDown'){
      if(cur.row === 0) cur.row = cur.from || R.foryou;
      else cur.row = Math.min(rows.length - 1, cur.row + 1);
    }
    else if(e.key === 'Enter') select(r.items[c]);
    else if(e.key === 'Escape' || e.key === 'Backspace'){ back(); e.preventDefault(); return; }
    else handled = false;
    if(!handled) return;
    e.preventDefault();
    // a tab bar picks the tab it lands on
    if(rows[cur.row].tabs) pickTab(rows[cur.row].set, cur.col[cur.row]);
    paint();
  });
  function bindClick(ri){
    return function(el, ci){
      el.addEventListener('click', function(){
        ci = rows[ri].items.indexOf(el);
        if(ri === 0) cur.from = cur.row || cur.from;
        cur.row = ri; cur.col[ri] = ci;
        if(rows[ri].tabs) pickTab(rows[ri].set, ci);
        paint(); select(el); paint();
      });
    };
  }
  rows.forEach(function(r, ri){ r.items.forEach(bindClick(ri)); });

  // Flash Sale countdowns
  setInterval(function(){
    $('[data-timer]', page).forEach(function(b){
      var s = Math.max(0, +b.dataset.timer - 1);
      b.dataset.timer = s;
      b.textContent = 'Flash Sale ' + hms(s);
    });
    ROWS.foryou.forEach(function(it){ if(it.timer) it.timer = Math.max(0, it.timer - 1); });
  }, 1000);

  // coming back (Back from the package page): the same card again
  try {
    var saved = sessionStorage.getItem('storeReturn') && JSON.parse(sessionStorage.getItem('storeFocus') || 'null');
    sessionStorage.removeItem('storeReturn');
    if(saved && saved.col && saved.col.length === rows.length && saved.tab){
      Object.keys(saved.tab).forEach(function(set){ pickTab(set, saved.tab[set]); });
      cur.col = saved.col; cur.row = saved.row; cur.from = saved.from;
      if(cur.row === 0) cur.row = cur.from || R.foryou;
    }
  } catch(e){}
  if(!cur.from) cur.from = R.foryou;
  page.style.transition = 'none';
  paint();
  // fonts change the rows' heights: lay out again once they are in, then let the page glide
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ paint(); requestAnimationFrame(function(){ page.style.transition = ''; }); });
})();
</script>
<script src="focus-ring.js"></script>
</body>
