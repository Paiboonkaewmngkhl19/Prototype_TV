<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Movie detail page (Figma Movies "Movie MD : Scene State" 2698:80456, "You May Also Like" 2698:79798): any title's detail
  (?k=<title> from content.js; District 9 without one), opened from the Movie page's cards and Home's District 9.
  The main button follows the title (MD.state): Resume (Continue Watching: its progress, Start Over), Play (rented, in the
  package, or bought this session), or View Package + Buy (package-suggest.html: the packages that include it, then
  package-detail.html's purchase; Buy rents it here). Play / Resume / Start Over open the Live TV player with the title.
  Down: the "You May Also Like" chip, then a 6-across poster grid (each opens its own detail).
  A series (Figma "Series MD : Scene State" 2700:17719, "Option select" 2700:17720) adds: Resume S1: Ep.5, Watch Trailer
  and Remind when it is for sale, "Available until" for a rental, and two tabs, Episodes (season chips over that season's
  episode cards; Enter plays the episode) and You May Also Like. The tab under focus fills the space below (one filter).
  Play / Resume / Start Over / an episode open player.html (a series: with its season and episode).
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back steps back (the grid) and returns.
-->
<link rel="stylesheet" href="button-theme.css">
<link rel="stylesheet" href="platform-tag.css">
<link rel="stylesheet" href="corner-tag.css">
<link rel="stylesheet" href="live-ribbon.css">
<link rel="stylesheet" href="tvguide-card.css">
<link rel="stylesheet" href="movie-detail/movie-detail.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div id="frame"><div id="screen">
  <div id="page">
    <div class="scene">
      <div class="bg" id="bg"></div>
      <div class="urow" id="urow" hidden><div class="utrack" id="utrack"></div></div>
      <section class="hero" id="hero"><h1 id="title"></h1><div class="watched" id="watched" hidden></div><div class="meta" id="meta"></div><p class="desc" id="desc"></p>
        <div class="until" id="until" hidden></div><div class="ctas" id="ctas"></div></section>
    </div>
    <div class="menu" id="menu"><div class="tab tv-btn tv-btn--secondary item" id="ymalTab" data-tab="ymal" data-ring-art="">You May Also Like</div></div>
    <section class="eps" id="eps"><div class="seasons" id="seasons"></div><div class="eprow"><div class="eptrack" id="eptrack"></div></div></section>
    <div class="ywin"><div class="ymal" id="ymal"></div></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <!-- the top bar: Short Drama detail's (Home's), the same on every detail page -->
  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV" data-href="tv-guide.html?play=MUTV&amp;from=detail">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movies" data-href="movie.html">Movies</div>
      <div class="navtab tv-tab item" data-label="Sports" data-href="sport.html">Sports</div>
      <div class="navtab tv-tab item" data-label="Store" data-href="store.html">Store</div>
    </div>
  </nav>
  <div id="toast"></div>
</div></div>

<script src="profile-panel.js"></script>
<script src="channels-data.js"></script>
<script src="content.js"></script>
<script src="packages.js"></script>
<script src="tv-screen.js"></script>
<script src="icon-toggle.js"></script>
<script src="hero-video.js"></script>
<script src="movie-detail/movie-detail-1.js"></script>
<script src="focus-ring.js"></script>
<script src="toast.js"></script>
</body>
</html>
