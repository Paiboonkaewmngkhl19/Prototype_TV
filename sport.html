<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<!--
  Sport page (Figma "PLAY:sport_mainPage", node 2464:30827), opened from the Sport tab in Home's top bar.
  A 1920x1080 TV screen scaled to the window, like home.html; the shared gliding focus ring is focus-ring.js.

  Flow (Figma "PLAY: firstScreenContent", 2385:14824):
  - Dynamic background, rows 1-6 (Live and Upcoming, sport chips, League & Tournament, Latest Highlight, TV Guide,
    the suggested league): the hero stays on screen and speaks for the focused rail (the match, "All Sport", the
    league, the highlight, "TV Guide"), over the focused item's picture, as Home's hero (bright picture, dark wash on
    the left, text pinned at the top). The focused rail sits at y=600 and the rails above it fade away. On the suggested league (UCL) its key art takes over the whole top of the screen.
  - Static background, from Football For You down: the hero and the top bar go (as on Home), the page scrolls rail by
    rail with the focused rail's title at y=200, to Back to Top at the end.
  Remote / keyboard: arrows move focus, Enter selects, Esc / Back returns to the top (then to Home).
-->
<link rel="stylesheet" href="chip-theme.css">
<link rel="stylesheet" href="tvguide-card.css">
<link rel="stylesheet" href="button-theme.css">
<link rel="stylesheet" href="corner-tag.css">
<link rel="stylesheet" href="live-ribbon.css">
<style>
  :root{
    color-scheme:dark;
    /* Figma variables (default mode) */
    /* Home's page: dark navy, Open Sans */
    --bg-0:#070e16; --wash:10,8,24;
    --surface:#070e16; --on-surface:#e8e8e8; --on-surface-variant:#a8a8a8; --surface-container:#2a2a2a;
    --surface-container-high:#3a3a3a; --outline:#5a5a5a; --outline-variant:#4a4a4a; --inverse-surface:#e8e8e8;
    --on-inverse-surface:#101010; --live:#ff1f1f;
    --th-pill:linear-gradient(135deg, rgba(244,247,253,.66) 0%, rgba(220,226,240,.58) 55%, rgba(196,204,224,.52) 100%);
    /* Home's focus fill: the frosted grey-blue glass of a focused top-bar tab, white text */
    --focus-fill:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), var(--th-pill);
    /* resting buttons: Home's chip rail, white frosted glass over a strong blur; a picked tab a little brighter */
    --idle-fill:rgba(255,255,255,.16); --idle-fill-on:rgba(255,255,255,.26);
    --ease:cubic-bezier(.2,0,0,1);
    --inter:'Open Sans', system-ui, sans-serif; --roboto:'Open Sans', system-ui, sans-serif;
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:var(--on-surface); font-family:var(--inter); -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--bg-0); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; overflow:hidden;
    background:radial-gradient(1400px 900px at 85% 110%, rgba(214,222,240,.12), transparent 70%), var(--bg-0); }   /* Home's page colour and glow */

  /* ---------- hero background (dynamic), as Home's: the focused item's picture full-screen and bright, with only a dark
     wash behind the text on the left and a fade into the page at the bottom ---------- */
  .hero-bg{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:0; overflow:hidden; transition:opacity .4s ease; }
  .hero-bg .pic{ position:absolute; inset:0; background:center 30% / cover no-repeat; opacity:0; transition:opacity .6s ease; }
  .hero-bg .pic.on{ opacity:1; }
  .hero-bg::after{ content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(var(--wash),.88) 0%, rgba(var(--wash),.62) 30%, rgba(var(--wash),.12) 58%, transparent 75%),
      linear-gradient(180deg, transparent 52%, rgba(var(--wash),.55) 74%, var(--bg-0) 96%); }
  .hero-bg .fade{ display:none; }
  body.static .hero-bg, body.ucl .hero-bg{ opacity:0; }

  /* ---------- hero text, as Home's: pinned at the top (title, meta row, description) ---------- */
  .hero{ position:absolute; left:110px; top:160px; width:1100px; z-index:3; display:flex; flex-direction:column; gap:14px;
    transition:opacity .3s ease, transform .3s var(--ease); }
  body.static .hero{ opacity:0; transform:translateY(-40px); pointer-events:none; }
  .hero.swap{ animation:heroIn .3s var(--ease); }
  @keyframes heroIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .hero h1{ max-width:820px; margin:0 0 12px; font-size:72px; font-weight:700; line-height:1.08; letter-spacing:-.01em; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.35);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  body.ucl .hero h1{ color:#fff; }
  .hero .desc{ margin:0; max-width:760px; font-size:26px; line-height:1.4; color:#fff; opacity:.82; text-shadow:0 0 6px rgba(0,0,0,.6);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .meta{ display:flex; flex-wrap:wrap; align-items:center; gap:16px; height:40px; overflow:hidden; font-size:20px; }
  .meta:empty{ display:none; }
  .badge{ height:36px; padding:0 12px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; gap:4px;
    font-weight:500; font-size:20px; color:#fff; background:var(--surface-container-high); white-space:nowrap; }
  .badge.live{ background:var(--live); }
  .badge.live::before{ content:''; width:12px; height:12px; background:url('sport-assets/dot.svg') center / contain no-repeat; }
  .badge img{ width:20px; height:20px; }
  .meta .ch{ display:inline-flex; align-items:center; gap:8px; color:var(--on-surface); white-space:nowrap; }
  .meta .ch img{ width:36px; height:36px; border-radius:40px; object-fit:cover; }
  .pill{ height:36px; padding:0 12px; border:1px solid var(--outline); border-radius:18px; display:inline-flex; align-items:center; font-weight:500; white-space:nowrap; }
  .meta b{ font-weight:700; color:#fff; }

  /* ---------- the page: Figma's rows, 60px apart, starting at y=600 (under Home's 600px hero); it moves as a whole ---------- */
  #page{ position:absolute; left:0; top:0; width:1920px; z-index:1; padding:600px 0 44px; display:flex; flex-direction:column; gap:60px;
    transition:transform .45s var(--ease); }
  .sec{ position:relative; transition:opacity .3s ease; }
  body:not(.static) .sec.above{ opacity:0; }
  .sec-title{ margin:0 110px; font-weight:500; font-size:29px; line-height:40px; color:#fff; }   /* Home's row title */
  .item{ cursor:pointer; }
  /* a rail: the track slides sideways under a fixed focus slot (Home's rule) */
  .rail{ position:relative; }
  .track{ display:flex; gap:32px; padding:8px 110px; transition:transform .35s var(--ease); width:max-content; }

  /* 16:9 card (TV / Card): 320x180 picture, radius 12, title under it; the ring wraps picture + title */
  .card{ position:relative; width:320px; flex:0 0 auto; display:flex; flex-direction:column; gap:8px; border-radius:12px; }
  .thumb{ position:relative; width:320px; height:180px; border-radius:12px; overflow:hidden; background:var(--surface-container-high) center / cover no-repeat; }
  .thumb.ph::after{ content:attr(data-ratio); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding-left:20px;
    font-size:11px; line-height:32px; font-weight:500; color:rgba(232,232,232,.5); background:url('sport-assets/ratio-icon.svg') left center / 16px no-repeat; }
  .thumb .top{ position:absolute; left:12px; top:12px; }
  .thumb .top .badge{ height:auto; line-height:normal; }
  /* duration: the corner tag (corner-tag.css) */
  .card .t{ font-size:20px; font-weight:500; line-height:normal; color:var(--on-surface); overflow:hidden; }
  .card .t.one{ white-space:nowrap; text-overflow:ellipsis; }
  .card .t.two{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-height:48px; }

  /* sport chips (TV / Chip) */
  .chips{ display:flex; gap:32px; padding:0 110px; width:max-content; transition:transform .35s var(--ease); }
  .chip{ position:relative; height:100px; min-width:180px; padding:0 40px; border-radius:26px; display:flex; align-items:center; justify-content:center; gap:20px;
    font-size:32px; line-height:32px; font-weight:500; color:var(--on-surface-variant); white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .chip::before{ content:''; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--outline-variant); opacity:.5; transition:opacity .15s ease; }
  .chip img{ width:48px; height:48px; border-radius:48px; }
  .chip.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); border-radius:24px; }
  .chip.focused::before{ opacity:0; }
  /* the sport chosen: its chip keeps the focused glass fill (no ring) while focus is elsewhere; the rails below are that sport's */
  .chip.sel:not(.focused){ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .chip.sel::before{ opacity:0; }

  /* League & Tournament: 134px discs (160 focused), 187px apart; the followed ones carry a heart */
  .leagues{ display:flex; padding:0 85px; width:max-content; margin-top:31px; transition:transform .35s var(--ease); }
  .league{ width:210px; margin-right:-23px; display:flex; flex-direction:column; align-items:center; gap:24px; }
  .disc{ position:relative; width:134px; height:134px; margin:9px 0; border-radius:50%; background:#fff;
    transition:transform .3s var(--ease), box-shadow .2s ease; }
  .disc .img{ position:absolute; inset:0; border-radius:50%; overflow:hidden; background:center / cover no-repeat; }
  .disc .img.zoom{ background-size:288% auto; }
  .disc .img.inset{ background-size:67% auto; }
  .disc .img .lg{ position:absolute; max-width:none; display:block; }   /* a Figma logo, placed in its disc by its box */
  .disc .mono{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font-family:var(--roboto); font-weight:500; font-size:26px; color:#1c1c1c; }
  .disc .fav{ position:absolute; right:-16px; bottom:-16px; width:84px; height:84px; transition:opacity .2s ease, transform .25s var(--ease); }
  .disc:not(.followed) .fav{ opacity:0; transform:scale(.6); }
  .disc.focused{ transform:scale(1.194); }   /* no stroke: the round focus ring is the outline */
  .league .name{ width:100%; height:56px; font-family:var(--roboto); font-size:22px; line-height:28px; text-align:center; color:var(--on-surface); overflow:hidden; }

  /* TV Guide rail: Home's TV Guide tile and channel cards (tvguide-card.css), all 280px tall */
  [data-row="guide"] .track{ align-items:stretch; }

  /* the suggested league (UCL): key art + glows, clipped to the section; on focus the art also fills the screen above it */
  .ucl{ height:600px; padding:80px 110px 40px; display:flex; flex-direction:column; gap:60px; }
  .ucl .back{ position:absolute; left:0; right:0; top:0; bottom:0; overflow:hidden; transition:top .45s var(--ease); }
  /* the artwork fades out at its top and bottom edges (a mask, not a colour), so it melts into the page with no band edge;
     focused, the top fade sits above the screen and the picture fills it to the top */
  .ucl .back{ -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 140px, #000 calc(100% - 200px), transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0, #000 140px, #000 calc(100% - 200px), transparent 100%); }
  body.ucl .ucl .back{ top:-600px; }
  .ucl .inner{ position:absolute; left:0; bottom:0; width:1920px; height:600px; }
  .ucl .art{ position:absolute; left:-1177px; top:-160px; width:3110px; height:1432px; max-width:none; }
  /* Figma's art starts 160px above the band; when it fills the screen above, a mirrored copy carries it on seamlessly */
  .ucl .art.top{ top:-1592px; transform:scaleY(-1); }
  .ucl .glow{ position:absolute; display:flex; align-items:center; justify-content:center; }
  .ucl .glow > div{ flex:none; }
  .ucl .glow img{ position:absolute; max-width:none; display:block; }
  .ucl .text{ position:relative; width:700px; display:flex; flex-direction:column; gap:24px; transition:opacity .3s ease; }
  body.ucl .ucl .text{ opacity:0; }
  .ucl .text h2{ margin:0; font-size:57px; font-weight:700; color:#fff; line-height:normal; }
  .ucl .text p{ margin:0; height:87px; font-size:24px; color:var(--on-surface-variant); overflow:hidden; }
  .ucl .row{ position:relative; display:flex; align-items:center; gap:60px; margin:0 -110px; }
  .ucl .row .track{ padding-right:0; }
  /* another tournament's band (ATP Tour, Formula 1): its picture fills the band, darkened behind the text */
  .ucl.plain .inner{ height:100%; }
  .ucl.plain .art{ left:0; top:0; width:100%; height:100%; object-fit:cover; }
  .ucl.plain .inner::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(8,8,24,.82) 0%, rgba(8,8,24,.45) 55%, rgba(8,8,24,.2) 100%); }
  .ucl .uclava{ width:160px; height:160px; border-radius:50%; flex:0 0 auto; background:url('sport-assets/ucl-avatar.jpg') 46% 40% / 208% auto no-repeat; }

  /* Short Highlight + Short */
  .shorts{ display:flex; gap:32px; padding:0 110px; }
  .short{ position:relative; height:570px; border-radius:32px; overflow:hidden; flex:0 0 auto; background:var(--surface-container-high); }
  .short.wide{ width:1254px; } .short.tall{ width:414px; }
  .short::before{ content:''; position:absolute; inset:0; background:var(--img) center / cover no-repeat; opacity:.6; }
  .short span{ position:absolute; left:32px; top:482px; font-family:var(--roboto); font-weight:500; font-size:48px; line-height:56px; color:var(--on-surface); }

  /* Documentary: 2:3 posters */
  .poster{ width:220px; height:330px; flex:0 0 auto; border-radius:12px; background:var(--surface-container-high) center / cover no-repeat; }
  .docs .track{ margin-top:32px; }   /* the 2:3 posters grow 13px up when focused, plus the ring and its gap: room under the title */

  /* Sport Channel: 142px discs (160 focused, no shade); no rim, the round focus ring is the outline */
  .chans{ display:flex; align-items:center; gap:32px; padding:9px 110px; width:max-content; margin-top:31px; transition:transform .35s var(--ease); }
  .chan{ position:relative; width:142px; height:142px; border-radius:50%; flex:0 0 auto; background:#000 center / cover no-repeat;
    transition:transform .3s var(--ease); }
  .chan::after{ content:''; position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.3); transition:opacity .2s ease; }
  .chan.contain{ background-color:#fff; background-size:78% auto; }
  .chan.focused{ transform:scale(1.127); }
  .chan.focused::after{ opacity:0; }

  /* Back to Top */
  .totop{ height:150px; display:flex; align-items:center; justify-content:center; }
  .totop .btn{ display:flex; align-items:center; gap:16px; padding:24px 100px; border-radius:9999px; background:var(--surface-container-high); color:var(--on-surface);
    font-weight:500; font-size:31px; line-height:41.877px; white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .totop .btn img{ width:40px; height:40px; filter:invert(1); }
  .totop .btn.focused{ background:var(--focus-fill); backdrop-filter:blur(50px) saturate(1.4); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  /* ---------- top bar (Home's), Sport is the current page ---------- */
  /* past the hero the rails get the full screen: the top bar steps away until it gets focus, with the page colour fading in behind it */
  .scrim{ position:absolute; left:0; top:0; width:1920px; height:170px; z-index:4; pointer-events:none; opacity:0; transition:opacity .3s ease;
    background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-0) 45%, rgba(7,14,22,0) 100%); }
  body.static.on-nav .scrim, body.past-first.on-nav .scrim{ opacity:1; }   /* full screen past the hero: no fade over the rails, only behind the top bar when it comes back */
  .topnav{ position:absolute; left:0; top:0; z-index:5; width:1920px; padding:24px 110px 0; display:flex; align-items:center; transition:opacity .3s ease, translate .3s var(--ease); }
  body.static:not(.on-nav) .topnav, body.past-first:not(.on-nav) .topnav{ opacity:0; translate:0 -40px; pointer-events:none; }
  .profile{ width:60px; height:60px; border-radius:999px; overflow:hidden; flex:0 0 auto; }
  .profile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .center{ display:flex; align-items:center; gap:12px; margin-left:20px; }
  .navsearch{ width:60px; height:60px; margin:0 8px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .navsearch img{ width:32px; height:32px; display:block; }
  .navtab{ height:60px; padding:0 20px; border-radius:999px; display:flex; align-items:center; font-family:'Plus Jakarta Sans', var(--inter); font-size:24px; line-height:1.2;
    color:#fff; text-shadow:0 0 6px rgba(0,0,0,.4); white-space:nowrap; }
  .topnav .item:not(.tv-tab){ transition:background .15s ease; }
  .topnav .item.focused:not(.tv-tab){ background:var(--th-pill); backdrop-filter:blur(12px) saturate(1.4); }   /* the tabs: button-theme.css */

  #toast{ position:absolute; left:50%; bottom:80px; z-index:60; transform:translateX(-50%); padding:14px 26px; border-radius:999px;
    background:rgba(20,20,24,.85); font-size:24px; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  #toast.on{ opacity:1; }
  /* resting chips and buttons: Home's chip glass; focus turns them to the glass pill */
  .chip::before{ display:none; }
  .chip:not(.focused), .totop .btn:not(.focused){
    background:var(--idle-fill); -webkit-backdrop-filter:blur(80px) saturate(1.5); backdrop-filter:blur(80px) saturate(1.5); color:var(--on-surface); }
  /* focused items grow: 8% on every rail, 6% in the top bar; the wide Short Highlight 3% (more would reach
     past the 32px gap); the league and channel discs keep their own growth */
  #screen .item{ transition:transform .22s var(--ease), background .15s ease, color .15s ease, box-shadow .2s ease; }
  #screen .item.focused{ transform:scale(1.08); z-index:2; }
  #screen .topnav .item.focused{ transform:scale(1.06); }
  #screen .short.wide.focused{ transform:scale(1.03); }
  #screen .disc.focused{ transform:scale(1.194); }
  #screen .chan.focused{ transform:scale(1.127); }
</style>
</head>
<body>
<div id="frame"><div id="screen">
  <div class="hero-bg"><div class="pic"></div><div class="pic"></div><div class="fade"></div></div>

  <div id="page"></div>

  <section class="hero" aria-live="polite"><h1></h1><div class="meta"></div><p class="desc"></p></section>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movie" data-href="movie.html">Movie</div>
      <div class="navtab tv-tab item active" data-label="Sport">Sport</div>
      <div class="navtab tv-tab item" data-label="My List">My List</div>
      <div class="navtab tv-tab item" data-label="Store" data-href="store.html">Store</div>
    </div>
  </nav>
  <div id="toast"></div>
</div></div>

<script src="profile-panel.js"></script>
<script src="channels-data.js"></script>
<script>
(function(){
  // ---- fit the 1920x1080 screen into the window ----
  var frame = document.getElementById('frame'), screen = document.getElementById('screen');
  function fit(){
    var k = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.width = 1920 * k + 'px'; frame.style.height = 1080 * k + 'px';
    frame.style.marginLeft = -960 * k + 'px'; frame.style.marginTop = -540 * k + 'px';
    screen.style.transform = 'scale(' + k + ')';
  }
  addEventListener('resize', fit); fit();

  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function attrs(o){ return Object.keys(o).filter(function(k){ return o[k] != null; }).map(function(k){ return ' data-' + k + '="' + esc(o[k]) + '"'; }).join(''); }

  /* ---------- content ----------
     Pictures are the project's own sport stills; items with no matching picture keep Figma's placeholder (ph). */
  var LS = 'tv-features-test/live-stream-assets/';
  var CH = {
    play:  {n:'PLAY Sports', no:'61', logo:'icons/channels/playsports.png', fit:'cover', crown:'gold', v:'video/football.mp4'},
    mutv:  {n:'MUTV', no:'62', logo:'icons/epg/mutv.png', fit:'cover', v:'video/football.mp4'},
    rm:    {n:'Real Madrid TV', no:'63', logo:'icons/epg/realmadrid.png', fit:'contain', bg:'#404045', v:'video/football.mp4'},
    ws:    {n:'W-Sport', no:'64', logo:'icons/epg/wsport.png', fit:'contain', v:'video/bad.mp4'},
    ag902: {n:'Asian Games', no:'902', logo:LS + 'channel-asian-games.png', fit:'contain', bg:'#fff', v:'video/vall.mp4'},
    ag907: {n:'Asian Games', no:'907', logo:'tv-features-test/shorts-assets/channel-907.png', fit:'contain', bg:'#fff', v:'video/bad.mp4'}
  };
  var MATCH_DESC = 'Live from the UEFA Champions League. Every touch in full HD with Thai and English commentary, plus the build-up and post-match analysis.';
  var LIVE = [
    {t:'Bayern München vs Arsenal', live:true, img:'posters/arsenal.jpg', ch:CH.play, time:'02:00 – 04:00'},
    {t:'Real Madrid vs RB Leipzig', live:true, img:'posters/upcoming/u2.jpg', ch:CH.rm, time:'02:00 – 04:00'},
    {t:'Liverpool vs Brentford', when:'Start in 16:12', img:'posters/upcoming/live.jpg', ch:CH.mutv, time:'16:12 – 18:15'},
    {t:'Dortmund vs Hamburg', when:'Today 20:30 PM', img:'posters/upcoming/u3.jpg', ch:CH.play, time:'20:30 – 22:30'},
    {t:'Bayern München vs Dortmund', when:'Today 21:00 PM', img:'posters/bayern-dortmund.webp', bg:'posters/bayern-dortmund-bg.webp', ch:CH.play, time:'21:00 – 23:00',
     d:'Der Klassiker on Bundesliga Matchday 8: Bayern München host Borussia Dortmund at the Allianz Arena, Munich. Live in full HD with Thai and English commentary.'},
    {t:'Mainz vs Paderborn', when:'Today 21:00 PM', img:'posters/SC.jpg', ch:CH.play, time:'21:00 – 23:00'}
  ];

    picCur = img || null;
    pics[picFront].classList.remove('on');
    picFront = 1 - picFront;
    if(img){ pics[picFront].style.backgroundImage = 'url(\'' + img + '\')'; pics[picFront].classList.add('on'); }
  }
  function chMeta(c){ return '<span class="ch"><img src="' + c.logo + '" alt=""' + (c.bg ? ' style="background:' + c.bg + ';object-fit:contain"' : '') + '>Channel ' + c.no + ': ' + esc(c.n.toUpperCase()) + ' ' + c.no + '</span>'; }
  function heroFor(el, rowKey){
    var k = el && el.dataset.kind, i = el ? +el.dataset.i : 0, set = el && el.dataset.set;
    if(k === 'match'){
      var m = SETS[set][i];
      return { t:m.t, meta:topBadge(m) + '<span class="badge"><img src="sport-assets/crown.svg" alt="">Premium</span>' + chMeta(m.ch) + '<span class="pill">' + m.time + '</span>', d:m.d || (sportCur && sportCur !== 'football' ? 'Live ' + SPORT[sportCur].label + ' in full HD with Thai and English commentary, plus the build-up and the analysis after.' : MATCH_DESC), bg:m.bg || m.img };   // bg: a screen picture of its own, else the card's
    }
    if(k === 'uclava') return { t:BAND.t, d:BAND.d, bg:null };
    if(rowKey === 'chips'){ var c = CHIPS[i]; return { t:c.t, d:c.d, bg:c.img }; }
    if(rowKey === 'leagues'){ var l = SHOWN_LEAGUES[i]; return { t:l.t, d:'Follow ' + l.t + ' for live matches, fixtures, results and highlights, all in one place.', bg:l.img }; }
    if(k === 'vod'){
      var h = SETS[set][i], g = h.g || ((sportCur ? SPORT[sportCur].label : 'Sport') + ' · Highlights');
      return { t:h.t, meta:'<span class="ch"><img src="sport-assets/channel-aisplay.jpg" alt="">AIS PLAY</span><b>' + g + '</b><span>2026</span><span>' + h.dur + '</span><span class="pill">G</span><span class="pill">HD</span>',
               d:'The best moments, the goals and the talking points, cut down so you can catch up in minutes.', bg:h.img };
    }
    if(rowKey === 'guide') return { t:'TV Guide', d:'See what’s on now and next across every sports channel, set reminders, and jump straight into a live match.', bg:'posters/tvguide-bg.jpg' };
    return null;
  }
  function paintHero(rowKey, el){
    var h = heroFor(el, rowKey);
    if(!h) return;
    var key = h.t + '|' + (h.meta || '');
    if(key !== heroKey){
      heroKey = key;
      heroEl.querySelector('h1').textContent = h.t;
      heroEl.querySelector('.meta').innerHTML = h.meta || '';
      heroEl.querySelector('.desc').textContent = h.d;
      heroEl.classList.remove('swap'); void heroEl.offsetWidth; heroEl.classList.add('swap');
    }
    setBg(h.bg);
  }

  // ---- keep the focused item in view ----
  // Sideways (Home's "fixed focus"): the focused item sits in the first item's slot and the rail slides under it,
  // until the rail's end is in; past that, focus moves on alone. Down the page: the focused rail sits at y=600 while
  // the hero shows (on the suggested league: its cards do), its title at y=200 after that (the top bar steps away, as on Home).
  var pageY = 0;
  function slide(r, el){
    if(r.key === 'totop' || r.key === 'shorts') return;
    // (offsets are all from the rail, the nearest positioned box, so a league's disc measures like a card)
    var track = el.closest('.track, .chips, .leagues, .chans');
    var want = el.offsetLeft - r.items[0].offsetLeft;
    var max = Math.max(0, track.scrollWidth - 1920 + (r.key === 'ucl' ? 110 : 0));   // the suggested league's rail has no right padding
    track.style.transform = 'translateX(' + -Math.max(0, Math.min(want, max)) + 'px)';
  }
  // the hero text ends 80px above the focused rail's first line (its title, else its cards), whatever its length
  var HERO_GAP = 80;
  function placeHero(r){
    var y = 0, e = r.sec.querySelector('.sec-title, .item');
    while(e && e !== r.sec){ y += e.offsetTop; e = e.offsetParent; }
    heroEl.style.top = 'auto';
    heroEl.style.bottom = 1080 - (r.sec.offsetTop + y - pageY - HERO_GAP) + 'px';
  }
  // where a row's cards start in the page (offsets ignore the focus scale)
  var FIRST_TOP = 659;   // the first screen's match cards' top
  function pageTop(el){ var y = 0; for(var e = el; e && e !== page; e = e.offsetParent) y += e.offsetTop; return y; }
  function firstLineTop(r){ return pageTop(r.items[0]); }   // the cards' top (a rail's title sits above, outside the area)
  function layout(ri){
    var r = rows[ri], top = r.sec.offsetTop, y;
    if(ri <= DYNAMIC_END){
      y = top - 600;
      // the first screen ends as Home's and Movie's: the chips' row 942 to 1042, nothing of the next rail showing
      if(r.key === 'live'){ var ch = rows[R.chips].sec; y = ch.offsetTop + ch.offsetHeight - 1042; }
      // the card rails (LIVE & Upcoming, Because You Watched, Highlight(s), the band's matches, TV Guide) sit where the first screen's match rail does:
      // their cards' top at y=659, whatever is above them (a title, the screen text)
      if(/^(upcoming|because|latest|ucl|highlights|leaguehl|guide)$/.test(r.key)) y = firstLineTop(r) - FIRST_TOP;
    } else {
      // past the hero, as Home's: the focused rail (its title and cards) centred in the screen under the top bar's 90px
      // (y=585), until the page's end is in
      y = Math.min(top + r.sec.offsetHeight / 2 - 585, page.offsetHeight - 1080);
    }
    pageY = r.key === 'live' ? y : Math.max(0, y);   // the first screen may sit lower than the page's own top
    page.style.transform = 'translateY(' + -pageY + 'px)';
    secs.forEach(function(s, si){ s.classList.toggle('above', si + 1 < ri); });
    document.body.classList.toggle('static', ri > DYNAMIC_END);
    document.body.classList.toggle('ucl', ri === R.ucl);
  }

  // the profile panel under the top bar's photo, as on Home (profile-panel.js)
  var profileEl = document.querySelector('.topnav .profile'), prof = ProfilePanel(profileEl, { paint:paint, toast:toast });

  function paint(){
    var inProf = prof.paint(cur.row === 0 && rows[0].items[cur.col[0]] === profileEl);   // focus is in the profile panel
    rows.forEach(function(r, ri){ r.items.forEach(function(el, ci){ el.classList.toggle('focused', !inProf && ri === cur.row && ci === cur.col[ri]); }); });
    // top-bar tab states (button-theme.css): the current page's tab is Active while the D-pad is on the bar, Active dim in the content
    var curTab = document.querySelector('.topnav .navtab.active, .topnav .navtab.active-dim');
    curTab.classList.toggle('active', cur.row === 0); curTab.classList.toggle('active-dim', cur.row !== 0);
    var ri = cur.row === 0 ? cur.from : cur.row;   // on the top bar the page stays as it was
    document.body.classList.toggle('on-nav', cur.row === 0);
    // the top bar, as Home's: gone once focus is past the first rail, back as an overlay (with its scrim) while it has focus
    document.body.classList.toggle('past-first', ri > R.live);
    layout(ri);
    var r = rows[ri], el = r.items[cur.col[ri]];
    if(cur.row) slide(r, el);
    if(ri <= DYNAMIC_END){ paintHero(r.key, el); placeHero(r); }
    try { sessionStorage.setItem('sportFocus', JSON.stringify(cur)); } catch(e){}
  }

  /* ---------- actions ---------- */
  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600); }
  // leaving for the player or the TV Guide: their Back lands on the same item here
  function leave(url){ try { sessionStorage.setItem('sportReturn', '1'); } catch(e){} location.href = url; }
  // back from the player out of the browser's page cache: the channel cards' hearts (and Time Shift) as they are now
  addEventListener('pageshow', function(e){
    if(!e.persisted) return;
    document.querySelectorAll('.epg-card[data-kind="epg"]').forEach(function(el){ el.querySelector('.epg-icons').innerHTML = epgIcons(TV.onNow(TV.byName(EPG[+el.dataset.i].tv))); });
  });
  // the Live TV player, on a sports channel
  function play(c, title){
    var q = {n:c.n, no:c.no, crown:c.crown || '', logo:c.logo, fit:c.fit || '', bg:c.bg || '', t:title, v:c.v};
    leave('live-tv-player.html?' + Object.keys(q).filter(function(k){ return q[k] !== ''; })
      .map(function(k){ return k + '=' + encodeURIComponent(q[k]); }).join('&'));
  }
  // a chip picked (focus on it, or Enter / a click): the rails below show only that sport (All Sport: everything); the chip stays marked
  function setSport(i, quiet){
    var sp = CHIPS[i].sp || '', liveCol = cur.col[R.live];
    $('.chips .chip', page).forEach(function(c, ci){ c.classList.toggle('sel', ci === i); });
    try { sessionStorage.setItem('sportPick', i); } catch(e){}
    if(sp !== sportCur){
      // the rails after the chips are rebuilt for that sport
      var after = false;
      $('.sec', page).forEach(function(sec){ if(after) sec.remove(); if(sec.dataset.row === 'chips') after = true; });
      page.insertAdjacentHTML('beforeend', renderBelow(sp));
      buildRows();
    }
    cur.col = rows.map(function(r, ri){ return ri === 0 ? cur.col[0] : r.key === 'chips' ? i : r.key === 'live' ? liveCol : 0; });
    cur.row = R.chips;
    if(!quiet) toast(sp ? 'Showing ' + CHIPS[i].t : 'Showing every sport');
  }
  function select(el){
    var k = el.dataset.kind, i = +el.dataset.i;
    el.animate([{ transform:getComputedStyle(el).transform }, { transform:(getComputedStyle(el).transform === 'none' ? '' : getComputedStyle(el).transform + ' ') + 'scale(0.97)' }], { duration:140, easing:'ease-out' });
    if(el.dataset.href){ location.href = el.dataset.href; return; }
    if(el === profileEl) return;   // its panel is already open under it
    if(k === 'match'){
      var m = SETS[el.dataset.set][i];
      if(m.live) play(m.ch, m.t); else toast('We’ll remind you when ' + m.t + ' starts');
      return;
    }
    if(k === 'chip'){ setSport(i); return; }
    if(k === 'league'){
      var on = el.classList.toggle('followed');
      toast((on ? 'Following ' : 'Unfollowed ') + SHOWN_LEAGUES[i].t);
      return;
    }
    if(k === 'guideall'){ leave('tv-guide.html'); return; }
    // channel cards play the channel in the Live TV player via the TV Guide (its programmes and mini EPG), as Home's and Movie's
    if(k === 'epg'){ leave('tv-guide.html?play=' + encodeURIComponent(EPG[i].tv) + '&from=sport'); return; }
    if(k === 'totop'){ cur.row = R.live; cur.col[R.live] = 0; paint(); return; }
    if(k === 'vod'){ toast('Now playing: ' + SETS[el.dataset.set][i].t); return; }
    if(k === 'doc'){ toast('Now playing: ' + DOCS[i].t); return; }
    if(k === 'uclava'){ toast(BAND.t); return; }
    if(k === 'short'){ toast(el.dataset.label + ' (demo)'); return; }
    toast(el.dataset.label + ' (demo)');
  }
  function back(){
    if(cur.row > R.live){ cur.row = R.live; paint(); return; }
    try { if(document.referrer && /home\.html/.test(document.referrer) && history.length > 1){ history.back(); return; } } catch(e){}
    location.href = 'home.html';
  }

  addEventListener('keydown', function(e){
    if(prof.key(e.key)){ e.preventDefault(); return; }   // the profile photo / its panel
    var r = rows[cur.row], n = r.items.length, handled = true;
    if(e.key === 'ArrowRight') cur.col[cur.row] = Math.min(n - 1, cur.col[cur.row] + 1);
    else if(e.key === 'ArrowLeft'){
      // Left on a rail's first item goes up to the top bar (its Sport tab), as on Home
      if(cur.row > 0 && cur.col[cur.row] === 0){ cur.from = cur.row; cur.row = 0; cur.col[0] = NAV_SPORT; }
      else cur.col[cur.row] = Math.max(0, cur.col[cur.row] - 1);
    }
    else if(e.key === 'ArrowUp'){
      if(cur.row === R.live){ cur.from = cur.row; cur.row = 0; cur.col[0] = NAV_SPORT; }
      else if(cur.row > 0) cur.row--;
    }
    else if(e.key === 'ArrowDown'){
      if(cur.row === 0) cur.row = cur.from || R.live;
      else cur.row = Math.min(rows.length - 1, cur.row + 1);
    }
    else if(e.key === 'Enter') select(r.items[cur.col[cur.row]]);
    else if(e.key === 'Escape' || e.key === 'Backspace') back();
    else handled = false;
    // the chips are a single filter: the chip focus lands on is the one picked (only one is ever marked), as Store's tabs
    if(handled && rows[cur.row].key === 'chips' && !rows[cur.row].items[cur.col[cur.row]].classList.contains('sel')) setSport(cur.col[cur.row], true);
    if(handled){ e.preventDefault(); paint(); }
  });
  // clicks: the top bar's items, and the page's by delegation (a chip rebuilds the rails below it)
  function clickItem(el){
    var ri = -1, ci = -1;
    rows.forEach(function(x, xi){ var j = x.items.indexOf(el); if(j >= 0){ ri = xi; ci = j; } });
    if(ri < 0) return;
    if(ri === 0) cur.from = cur.row || cur.from; cur.row = ri; cur.col[ri] = ci; paint(); select(el);
  }
  rows[0].items.forEach(function(el){ el.addEventListener('click', function(){ clickItem(el); }); });
  page.addEventListener('click', function(e){ var el = e.target.closest('.item'); if(el) clickItem(el); });

  // coming back (Back from the player or the TV Guide): the same item again
  try {
    var saved = RETURNING && JSON.parse(sessionStorage.getItem('sportFocus') || 'null');
    sessionStorage.removeItem('sportReturn');
    if(saved && saved.col && saved.col.length === rows.length){ cur = saved; if(cur.row === 0) cur.row = cur.from || R.live; }
  } catch(e){}
  if(!cur.from) cur.from = R.live;
  page.style.transition = 'none';
  paint();
  // fonts change the rows' heights: lay out again once they are in, then let the page glide
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ paint(); requestAnimationFrame(function(){ page.style.transition = ''; }); });
})();
</script>
<script src="focus-ring.js"></script>
</body>
</html>
