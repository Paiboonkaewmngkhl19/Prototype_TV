name: Deploy Home demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish everything in the repo as-is (every page and every image folder, so a new folder needs no change
      # here), with the TV's home screen (launcher.html, AIS PLAY opens Home) as the site root
      - run: |
          mkdir site
          rsync -a --exclude='.git' --exclude='.github' --exclude='site' ./ site/
          cp launcher.html site/index.html
          # Home's back button opens the Content Picker, which isn't published; send it back to Home
          mkdir -p site/tv-features-test
          echo '<!doctype html><meta charset="utf-8"><script>location.replace("../home.html")</script>' > site/tv-features-test/content-picker.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
