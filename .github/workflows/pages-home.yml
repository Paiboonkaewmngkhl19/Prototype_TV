name: Deploy Home demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the Home demo is in this repo: publish its pages and image folders as-is,
      # with home.html as the site root
      - run: |
          mkdir -p site/tv-features-test
          cp -r home.html movie-detail.html package-detail.html badges icons partners posters posters_portrait site/
          cp -r tv-features-test/live-stream-assets tv-features-test/shorts-assets site/tv-features-test/
          cp home.html site/index.html
          # Home's back button opens the Content Picker, which isn't published; send it back to Home
          echo '<!doctype html><meta charset="utf-8"><script>location.replace("../home.html")</script>' > site/tv-features-test/content-picker.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
