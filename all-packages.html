<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="package-card.css">
<!--
  All Packages (Figma Store "main_categoryFilter", node 5088:226634), opened from View All on the Store's For You rail
  (store.html; its Sports / Movies / Short Series View All open their own tab) and from See all Packages on Movie Detail.
  A 1920x1080 TV screen scaled to the window, like store.html, in Store's theme; the shared gliding focus ring is
  focus-ring.js and the package cards are Movie Detail's (package-card.css).

  - Category tabs: For You, Sports, Movies, Short Drama, AIS PLAY Bundle. A tab is picked as focus lands on it.
  - Under a tab, its filters (Figma's variants): Sports and AIS PLAY Bundle have a row of names and a row of logos,
    Movies and Short Drama a row of logos, For You none. "All" is underlined while picked; like a tab, a filter is
    picked as focus lands on it.
  - The packages that match, in one rail that slides under a fixed focus slot (Home's rule); the focused card grows
    and shows Subscribe. None match: Figma's empty state, "No packages available".
  - The top bar is the Store's (Store is the current page): it steps away while the page is browsed and comes back,
    over the page colour, on Up from the tabs or Left on a row's first item; its photo opens the profile panel
    (profile-panel.js).
  Remote / keyboard: arrows move focus, Enter subscribes (PLAY ULTIMATE opens its package page), Esc / Back goes up to
  the tabs, then back to where the page was opened from.
-->
<link rel="stylesheet" href="button-theme.css">
<link rel="stylesheet" href="all-packages/all-packages.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div id="frame"><div id="screen">
  <div id="page">
    <div class="row tabs"></div>
    <div class="row names" hidden></div>
    <div class="row logos" hidden></div>
    <div class="row cards"></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <nav class="topnav">
    <div class="profile item" data-label="Profile"><img src="icons/profile-tv.png" alt="Profile"></div>
    <div class="center">
      <div class="navsearch item" data-label="Search"><img src="icons/nav-search.svg" alt="Search"></div>
      <div class="navtab tv-tab item" data-label="Home" data-href="home.html">Home</div>
      <div class="navtab tv-tab item" data-label="Live TV">Live TV</div>
      <div class="navtab tv-tab item" data-label="Movie" data-href="movie.html">Movie</div>
      <div class="navtab tv-tab item" data-label="Sport" data-href="sport.html">Sport</div>
      <div class="navtab tv-tab item" data-label="My List">My List</div>
      <div class="navtab tv-tab item active" data-label="Store" data-href="store.html">Store</div>
    </div>
  </nav>
  <div class="empty" aria-live="polite"><i></i><b>No packages available</b><span>Try another category to find more packages.</span></div>
  <div id="toast"></div>
</div></div>

<script src="profile-panel.js"></script>
<script src="tv-screen.js"></script>
<script src="leagues.js"></script>
<script src="packages.js"></script>
<script src="all-packages/all-packages-1.js"></script>
<script src="focus-ring.js"></script>
<script src="toast.js"></script>
</body>
</html>
