<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<!--
  The TV's own home screen (Android TV launcher), the first page before an app is chosen. From a photo of the box's
  home screen: the search bar and clock on top, the favourite apps row, an app's channel row (here AIS PLAY's
  recommendations) and the Google Play row.
  Remote / keyboard: arrows move focus, Enter opens. AIS PLAY (its tile, or a title in its channel) opens the app
  (its splash, then its sign-in page login.html, then home.html; District 9 then opens its detail page); the other apps only say they aren't part of this prototype.
  Back from the top of Home comes here, onto the AIS PLAY tile.
  The launcher keeps Android TV's own focus look (the tile grows and gets a white edge, its name below), not the
  AIS PLAY app's glass ring (focus-ring.js), since this is the TV's screen and not the app's.
-->
<style>
  :root{
    --bg:#121316; --on:#e8eaed; --dim:#9aa0a6;
    --roboto:Roboto, 'Noto Sans Thai', sans-serif;
    --ease:cubic-bezier(.2,0,0,1);
  }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; color:var(--on); font-family:var(--roboto); }
  #frame{ position:absolute; left:50%; top:50%; overflow:hidden; background:var(--bg); }
  #screen{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden;
    background:radial-gradient(1500px 700px at 50% -10%, #3a3c42 0%, #1d1e22 55%, var(--bg) 100%); }

  /* ---------- top: Assistant + search, notifications, settings, clock ---------- */
  .top{ position:absolute; left:160px; right:110px; top:70px; height:80px; display:flex; align-items:center; gap:24px; }
  .search{ display:flex; align-items:center; gap:28px; height:72px; padding:0 32px 0 12px; border-radius:36px; }
  .search .ph{ font:400 30px/1 var(--roboto); color:var(--dim); white-space:nowrap; }
  .top .spacer{ flex:1; }
  .ico{ width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .ico.bell{ font:500 24px/1 Roboto, sans-serif; }
  .ico.bell span{ width:34px; height:34px; border-radius:50%; box-sizing:border-box; border:3px solid var(--on); display:flex; align-items:center; justify-content:center; }
  .clock{ margin-left:24px; font:400 44px/1 var(--roboto); color:var(--on); white-space:nowrap; }
  .top .item.focused{ background:rgba(255,255,255,.18); }

  /* ---------- rows: a round channel icon (or label) on the left, a rail of tiles to its right ---------- */
  .row{ position:absolute; left:0; right:0; }
  .row .side{ position:absolute; left:120px; width:160px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .round{ width:120px; height:120px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    transition:transform .2s var(--ease), box-shadow .2s ease; }
  .side .lbl{ font:400 28px/1.2 var(--roboto); color:var(--on); white-space:nowrap; }
  /* tiles slid along go out of sight at the rail's left edge (the channel icon stays clear); the focused tile's growth
     and its edge still show around it */
  .rail{ position:absolute; left:425px; right:0; top:0; bottom:0; clip-path:inset(-60px -60px -60px -24px); }
  .track{ position:absolute; left:0; top:0; display:flex; gap:16px; transition:transform .3s var(--ease); }
  .row{ transition:opacity .25s ease; }
  .row.dim{ opacity:.55; }   /* the rows away from focus step back */

  /* tiles: grow a little and take a white edge when focused (Android TV's focus) */
  .tile{ position:relative; flex:0 0 auto; border-radius:6px; overflow:hidden; background:#2a2b2f; cursor:pointer;
    transition:transform .2s var(--ease), box-shadow .2s ease; }
  .tile img.fill{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .tile.focused{ transform:scale(1.1); z-index:5; box-shadow:0 0 0 3px #fff, 0 18px 40px rgba(0,0,0,.6); }

  /* row 1: favourite apps, 16:9 tiles; the focused one's name shows under it */
  #rowApps{ top:262px; height:200px; }
  #rowApps .side{ top:0; }
  .app{ width:196px; height:110px; }
  .app-name{ position:absolute; left:425px; top:142px; font:400 28px/1.2 var(--roboto); color:var(--on); white-space:nowrap;
    transform:translateX(-50%); transition:left .2s var(--ease), opacity .15s ease; pointer-events:none; }
  .apps-btn{ cursor:pointer; }
  .apps-btn.focused .round{ transform:scale(1.1); box-shadow:0 0 0 3px #fff, 0 12px 30px rgba(0,0,0,.5); }
  .apps-btn .round{ background:#e04a45; }
  .grid9{ display:grid; grid-template-columns:repeat(3, 18px); gap:9px; }
  .grid9 i{ width:18px; height:18px; border-radius:3px; background:#fff; }

  /* the AIS PLAY logo (aisLogo() below): on its app tile, its channel icon and the launch screen */
  .ais{ display:block; width:100%; height:auto; }
  .tile.app.aisplay{ background:linear-gradient(135deg, #2a2b30 0%, #121215 60%, #1c1d21 100%); }
  .tile.app.aisplay::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.12) 45%, transparent 60%); }
  .tile.app.aisplay .ais{ position:absolute; left:14px; width:calc(100% - 28px); top:50%; transform:translateY(-50%); }

  /* row 2: AIS PLAY's channel, wide pictures with the app's mark in the corner; the focused one shows its title */
  #rowAis{ top:470px; height:230px; }
  #rowAis .side{ top:52px; }
  #rowAis .round{ background:#0d0d10; box-shadow:inset 0 0 0 2px rgba(255,255,255,.08); }
  .wide{ width:396px; height:222px; }
  .wide .mark{ position:absolute; left:14px; top:12px; width:34px; height:34px; }
  .wide .cap{ position:absolute; left:0; right:0; bottom:0; padding:48px 18px 14px; font:500 24px/1.2 var(--roboto); color:#fff;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.85)); opacity:0; transition:opacity .2s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wide.focused .cap{ opacity:1; }

  /* row 3: Google Play's picks, on a darker band */
  #rowPlay{ top:790px; height:230px; }
  #rowPlay::before{ content:""; position:absolute; left:0; width:425px; top:30px; height:160px; background:rgba(255,255,255,.04); }
  #rowPlay .side{ top:76px; gap:10px; }
  #rowPlay .side .lbl{ font-size:22px; color:var(--dim); }
  .gp{ display:flex; align-items:center; gap:10px; font:500 22px/1 var(--roboto); color:var(--on); }

  /* opening AIS PLAY: its splash on black (about 3.5s, then the app).
     1. a glow in the logo's colours blooms behind it
     2. the play triangle pops in at the centre, spinning a little into place
     3. it slides left to its place in the logo while AIS PLAY wipes in beside it
     4. a light sweeps across the logo (masked to its letters), and the app opens
     The triangle (aisplay-mark.png) is the logo's first 150 of 800px, so at 640px wide it is 120px and starts 260px in,
     at the centre; the wordmark is the whole logo with that part clipped off */
  #launch{ position:absolute; inset:0; z-index:50; background:#000; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #launch.on{ opacity:1; pointer-events:auto; }
  #launch .glow{ position:absolute; left:50%; top:50%; width:1100px; height:1100px; margin:-550px 0 0 -550px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,10,160,.22) 0%, rgba(242,200,0,.12) 30%, rgba(140,190,30,.06) 50%, transparent 68%);
    opacity:0; transform:scale(.3); }
  #launch .stage{ position:relative; width:640px; height:130px; }
  #launch .tri{ position:absolute; left:0; top:0; width:120px; opacity:0; transform:translateX(260px) scale(.3) rotate(-35deg); }
  #launch .word{ position:absolute; left:0; top:0; width:640px; clip-path:inset(0 100% 0 18.75%); }
  #launch .shine{ position:absolute; inset:0; opacity:0;
    -webkit-mask:url(icons/aisplay-logo.png) 0 0 / 100% 100% no-repeat; mask:url(icons/aisplay-logo.png) 0 0 / 100% 100% no-repeat;
    background:linear-gradient(105deg, transparent 43%, rgba(255,255,255,.55) 47.5%, #fff 50%, rgba(255,255,255,.55) 52.5%, transparent 57%) 0 0 / 300% 100% no-repeat; }
  #launch.on .glow{ animation:splGlow 2.3s ease-out .15s forwards; }
  #launch.on .stage{ animation:splStage 3.4s var(--ease) forwards; }
  #launch.on .tri{ animation:splTriIn .85s cubic-bezier(.3,1.5,.5,1) .3s forwards, splTriMove .9s var(--ease) 1.35s forwards; }
  #launch.on .word{ animation:splWord 1.05s var(--ease) 1.5s forwards; }
  #launch.on .shine{ animation:splShine 1.1s ease-in-out 2.35s forwards; }
  @keyframes splGlow{ 0%{ opacity:0; transform:scale(.3); } 45%{ opacity:1; } 100%{ opacity:.55; transform:scale(1); } }
  @keyframes splStage{ from{ transform:scale(.96); } to{ transform:none; } }
  @keyframes splTriIn{ from{ opacity:0; transform:translateX(260px) scale(.3) rotate(-35deg); } to{ opacity:1; transform:translateX(260px) scale(1) rotate(0); } }
  @keyframes splTriMove{ from{ opacity:1; transform:translateX(260px) scale(1) rotate(0); } to{ opacity:1; transform:translateX(0) scale(1) rotate(0); } }
  @keyframes splWord{ from{ clip-path:inset(0 100% 0 18.75%); transform:translateX(-30px); } to{ clip-path:inset(0 0 0 18.75%); transform:none; } }
  @keyframes splShine{ 0%{ opacity:1; background-position:100% 0; } 100%{ opacity:1; background-position:0 0; } }
  /* reduced motion: the finished logo fades in, nothing moves */
  @media (prefers-reduced-motion: reduce){
    #launch.on .glow, #launch.on .stage, #launch.on .shine{ animation:none; }
    #launch.on .tri{ animation:none; opacity:1; transform:none; }
    #launch.on .word{ animation:none; clip-path:inset(0 0 0 18.75%); }
  }

  #toast{ position:absolute; left:50%; bottom:60px; transform:translateX(-50%); padding:18px 32px; border-radius:12px;
    background:rgba(32,33,36,.95); font:400 26px/1.2 var(--roboto); color:var(--on); opacity:0; transition:opacity .2s ease;
    pointer-events:none; white-space:nowrap; z-index:40; }
  #toast.on{ opacity:1; }
</style>
</head>
<body>
<div id="frame"><div id="screen">

  <div class="top">
    <div class="search item" data-act="search">
      <!-- Google Assistant -->
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="22" cy="24" r="14" fill="#4285F4"/><circle cx="47" cy="22" r="5" fill="#EA4335"/>
        <circle cx="45" cy="44" r="9" fill="#FBBC05"/><circle cx="56" cy="34" r="4" fill="#34A853"/>
      </svg>
      <span class="ph">ค้นหาภาพยนตร์ รายการทีวี และอีกมากมาย</span>
    </div>
    <div class="spacer"></div>
    <div class="ico bell item" data-act="notifications"><span>1</span></div>
    <div class="ico item" data-act="settings">
      <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#e8eaed" stroke-width="1.6" stroke-linejoin="round" d="M19.14 12.94a7.4 7.4 0 0 0 0-1.88l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="row" id="rowApps">
    <div class="side apps-btn item" data-act="apps"><div class="round"><div class="grid9"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="lbl">แอป</div></div>
    <div class="rail"><div class="track" id="apps"></div></div>
    <div class="app-name" id="appName"></div>
  </div>

  <div class="row" id="rowAis">
    <div class="side"><div class="round" id="aisRound"></div><div class="lbl">AIS PLAY</div></div>
    <div class="rail"><div class="track" id="aisRow"></div></div>
  </div>

  <div class="row" id="rowPlay">
    <div class="side"><div class="lbl">นำเสนอโดย</div>
      <div class="gp"><svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true"><path d="M1 1l14 13L1 27z" fill="#00d7fe"/><path d="M1 1l18 10-4 3z" fill="#00f076"/><path d="M1 27l14-13 4 3z" fill="#ff3a44"/><path d="M19 11l6 3-6 3-4-3z" fill="#ffd400"/></svg>Google Play</div>
    </div>
    <div class="rail"><div class="track" id="playRow"></div></div>
  </div>

  <div id="launch"></div>
  <div id="toast"></div>
</div></div>

<script>
(function(){
  var frame = document.getElementById('frame'), screen = document.getElementById('screen');
  function fit(){
    var K = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.width = 1920 * K + 'px'; frame.style.height = 1080 * K + 'px';
    frame.style.marginLeft = -960 * K + 'px'; frame.style.marginTop = -540 * K + 'px';
    screen.style.transform = 'scale(' + K + ')';
  }
  addEventListener('resize', fit); fit();
  function byId(id){ return document.getElementById(id); }
  function $(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* the AIS PLAY logo (the brand artwork, white AIS on a transparent ground); its play triangle alone marks the titles */
  function aisLogo(markOnly){
    return markOnly ? '<img class="ais" src="icons/aisplay-mark.png" alt="">' : '<img class="ais" src="icons/aisplay-logo.png" alt="AIS PLAY">';
  }

  /* ---------- content ---------- */
  var APPS = [
    {n:'AIS PLAY', ais:true},
    {n:'Netflix', img:'partners/netflix.png'},
    {n:'Viu', img:'partners/viu.png'},
    {n:'YouTube', img:'partners/youtube.png'},
    {n:'Prime Video', img:'partners/prime.png'},
    {n:'Disney+ Hotstar', img:'partners/disney.png'},
    {n:'HBO Max', img:'partners/hbo.png'},
    {n:'WeTV', img:'partners/wetv.png'},
    {n:'iQIYI', img:'partners/iqiyi.png'},
    {n:'MONOMAX', img:'partners/monomax.png'},
    {n:'TrueID', img:'partners/trueid.png'}
  ];
  // AIS PLAY's channel on the launcher: what's on the app's Home (District 9 opens straight on its detail page)
  var AIS = [
    {t:'District 9', img:'posters/district9.jpg', href:'movie-detail.html'},
    {t:'Game of Thrones: House of the Dragon', img:'posters/house-of-the-dragon.jpg'},
    {t:'The Last of Us', img:'posters/last-of-us.jpg'},
    {t:'F1 The Movie', img:'posters/f1.jpg'},
    {t:'Wicked', img:'posters/wicked.jpg'},
    {t:'Superman', img:'posters/superman.jpg'},
    {t:'Top Gun: Maverick', img:'posters/topgun-m.jpg'},
    {t:'Loki', img:'posters/loki.jpg'},
    {t:'How to Train Your Dragon', img:'posters/how-to-train.jpg'}
  ];
  var PLAY = [
    {n:'iQIYI', img:'partners/iqiyi.png'},
    {n:'WeTV', img:'partners/wetv.png'},
    {n:'MONOMAX', img:'partners/monomax.png'},
    {n:'TrueID', img:'partners/trueid.png'},
    {n:'Prime Video', img:'partners/prime.png'},
    {n:'Disney+ Hotstar', img:'partners/disney.png'}
  ];

  byId('apps').innerHTML = APPS.map(function(a){
    return '<div class="tile app item' + (a.ais ? ' aisplay' : '') + '" data-name="' + esc(a.n) + '"' + (a.ais ? ' data-act="aisplay"' : '') + '>' +
      (a.ais ? aisLogo() : '<img class="fill" src="' + a.img + '" alt="">') + '</div>';
  }).join('');
  byId('aisRound').innerHTML = '<div style="width:86px">' + aisLogo() + '</div>';
  byId('aisRow').innerHTML = AIS.map(function(c){
    return '<div class="tile wide item" data-act="aisplay" data-name="' + esc(c.t) + '"' + (c.href ? ' data-href="' + c.href + '"' : '') + '>' +
      '<img class="fill" src="' + c.img + '" alt=""><div class="mark">' + aisLogo(true) + '</div><div class="cap">' + esc(c.t) + '</div></div>';
  }).join('');
  byId('playRow').innerHTML = PLAY.map(function(a){
    return '<div class="tile wide item" data-name="' + esc(a.n) + '"><img class="fill" src="' + a.img + '" alt=""></div>';
  }).join('');
  byId('launch').innerHTML = '<div class="glow"></div><div class="stage">' +
    '<img class="tri" src="icons/aisplay-mark.png" alt=""><img class="word" src="icons/aisplay-logo.png" alt="AIS PLAY"><div class="shine"></div></div>';

  // the clock, as the box shows it in Thai ("10:19 น.")
  function clock(){ var d = new Date(); byId('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.'; }
  clock(); setInterval(clock, 10000);

  /* ---------- focus: rows top to bottom, Left / Right along a row; each row remembers its place ---------- */
  var ROWS = [
    {el:null, items:$('.top .item')},
    {el:byId('rowApps'), items:[$('.apps-btn')[0]].concat($('.tile', byId('apps')))},
    {el:byId('rowAis'), items:$('.tile', byId('aisRow'))},
    {el:byId('rowPlay'), items:$('.tile', byId('playRow'))}
  ];
  var row = 1, cols = [0, 1, 0, 0];   // first focus: the AIS PLAY tile
  // back from the app (Back at the top of its Home): focus where it was left
  try { var ret = JSON.parse(sessionStorage.getItem('launcherFocus') || 'null'); if(ret){ row = ret.row; cols = ret.cols; } } catch(e){}

  function paint(){
    $('.focused').forEach(function(e){ e.classList.remove('focused'); });
    var el = ROWS[row].items[cols[row]]; el.classList.add('focused');
    ROWS.forEach(function(r, i){ if(r.el) r.el.classList.toggle('dim', row !== i && row !== 0); });
    // a rail slides only when the focused tile would run off its right edge (or back past its left), as on the box
    var track = el.parentElement;
    if(track.classList.contains('track')){
      var viewW = 1920 - 425 - 90, x = +(track.dataset.x || 0), l = el.offsetLeft, r = l + el.offsetWidth;
      if(r - x > viewW) x = r - viewW;
      if(l < x) x = l;
      track.dataset.x = x; track.style.transform = 'translateX(' + (-x) + 'px)';
    }
    // the favourite apps row names the focused app under its tile
    var name = byId('appName');
    if(row === 1 && el.classList.contains('app')){
      var tr = byId('apps');
      name.textContent = el.dataset.name; name.style.opacity = 1;
      name.style.left = 425 + el.offsetLeft - (+(tr.dataset.x || 0)) + el.offsetWidth / 2 + 'px';
    } else name.style.opacity = 0;
  }

  var toastEl = byId('toast'), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800); }

  var launching = false;
  function open(el){
    if(el.dataset.act === 'aisplay'){
      try { sessionStorage.setItem('launcherFocus', JSON.stringify({row:row, cols:cols})); } catch(e){}
      launching = true;
      byId('launch').classList.add('on');
      // the splash plays through (a short fade in with reduced motion), then the app
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // then the app's sign-in page, which goes on to Home (or the title picked here) once signed in
      var to = 'login.html' + (el.dataset.href ? '?next=' + encodeURIComponent(el.dataset.href) : '');
      setTimeout(function(){ location.href = to; }, reduced ? 900 : 3500);
      return;
    }
    var act = el.dataset.act;
    if(act === 'search') toast('ค้นหาด้วยเสียงยังไม่พร้อมใช้งานในต้นแบบนี้');
    else if(act === 'notifications') toast('การแจ้งเตือน 1 รายการ');
    else if(act === 'settings') toast('การตั้งค่ายังไม่พร้อมใช้งานในต้นแบบนี้');
    else if(act === 'apps') toast('แอปทั้งหมดยังไม่พร้อมใช้งานในต้นแบบนี้');
    else toast(el.dataset.name + ' ยังไม่พร้อมใช้งานในต้นแบบนี้ · เปิด AIS PLAY ได้');
  }

  document.addEventListener('keydown', function(e){
    if(launching) return;
    var k = e.key;
    if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].indexOf(k) < 0) return;
    e.preventDefault();
    var items = ROWS[row].items;
    if(k === 'ArrowUp' && row > 0) row--;
    else if(k === 'ArrowDown' && row < ROWS.length - 1) row++;
    else if(k === 'ArrowLeft') cols[row] = Math.max(0, cols[row] - 1);
    else if(k === 'ArrowRight') cols[row] = Math.min(items.length - 1, cols[row] + 1);
    else if(k === 'Enter' || k === ' '){ open(items[cols[row]]); return; }
    paint();
  });
  ROWS.forEach(function(r, ri){
    r.items.forEach(function(el, ci){
      el.addEventListener('click', function(){ if(launching) return; row = ri; cols[ri] = ci; paint(); open(el); });
    });
  });
  // back here from the app through the browser's cache: the launch screen is still up, so put it away
  addEventListener('pageshow', function(){ launching = false; byId('launch').classList.remove('on'); });

  paint();
})();
</script>
</body>
</html>
